<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Print QR Code - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="print-qr.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <!-- PENTING: Tambah data-manager.js untuk konsistensi cache -->
    <script src="data-manager.js"></script>
    <script src="floating-actions.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="print-qr-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="print-qr-title"><i class="fas fa-qrcode"></i>Print QR Code</h1>
        <div id="headerMenuTrigger" style="cursor: pointer; color: white;">
            <i class="fas fa-ellipsis-v" style="font-size: 20px;"></i>
        </div>
    </div>

    <!-- Search & Filter Section -->
    <div class="search-section">
        <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search Part Name, Part No, or Location..." onkeyup="filterProducts()">
        </div>
        
        <div class="filter-sort-container">
            <div class="category-filter-container" id="categoryFilter">
                <div class="category-chip active" onclick="setCategoryFilter('all', this)">All</div>
                <div class="category-chip" onclick="setCategoryFilter('Maintenance', this)">Maintenance</div>
                <div class="category-chip" onclick="setCategoryFilter('Consumable', this)">Consumable</div>
                <div class="category-chip" onclick="setCategoryFilter('Tools', this)">Tools</div>
                <div class="category-chip" onclick="setCategoryFilter('Safety', this)">Safety</div>
                <div class="category-chip" onclick="setCategoryFilter('Kaizen', this)">Kaizen</div>
                <div class="category-chip" onclick="setCategoryFilter('5s', this)">5s</div>
            </div>
            
            <div style="position: relative;">
                <button class="sort-btn" id="sortBtn" onclick="toggleSortMenu()">
                    <i class="fas fa-sort-amount-down"></i>
                </button>
                <div class="sort-dropdown" id="sortDropdown">
                    <div class="sort-option active" onclick="setSortOrder('default', this)">
                        <i class="fas fa-check"></i> Default Order
                    </div>
                    <div class="sort-option" onclick="setSortOrder('name', this)">
                        <i class="fas fa-font"></i> Sort by Name
                    </div>
                    <div class="sort-option" onclick="setSortOrder('partNo', this)">
                        <i class="fas fa-barcode"></i> Sort by Part No
                    </div>
                    <div class="sort-option" onclick="setSortOrder('location', this)">
                        <i class="fas fa-map-marker-alt"></i> Sort by Location
                    </div>
                </div>
            </div>
        </div>
        
        <div class="selected-info" id="selectedInfo">
            <i class="fas fa-check-circle"></i>
            <span id="selectedCount">0</span> item(s) selected
        </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid">
        <div class="loading-container">
            <i class="fas fa-spinner fa-spin"></i>
            <div>Loading products...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProducts = [];
        let filteredProducts = [];
        let currentCategory = 'all';
        let currentSort = 'default';
        const PRODUCT_CACHE_KEY = 'ma_inventory_product_list';
        const CACHE_EXPIRY = 5 * 60 * 1000;
        const PROD_IMG_PREFIX = 'ma_prod_img';

        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            
            // Close sort dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#sortBtn') && !e.target.closest('#sortDropdown')) {
                    document.getElementById('sortDropdown').classList.remove('show');
                }
            });
            
            // Initialize Floating Action Menu
            if (typeof HeaderMenu !== 'undefined') {
                HeaderMenu.init({
                    triggerId: 'headerMenuTrigger',
                    buttons: [
                        { 
                            icon: 'fas fa-check-double', 
                            title: 'Select All', 
                            color: '#1a73e8', 
                            action: toggleSelectAll 
                        },
                        { 
                            icon: 'fas fa-print', 
                            title: 'Print Selected', 
                            color: '#6c757d', 
                            action: printSelected 
                        },
                        { 
                            icon: 'fas fa-download', 
                            title: 'Download Selected', 
                            color: '#28a745', 
                            action: downloadSelected 
                        },
                        { 
                            icon: 'fas fa-share-alt', 
                            title: 'Share Selected', 
                            color: '#17a2b8', 
                            action: shareSelected 
                        }
                    ]
                });
            }
        });

        // FUNGSI CACHE GAMBAR MENGGUNAKAN DATA MANAGER (KONSISTEN DENGAN PAGE LAIN)
        function getCachedProductImage(partNo) {
            try {
                if (typeof DataManager !== 'undefined') {
                    return DataManager.getCachedImage(PROD_IMG_PREFIX, partNo);
                } else {
                    const key = PROD_IMG_PREFIX + '_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                    const item = localStorage.getItem(key);
                    if (!item) return null;
                    const parsed = JSON.parse(item);
                    if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) return parsed.base64;
                    localStorage.removeItem(key);
                    return null;
                }
            } catch(e) { return null; }
        }

        function setCachedProductImage(partNo, base64) {
            try {
                if (typeof DataManager !== 'undefined') {
                    DataManager.setCachedImage(PROD_IMG_PREFIX, partNo, base64);
                } else {
                    const key = PROD_IMG_PREFIX + '_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                    localStorage.setItem(key, JSON.stringify({ base64: base64, timestamp: new Date().getTime() }));
                }
            } catch(e) { console.warn('Cache failed:', e); }
        }

        async function loadProducts() {
            const container = document.getElementById('productGrid');
            
            // Cuba ambil dari cache dahulu untuk paparan serta-merta
            const cachedData = localStorage.getItem(PRODUCT_CACHE_KEY);
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                        allProducts = parsed.data;
                        filterProducts();
                        return; // Exit awal, tiada loading spinner
                    }
                } catch(e) { console.error("Cache error", e); }
            }

            // Jika tiada cache atau sudah expired, fetch dari API
            container.innerHTML = '<div class="loading-container"><i class="fas fa-spinner fa-spin"></i><div>Loading products...</div></div>';
            try {
                const res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
                const result = await res.json();
                if (result.success && result.products) {
                    allProducts = result.products;
                    localStorage.setItem(PRODUCT_CACHE_KEY, JSON.stringify({ data: allProducts, timestamp: new Date().getTime() }));
                    filterProducts();
                } else {
                    container.innerHTML = '<div class="loading-container">No products found</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<div class="loading-container" style="color: #dc3545;">Failed to load data</div>';
            }
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredProducts = allProducts.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.partName.toLowerCase().includes(searchTerm) || 
                                   p.partNo.toLowerCase().includes(searchTerm) ||
                                   (p.location && p.location.toLowerCase().includes(searchTerm));
                return matchCategory && matchSearch;
            });
            
            // Apply sorting
            if (currentSort === 'name') {
                filteredProducts.sort((a, b) => a.partName.localeCompare(b.partName));
            } else if (currentSort === 'partNo') {
                filteredProducts.sort((a, b) => a.partNo.localeCompare(b.partNo));
            } else if (currentSort === 'location') {
                filteredProducts.sort((a, b) => (a.location || '').localeCompare(b.location || ''));
            }
            
            renderProducts(filteredProducts);
        }

        function setCategoryFilter(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            filterProducts();
        }

        function toggleSortMenu() {
            const dropdown = document.getElementById('sortDropdown');
            dropdown.classList.toggle('show');
        }

        function setSortOrder(order, element) {
            currentSort = order;
            document.querySelectorAll('.sort-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            
            const sortBtn = document.getElementById('sortBtn');
            if (order !== 'default') {
                sortBtn.classList.add('active');
            } else {
                sortBtn.classList.remove('active');
            }
            
            document.getElementById('sortDropdown').classList.remove('show');
            filterProducts();
        }

        function renderProducts(products) {
            const container = document.getElementById('productGrid');
            if (products.length === 0) {
                container.innerHTML = '<div class="loading-container">No results found</div>';
                return;
            }

            let html = '';
            products.forEach((product, index) => {
                const qrData = `MA Inventory\nPart Name: ${product.partName}\nPart No: ${product.partNo}\nNo. Spec: ${product.noSpec || '-'}`;
                const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(qrData);
                const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                const cachedImg = getCachedProductImage(product.partNo);
                const isSelected = product.selected ? 'selected' : '';
                const originalIndex = allProducts.indexOf(product);

                let imageContent = '';
                if (cachedImg) {
                    imageContent = `<img src="${cachedImg}" alt="${product.partName}">`;
                } else if (product.pictureFileId) {
                    imageContent = `<div class="print-card-image-placeholder" id="img-placeholder-${safePartNo}" data-fileid="${product.pictureFileId}"><i class="fas fa-spinner fa-spin"></i></div>`;
                } else {
                    imageContent = '<div class="print-card-image-placeholder"><i class="fas fa-box"></i></div>';
                }

                html += `
                    <div class="print-card ${isSelected}" id="card-${originalIndex}" data-index="${originalIndex}" onclick="toggleCardSelection(${originalIndex})">
                        <div class="selected-badge"><i class="fas fa-check"></i></div>
                        <div class="print-card-header">
                            <div class="print-card-title">${product.partName}</div>
                        </div>
                        
                        <div class="print-card-info">
                            <div class="print-info-row">
                                <span class="print-info-label">Part No.</span>
                                <span class="print-info-colon">:</span>
                                <span class="print-info-value">${product.partNo}</span>
                            </div>
                            <div class="print-info-row">
                                <span class="print-info-label">Location</span>
                                <span class="print-info-colon">:</span>
                                <span class="print-info-value">${product.location || '-'}</span>
                            </div>
                        </div>
                        
                        <div class="print-card-body">
                            <div class="print-card-image" id="card-img-${safePartNo}">
                                ${imageContent}
                            </div>
                            <div class="print-card-qr">
                                <img src="${qrUrl}" alt="QR Code" crossorigin="anonymous">
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // Load images secara background (Pattern sama seperti product-list)
            products.forEach(product => {
                if (product.pictureFileId && !getCachedProductImage(product.partNo)) {
                    const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    const placeholderEl = document.getElementById(`img-placeholder-${safePartNo}`);
                    
                    if (placeholderEl && typeof APIHelper !== 'undefined') {
                        APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                            if (imgResult.success && imgResult.base64) {
                                setCachedProductImage(product.partNo, imgResult.base64);
                                if (placeholderEl && placeholderEl.parentNode) {
                                    placeholderEl.outerHTML = `<img src="${imgResult.base64}" alt="${product.partName}">`;
                                }
                            }
                        }).catch(err => {
                            console.error('Error loading image:', err);
                            if (placeholderEl && placeholderEl.parentNode) {
                                placeholderEl.innerHTML = '<i class="fas fa-box"></i>';
                            }
                        });
                    }
                }
            });
        }

        function toggleCardSelection(index) {
            allProducts[index].selected = !allProducts[index].selected;
            const card = document.getElementById(`card-${index}`);
            
            if (allProducts[index].selected) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
            updateSelectedInfo();
        }

        function toggleSelectAll() {
            const allSelected = filteredProducts.every(p => p.selected);
            const newState = !allSelected;
            
            filteredProducts.forEach(product => {
                product.selected = newState;
                const originalIndex = allProducts.indexOf(product);
                const card = document.getElementById(`card-${originalIndex}`);
                if (card) {
                    if (newState) {
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                    }
                }
            });
            updateSelectedInfo();
            if (typeof Utils !== 'undefined') {
                Utils.showToast(newState ? '✅ All items selected' : 'All items deselected', 'info');
            }
        }

        function updateSelectedInfo() {
            const count = allProducts.filter(p => p.selected).length;
            const infoDiv = document.getElementById('selectedInfo');
            const countSpan = document.getElementById('selectedCount');
            
            countSpan.textContent = count;
            
            if (count > 0) {
                infoDiv.classList.add('show');
            } else {
                infoDiv.classList.remove('show');
            }
        }

        function getSelectedProducts() { return allProducts.filter(p => p.selected); }

        function printSelected() {
            const selected = getSelectedProducts();
            if (selected.length === 0) { 
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning'); 
                return; 
            }
            window.print();
        }

        async function downloadSelected() {
            const selected = getSelectedProducts();
            if (selected.length === 0) { 
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning'); 
                return; 
            }
            if (typeof Utils !== 'undefined') Utils.showToast('⏳ Generating images...', 'info');
            let downloadCount = 0;

            for (const product of selected) {
                const index = allProducts.indexOf(product);
                const card = document.getElementById(`card-${index}`);
                if (card) {
                    try {
                        const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false });
                        canvas.toBlob(function(blob) {
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.download = `QR_${product.partNo}.png`;
                            link.href = url;
                            link.click();
                            URL.revokeObjectURL(url);
                        }, 'image/png');
                        downloadCount++;
                        await new Promise(r => setTimeout(r, 600));
                    } catch (err) { console.error('Error:', err); }
                }
            }
            if (typeof Utils !== 'undefined') Utils.showToast(`✅ Downloaded ${downloadCount} image(s)!`, 'success');
        }

        async function shareSelected() {
            const selected = getSelectedProducts();
            if (selected.length === 0) { 
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning'); 
                return; 
            }
            if (typeof Utils !== 'undefined') Utils.showToast('⏳ Preparing files...', 'info');
            const files = [];

            for (const product of selected) {
                const index = allProducts.indexOf(product);
                const card = document.getElementById(`card-${index}`);
                if (card) {
                    try {
                        const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false });
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                        files.push(new File([blob], `QR_${product.partNo}.png`, { type: 'image/png' }));
                    } catch (err) { console.error('Error:', err); }
                }
            }

            if (files.length === 0) { 
                if (typeof Utils !== 'undefined') Utils.showToast('❌ Failed to generate images!', 'error'); 
                return; 
            }

            if (navigator.canShare && navigator.canShare({ files: files })) {
                try {
                    await navigator.share({ files: files, title: 'MA Inventory QR Codes', text: `${files.length} product QR code(s)` });
                    if (typeof Utils !== 'undefined') Utils.showToast(`✅ Shared ${files.length} image(s)!`, 'success');
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        for (const file of files) {
                            const url = URL.createObjectURL(file);
                            const link = document.createElement('a');
                            link.download = file.name;
                            link.href = url;
                            link.click();
                            URL.revokeObjectURL(url);
                            await new Promise(r => setTimeout(r, 500));
                        }
                        if (typeof Utils !== 'undefined') Utils.showToast(`✅ ${files.length} image(s) downloaded`, 'info');
                    }
                }
            } else {
                for (const file of files) {
                    const url = URL.createObjectURL(file);
                    const link = document.createElement('a');
                    link.download = file.name;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                    await new Promise(r => setTimeout(r, 500));
                }
                if (typeof Utils !== 'undefined') Utils.showToast(`✅ ${files.length} image(s) downloaded!`, 'success');
            }
        }
    </script>
</body>
</html>
