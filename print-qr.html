<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Print QR Code - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="config.js"></script>
    <script src="floating-actions.js"></script>
</head>
<body>

    <div class="page-header">
        <div class="header-left">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1 class="page-title">Print QR Code</h1>
        </div>
        <div id="headerMenuTrigger" style="cursor: pointer; color: white; padding: 8px; -webkit-tap-highlight-color: transparent; user-select: none;">
            <i class="fas fa-ellipsis-v" style="font-size: 22px;"></i>
        </div>
    </div>

    <div class="search-section">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Cari Part Name, No..." onkeyup="filterProducts()">
            <div class="select-all-container">
                <div class="custom-checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()"></div>
                <label onclick="toggleSelectAll()">Pilih Semua</label>
            </div>
        </div>
    </div>

    <div class="product-grid" id="productGrid">
        <div class="loading-container">
            <i class="fas fa-spinner fa-spin"></i>
            <div>Memuatkan produk...</div>
        </div>
    </div>

    <script>
        let allProducts = [];
        const PRODUCT_CACHE_KEY = 'ma_inventory_product_list';
        const CACHE_EXPIRY = 5 * 60 * 1000;

        function getCachedProductImage(partNo) {
            try {
                const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                const item = localStorage.getItem(key);
                if (!item) return null;
                const parsed = JSON.parse(item);
                if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) return parsed.base64;
                localStorage.removeItem(key);
                return null;
            } catch(e) { return null; }
        }

        function setCachedProductImage(partNo, base64) {
            try {
                const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                localStorage.setItem(key, JSON.stringify({ base64: base64, timestamp: new Date().getTime() }));
            } catch(e) { console.warn('Cache failed:', e); }
        }

        function showToast(message, type = 'info') {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function loadProducts() {
            const cachedData = localStorage.getItem(PRODUCT_CACHE_KEY);
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                        allProducts = parsed.data;
                        renderProducts(allProducts);
                        return;
                    }
                } catch(e) { console.error("Cache error", e); }
            }

            try {
                const res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
                const result = await res.json();
                if (result.success && result.products) {
                    allProducts = result.products;
                    localStorage.setItem(PRODUCT_CACHE_KEY, JSON.stringify({ data: allProducts, timestamp: new Date().getTime() }));
                    renderProducts(allProducts);
                } else {
                    document.getElementById('productGrid').innerHTML = '<div class="loading-container">Tiada produk dijumpai</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('productGrid').innerHTML = '<div class="loading-container" style="color: #dc3545;">Gagal memuatkan data</div>';
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('productGrid');
            if (products.length === 0) {
                container.innerHTML = '<div class="loading-container">Tiada hasil carian</div>';
                return;
            }

            let html = '';
            products.forEach((product, index) => {
                const qrData = `MA Inventory\nPart Name: ${product.partName}\nPart No: ${product.partNo}\nNo. Spec: ${product.noSpec || '-'}`;
                const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(qrData);
                const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                const cachedImg = getCachedProductImage(product.partNo);
                const isSelected = product.selected ? 'selected' : '';
                const isChecked = product.selected ? 'checked' : '';

                let imageContent = '';
                if (cachedImg) {
                    imageContent = `<img src="${cachedImg}" alt="${product.partName}">`;
                } else if (product.pictureFileId) {
                    imageContent = `<div class="print-card-image-placeholder" id="img-placeholder-${safePartNo}" data-fileid="${product.pictureFileId}"><i class="fas fa-spinner fa-spin"></i></div>`;
                } else {
                    imageContent = '<div class="print-card-image-placeholder"><i class="fas fa-box"></i></div>';
                }

                html += `
                    <div class="print-card ${isSelected}" id="card-${index}" data-partno="${product.partNo}" data-index="${index}">
                        <div class="print-card-header">
                            <div class="print-card-title">${product.partName}</div>
                            <div class="print-card-checkbox">
                                <div class="custom-checkbox ${isChecked}" data-index="${index}" onclick="handleCheckboxClick(${index})"></div>
                            </div>
                        </div>
                        
                        <div class="print-card-info card-clickable" onclick="goToProductDetail('${product.partNo}')">
                            <div class="print-info-row">
                                <span class="print-info-label">Part No.</span>
                                <span class="print-info-colon">:</span>
                                <span class="print-info-value">${product.partNo}</span>
                            </div>
                            <div class="print-info-row">
                                <span class="print-info-label">Location</span>
                                <span class="print-info-colon">:</span>
                                <span class="print-info-value">${product.location || '-'}</span>
                            </div>
                        </div>
                        
                        <div class="print-card-body">
                            <div class="print-card-image card-clickable" id="card-img-${safePartNo}" onclick="goToProductDetail('${product.partNo}')">
                                ${imageContent}
                            </div>
                            <div class="print-card-qr">
                                <img src="${qrUrl}" alt="QR Code" crossorigin="anonymous">
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            products.forEach(product => {
                if (product.pictureFileId && !getCachedProductImage(product.partNo)) {
                    const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    const placeholderEl = document.getElementById(`img-placeholder-${safePartNo}`);
                    
                    if (placeholderEl) {
                        APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                            if (imgResult.success && imgResult.base64) {
                                setCachedProductImage(product.partNo, imgResult.base64);
                                placeholderEl.outerHTML = `<img src="${imgResult.base64}" alt="${product.partName}">`;
                            }
                        }).catch(err => {
                            console.error('Error loading image:', err);
                            if (placeholderEl) {
                                placeholderEl.innerHTML = '<i class="fas fa-box"></i>';
                            }
                        });
                    }
                }
            });
        }

        function handleCheckboxClick(index) {
            allProducts[index].selected = !allProducts[index].selected;
            const card = document.getElementById(`card-${index}`);
            const checkbox = card.querySelector('.custom-checkbox');
            
            if (allProducts[index].selected) {
                card.classList.add('selected');
                checkbox.classList.add('checked');
            } else {
                card.classList.remove('selected');
                checkbox.classList.remove('checked');
            }
            updateSelectAllCheckbox();
        }

        function goToProductDetail(partNo) {
            window.location.href = `product-list.html?partno=${encodeURIComponent(partNo)}`;
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.partName.toLowerCase().includes(searchTerm) || 
                p.partNo.toLowerCase().includes(searchTerm) ||
                (p.location && p.location.toLowerCase().includes(searchTerm))
            );
            renderProducts(filtered);
        }

        function toggleSelectAll() {
            const selectAllDiv = document.getElementById('selectAllCheckbox');
            const isChecked = selectAllDiv.classList.contains('checked');
            const newState = !isChecked;
            allProducts.forEach((product, index) => { product.selected = newState; });
            renderProducts(allProducts);
        }

        function updateSelectAllCheckbox() {
            const allChecked = allProducts.every(p => p.selected);
            const selectAllDiv = document.getElementById('selectAllCheckbox');
            if (allChecked) selectAllDiv.classList.add('checked');
            else selectAllDiv.classList.remove('checked');
        }

        function getSelectedProducts() { return allProducts.filter(p => p.selected); }

        function printSelected() {
            const selected = getSelectedProducts();
            if (selected.length === 0) { showToast('⚠️ Sila pilih sekurang-kurangnya satu produk!', 'warning'); return; }
            window.print();
        }

        async function downloadSelected() {
            const selected = getSelectedProducts();
            if (selected.length === 0) { showToast('⚠️ Sila pilih sekurang-kurangnya satu produk!', 'warning'); return; }
            showToast('⏳ Sedang menjana imej...', 'info');
            let downloadCount = 0;

            for (const product of selected) {
                const index = allProducts.indexOf(product);
                const card = document.getElementById(`card-${index}`);
                if (card) {
                    try {
                        const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false });
                        canvas.toBlob(function(blob) {
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.download = `QR_${product.partNo}.png`;
                            link.href = url;
                            link.click();
                            URL.revokeObjectURL(url);
                        }, 'image/png');
                        downloadCount++;
                        await new Promise(r => setTimeout(r, 600));
                    } catch (err) { console.error('Error:', err); }
                }
            }
            showToast(`✅ Berjaya memuat turun ${downloadCount} imej!`, 'success');
        }

        async function shareSelected() {
            const selected = getSelectedProducts();
            if (selected.length === 0) { showToast('️ Sila pilih sekurang-kurangnya satu produk!', 'warning'); return; }
            showToast(' Sedang menyediakan fail...', 'info');
            const files = [];

            for (const product of selected) {
                const index = allProducts.indexOf(product);
                const card = document.getElementById(`card-${index}`);
                if (card) {
                    try {
                        const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true, allowTaint: true, logging: false });
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                        files.push(new File([blob], `QR_${product.partNo}.png`, { type: 'image/png' }));
                    } catch (err) { console.error('Error:', err); }
                }
            }

            if (files.length === 0) { showToast(' Gagal menjana imej!', 'error'); return; }

            if (navigator.canShare && navigator.canShare({ files: files })) {
                try {
                    await navigator.share({ files: files, title: 'MA Inventory QR Codes', text: `${files.length} product QR code(s)` });
                    showToast(`✅ Berjaya share ${files.length} imej!`, 'success');
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        for (const file of files) {
                            const url = URL.createObjectURL(file);
                            const link = document.createElement('a');
                            link.download = file.name;
                            link.href = url;
                            link.click();
                            URL.revokeObjectURL(url);
                            await new Promise(r => setTimeout(r, 500));
                        }
                        showToast(`✅ ${files.length} imej dimuat turun`, 'info');
                    }
                }
            } else {
                for (const file of files) {
                    const url = URL.createObjectURL(file);
                    const link = document.createElement('a');
                    link.download = file.name;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                    await new Promise(r => setTimeout(r, 500));
                }
                showToast(`✅ ${files.length} imej dimuat turun!`, 'success');
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            
            HeaderMenu.init({
                triggerId: 'headerMenuTrigger',
                buttons: [
                    { icon: 'fas fa-print', title: 'Cetak', color: '#6c757d', action: printSelected },
                    { icon: 'fas fa-download', title: 'Muat Turun', color: '#1a73e8', action: downloadSelected },
                    { icon: 'fas fa-share-alt', title: 'Kongsi', color: '#28a745', action: shareSelected }
                ]
            });
        });
    </script>
</body>
</html>
