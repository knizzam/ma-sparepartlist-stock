<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Export Report - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="export.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="floating-actions.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="export-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="export-title"><i class="fas fa-file-export"></i>Export Report</h1>
    </div>

    <!-- Search & Filter -->
    <div class="search-filter-section">
        <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search report type..." onkeyup="filterReports()">
        </div>
        <div class="filter-sort-container">
            <div class="category-filter-container" id="categoryFilter">
                <div class="category-chip active" onclick="setReportFilter('all', this)">All Reports</div>
                <div class="category-chip" onclick="setReportFilter('Products', this)">Products</div>
                <div class="category-chip" onclick="setReportFilter('Transactions', this)">Transactions</div>
                <div class="category-chip" onclick="setReportFilter('StockTake', this)">Stock Take</div>
            </div>
            
            <!-- Date Filter Button -->
            <div style="position: relative;">
                <button class="sort-btn" id="sortBtn" onclick="toggleDateFilter()">
                    <i class="fas fa-calendar"></i>
                </button>
            </div>
        </div>
        
        <!-- Date Filter Section -->
        <div id="dateFilterSection" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f0f0f0;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label style="font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase;">Start Date</label>
                    <input type="date" class="form-input" id="startDate" style="margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase;">End Date</label>
                    <input type="date" class="form-input" id="endDate" style="margin-top: 4px;">
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: #666;">
                <i class="fas fa-info-circle"></i> Date filter applies to Transactions & Stock Take reports
            </div>
        </div>
    </div>

    <!-- Report Cards -->
    <div class="product-list-container" id="reportListContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><div>Loading reports...</div></div>
    </div>

    <!-- Bottom Nav FAB -->
    <div class="bottom-nav">
        <div id="headerMenuTrigger" style="cursor: pointer; color: white; padding: 10px;">
            <i class="fas fa-ellipsis-v" style="font-size: 20px;"></i>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div style="margin-top: 15px; color: white; font-weight: 600;">Generating Report...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentFilter = 'all';
        let currentSearch = '';
        let lastGeneratedCSV = null;
        let lastGeneratedFileName = 'report.csv';

        // Set default dates
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            
            document.getElementById('endDate').valueAsDate = today;
            document.getElementById('startDate').valueAsDate = firstDay;
            
            renderReports();
            
            // Initialize Floating Action Menu - ONLY 3 BUTTONS
            HeaderMenu.init({
                triggerId: 'headerMenuTrigger',
                buttons: [
                    { 
                        icon: 'fas fa-download', 
                        title: 'Download CSV', 
                        color: '#1a73e8', 
                        action: downloadSelectedReport 
                    },
                    { 
                        icon: 'fas fa-share-alt', 
                        title: 'Share Report', 
                        color: '#28a745', 
                        action: shareReport 
                    },
                    { 
                        icon: 'fas fa-print', 
                        title: 'Print Report', 
                        color: '#6c757d', 
                        action: printReport 
                    }
                ]
            });
        });

        function toggleDateFilter() {
            const section = document.getElementById('dateFilterSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
            const sortBtn = document.getElementById('sortBtn');
            if (section.style.display === 'block') {
                sortBtn.classList.add('active');
            } else {
                sortBtn.classList.remove('active');
            }
        }

        function filterReports() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            renderReports();
        }

        function setReportFilter(filter, element) {
            currentFilter = filter;
            document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            renderReports();
        }

        function renderReports() {
            const container = document.getElementById('reportListContainer');
            
            const reports = [
                {
                    id: 'products',
                    type: 'Products',
                    name: 'Product Master List',
                    desc: 'Complete product inventory with stock levels',
                    icon: 'fa-boxes',
                    color: 'bg-blue',
                    hasDate: false
                },
                {
                    id: 'transactions',
                    type: 'Transactions',
                    name: 'Transaction History',
                    desc: 'All receive, out, and return transactions',
                    icon: 'fa-exchange-alt',
                    color: 'bg-green',
                    hasDate: true
                },
                {
                    id: 'stocktake',
                    type: 'StockTake_Log',
                    name: 'Stock Take Log',
                    desc: 'Stock take records and approvals',
                    icon: 'fa-clipboard-check',
                    color: 'bg-purple',
                    hasDate: true
                }
            ];

            let filtered = reports.filter(r => {
                const matchFilter = currentFilter === 'all' || r.type === currentFilter;
                const matchSearch = r.name.toLowerCase().includes(currentSearch) || 
                                   r.desc.toLowerCase().includes(currentSearch);
                return matchFilter && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><div>No reports found</div></div>';
                return;
            }

            let html = '';
            filtered.forEach(report => {
                const isSelected = window.selectedReportType === report.type ? 'selected' : '';
                html += `
                    <div class="product-card ${isSelected}" onclick="selectReport('${report.type}', ${report.hasDate})">
                        <div class="product-card-img ${report.color}">
                            <i class="fas ${report.icon}"></i>
                        </div>
                        <div class="product-card-info">
                            <div class="product-card-name">${report.name}</div>
                            <div style="font-size: 12px; color: #666;">${report.desc}</div>
                            ${report.hasDate ? '<div style="font-size: 11px; color: #999; margin-top: 4px;"><i class="fas fa-calendar"></i> Date filter available</div>' : ''}
                        </div>
                        <div class="report-card-action">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectReport(reportType, hasDate) {
            window.selectedReportType = reportType;
            renderReports(); // Re-render to show selection
            
            if (hasDate) {
                document.getElementById('dateFilterSection').style.display = 'block';
                document.getElementById('sortBtn').classList.add('active');
                document.getElementById('dateFilterSection').scrollIntoView({ behavior: 'smooth' });
                Utils.showToast('📅 Select date range, then use menu below to Download/Share/Print', 'info');
            } else {
                Utils.showToast('✅ Product Master selected. Use menu below to export.', 'info');
            }
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function getSelectedReportConfig() {
            const reportType = window.selectedReportType || currentFilter;
            if (!reportType || reportType === 'all') {
                Utils.showToast('⚠️ Please select a report type first!', 'warning');
                return null;
            }
            
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (reportType !== 'Products' && (!startDate || !endDate)) {
                Utils.showToast('⚠️ Please select date range!', 'warning');
                return null;
            }
            
            return { reportType, startDate, endDate };
        }

        // Generate CSV from server
        async function generateCSVFromServer() {
            const config = getSelectedReportConfig();
            if (!config) return null;
            
            showLoading(true);
            
            try {
                const payload = {
                    action: 'generateExportCSV',
                    sheetName: config.reportType,
                    startDate: config.startDate,
                    endDate: config.endDate
                };

                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result.success) {
                    lastGeneratedCSV = result.csv;
                    lastGeneratedFileName = result.fileName;
                    return result;
                } else {
                    Utils.showToast('❌ ' + result.message, 'error');
                    return null;
                }
            } catch (error) {
                console.error(error);
                Utils.showToast('❌ Failed to generate report', 'error');
                return null;
            } finally {
                showLoading(false);
            }
        }

        // 1. DOWNLOAD
        async function downloadSelectedReport() {
            const result = await generateCSVFromServer();
            if (!result) return;
            
            const blob = new Blob([result.csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', result.fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            Utils.showToast(`✅ Downloaded ${result.count} records!`, 'success');
        }

        // 2. SHARE (Email, WhatsApp, Telegram, etc.)
        async function shareReport() {
            const result = await generateCSVFromServer();
            if (!result) return;
            
            try {
                const blob = new Blob([result.csv], { type: 'text/csv' });
                const file = new File([blob], result.fileName, { type: 'text/csv' });
                
                // Check if Web Share API is supported with files
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'MA Inventory Report',
                        text: `Report: ${result.fileName} (${result.count} records)`
                    });
                    Utils.showToast('✅ Report shared successfully!', 'success');
                } else {
                    // Fallback: Share via URL/text only
                    const shareText = `MA Inventory Report\nType: ${result.fileName}\nRecords: ${result.count}\n\nDownload the CSV file from the system.`;
                    
                    if (navigator.share) {
                        await navigator.share({
                            title: 'MA Inventory Report',
                            text: shareText
                        });
                        Utils.showToast('✅ Share dialog opened!', 'success');
                    } else {
                        // Final fallback: Copy to clipboard
                        await navigator.clipboard.writeText(shareText);
                        Utils.showToast(' Report info copied to clipboard. Share manually via WhatsApp/Email.', 'info');
                    }
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error(error);
                    Utils.showToast('❌ Failed to share report', 'error');
                }
            }
        }

        // 3. PRINT
        async function printReport() {
            const result = await generateCSVFromServer();
            if (!result) return;
            
            // Convert CSV to HTML table for printing
            const rows = result.csv.split('\n');
            const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
            const dataRows = rows.slice(1).map(row => row.split(',').map(cell => cell.replace(/"/g, '').trim()));
            
            let tableHTML = `
                <html>
                <head>
                    <title>MA Inventory Report - ${result.fileName}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        h1 { color: #1a73e8; font-size: 20px; margin-bottom: 5px; }
                        .meta { color: #666; font-size: 12px; margin-bottom: 20px; }
                        table { width: 100%; border-collapse: collapse; font-size: 11px; }
                        th { background: #1a73e8; color: white; padding: 8px; text-align: left; border: 1px solid #ddd; }
                        td { padding: 6px 8px; border: 1px solid #ddd; }
                        tr:nth-child(even) { background: #f9f9f9; }
                        tr:hover { background: #f0f8ff; }
                        @media print {
                            body { padding: 10px; }
                            table { font-size: 10px; }
                            th { background: #1a73e8 !important; -webkit-print-color-adjust: exact; }
                        }
                    </style>
                </head>
                <body>
                    <h1>MA Inventory Report</h1>
                    <div class="meta">
                        <strong>Report Type:</strong> ${result.fileName.replace('.csv', '').replace(/_/g, ' ')}<br>
                        <strong>Total Records:</strong> ${result.count}<br>
                        <strong>Generated:</strong> ${new Date().toLocaleString('en-GB')}
                    </div>
                    <table>
                        <thead>
                            <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                            ${dataRows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}
                        </tbody>
                    </table>
                </body>
                </html>
            `;
            
            // Open in new window and print
            const printWindow = window.open('', '_blank');
            printWindow.document.write(tableHTML);
            printWindow.document.close();
            
            // Wait for content to load then print
            printWindow.onload = function() {
                printWindow.focus();
                printWindow.print();
            };
            
            Utils.showToast('🖨️ Print dialog opened!', 'info');
        }
    </script>
</body>
</html>
