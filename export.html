<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Export Report - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="export.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="export-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="export-title"><i class="fas fa-file-export"></i>Export Report</h1>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Date Filter Card (Hidden by default) -->
        <div class="form-card" id="dateFilterCard" style="display: none;">
            <div class="form-section-title">Date Range</div>
            
            <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-input" id="startDate">
            </div>

            <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" class="form-input" id="endDate">
            </div>

            <div class="btn-group">
                <button class="cancel-btn" onclick="backToCards()">Cancel</button>
                <button class="submit-btn" onclick="downloadSelectedReport()">
                    <i class="fas fa-download"></i> Download CSV
                </button>
            </div>
        </div>

        <!-- Report Type Cards -->
        <div class="report-cards-container" id="reportCardsContainer">
            
            <!-- Product Master List Card -->
            <div class="report-card" onclick="downloadProductMaster()">
                <div class="report-card-icon bg-blue">
                    <i class="fas fa-boxes"></i>
                </div>
                <div class="report-card-info">
                    <div class="report-card-title">Product Master List</div>
                    <div class="report-card-desc">All products with current stock</div>
                </div>
                <div class="report-card-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>

            <!-- Transaction History Card -->
            <div class="report-card" onclick="showDateFilter('Transactions')">
                <div class="report-card-icon bg-green">
                    <i class="fas fa-exchange-alt"></i>
                </div>
                <div class="report-card-info">
                    <div class="report-card-title">Transaction History</div>
                    <div class="report-card-desc">Receive, Out, Return records</div>
                </div>
                <div class="report-card-action">
                    <i class="fas fa-calendar-alt"></i>
                </div>
            </div>

            <!-- Stock Take Log Card -->
            <div class="report-card" onclick="showDateFilter('StockTake_Log')">
                <div class="report-card-icon bg-purple">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <div class="report-card-info">
                    <div class="report-card-title">Stock Take Log</div>
                    <div class="report-card-desc">Stock take records & approvals</div>
                </div>
                <div class="report-card-action">
                    <i class="fas fa-calendar-alt"></i>
                </div>
            </div>

        </div>

    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div style="margin-top: 15px; color: white; font-weight: 600;">Generating Report...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedReportType = '';

        // Set default dates
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            
            document.getElementById('endDate').valueAsDate = today;
            document.getElementById('startDate').valueAsDate = firstDay;
        });

        function showDateFilter(reportType) {
            selectedReportType = reportType;
            document.getElementById('reportCardsContainer').style.display = 'none';
            document.getElementById('dateFilterCard').style.display = 'block';
        }

        function backToCards() {
            document.getElementById('dateFilterCard').style.display = 'none';
            document.getElementById('reportCardsContainer').style.display = 'block';
            selectedReportType = '';
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        async function downloadProductMaster() {
            showLoading(true);
            
            try {
                const payload = {
                    action: 'generateExportCSV',
                    sheetName: 'Products',
                    startDate: '',
                    endDate: ''
                };

                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result.success) {
                    const blob = new Blob([result.csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.setAttribute('download', result.fileName);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    Utils.showToast(`✅ Downloaded ${result.count} products!`, 'success');
                } else {
                    Utils.showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                console.error(error);
                Utils.showToast('❌ Failed to download', 'error');
            } finally {
                showLoading(false);
            }
        }

        async function downloadSelectedReport() {
            if (!selectedReportType) return;

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                Utils.showToast('⚠️ Please select date range!', 'warning');
                return;
            }

            showLoading(true);

            try {
                const payload = {
                    action: 'generateExportCSV',
                    sheetName: selectedReportType,
                    startDate: startDate,
                    endDate: endDate
                };

                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result.success) {
                    const blob = new Blob([result.csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.setAttribute('download', result.fileName);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    Utils.showToast(`✅ Downloaded ${result.count} records!`, 'success');
                    backToCards();
                } else {
                    Utils.showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                console.error(error);
                Utils.showToast('❌ Failed to download', 'error');
            } finally {
                showLoading(false);
            }
        }
    </script>
</body>
</html>
