<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Export Report - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="export.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="floating-actions.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="export-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="export-title"><i class="fas fa-file-export"></i>Export Report</h1>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Configuration Card -->
        <div class="form-card">
            <div class="form-section-title">Report Configuration</div>
            
            <div class="form-group">
                <label class="form-label">Select Report Type</label>
                <select class="form-input" id="sheetSelect" onchange="updateDateInputs()">
                    <option value="Products">Products Master List</option>
                    <option value="Transactions">Transactions History</option>
                    <option value="StockTake_Log">Stock Take Log</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-input" id="startDate">
            </div>

            <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" class="form-input" id="endDate">
            </div>
            
            <div class="form-group">
                <label class="form-label">Recipient Email (Optional for Email Export)</label>
                <input type="email" class="form-input" id="recipientEmail" placeholder="admin@company.com">
            </div>
        </div>

    </div>

    <!-- Bottom Nav FAB -->
    <div class="bottom-nav">
        <div id="headerMenuTrigger" style="cursor: pointer; color: white; padding: 10px;">
            <i class="fas fa-ellipsis-v" style="font-size: 20px;"></i>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div style="margin-top: 15px; color: white; font-weight: 600;">Generating Report...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set default dates to current month
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            
            document.getElementById('endDate').valueAsDate = today;
            document.getElementById('startDate').valueAsDate = firstDay;
            
            updateDateInputs();
            
            // Initialize Floating Action Menu
            HeaderMenu.init({
                triggerId: 'headerMenuTrigger',
                buttons: [
                    { 
                        icon: 'fas fa-download', 
                        title: 'Download CSV', 
                        color: '#1a73e8', 
                        action: downloadCSV 
                    },
                    { 
                        icon: 'fas fa-envelope', 
                        title: 'Send via Email', 
                        color: '#28a745', 
                        action: sendViaEmail 
                    }
                ]
            });
        });

        function updateDateInputs() {
            const sheet = document.getElementById('sheetSelect').value;
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');
            
            if (sheet === 'Products') {
                startDateInput.disabled = true;
                endDateInput.disabled = true;
                startDateInput.value = '';
                endDateInput.value = '';
                startDateInput.style.opacity = '0.5';
                endDateInput.style.opacity = '0.5';
            } else {
                startDateInput.disabled = false;
                endDateInput.disabled = false;
                startDateInput.style.opacity = '1';
                endDateInput.style.opacity = '1';
                
                if (!startDateInput.value) {
                    const today = new Date();
                    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                    startDateInput.valueAsDate = firstDay;
                    endDateInput.valueAsDate = today;
                }
            }
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        async function downloadCSV() {
            const sheetName = document.getElementById('sheetSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (sheetName !== 'Products' && (!startDate || !endDate)) {
                Utils.showToast('⚠️ Please select a date range!', 'warning');
                return;
            }

            showLoading(true);

            try {
                const payload = {
                    action: 'generateExportCSV',
                    sheetName: sheetName,
                    startDate: startDate,
                    endDate: endDate
                };

                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result.success) {
                    // Create Blob and Download
                    const blob = new Blob([result.csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.setAttribute('download', result.fileName);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    Utils.showToast(`✅ Downloaded ${result.count} records!`, 'success');
                } else {
                    Utils.showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                console.error(error);
                Utils.showToast('❌ Failed to generate report', 'error');
            } finally {
                showLoading(false);
            }
        }

        async function sendViaEmail() {
            const sheetName = document.getElementById('sheetSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const email = document.getElementById('recipientEmail').value.trim();

            if (!email) {
                Utils.showToast('⚠️ Please enter recipient email!', 'warning');
                document.getElementById('recipientEmail').focus();
                return;
            }

            if (sheetName !== 'Products' && (!startDate || !endDate)) {
                Utils.showToast('⚠️ Please select a date range!', 'warning');
                return;
            }

            showLoading(true);

            try {
                const payload = {
                    action: 'sendReportEmailAPI',
                    sheetName: sheetName,
                    startDate: startDate,
                    endDate: endDate,
                    recipientEmail: email
                };

                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result.success) {
                    Utils.showToast('✅ Sent to ' + email, 'success');
                    document.getElementById('recipientEmail').value = '';
                } else {
                    Utils.showToast(' ' + result.message, 'error');
                }
            } catch (error) {
                console.error(error);
                Utils.showToast('❌ Failed to send email', 'error');
            } finally {
                showLoading(false);
            }
        }
    </script>
</body>
</html>
