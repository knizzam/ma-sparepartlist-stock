<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Export Report - MA Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="export.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="floating-actions.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="export-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="export-title"><i class="fas fa-file-export"></i>Export Report</h1>
        <div id="headerMenuTrigger" style="cursor: pointer; color: white;">
            <i class="fas fa-ellipsis-v" style="font-size: 20px;"></i>
        </div>
    </div>

    <div class="main-container">
        
        <!-- Filter Section -->
        <div class="filter-section">
            <div class="category-filter-container">
                <div class="category-chip active" onclick="setReportFilter('Products', this)">Products</div>
                <div class="category-chip" onclick="setReportFilter('Transactions', this)">Transactions</div>
                <div class="category-chip" onclick="setReportFilter('StockTake', this)">Stock Take</div>
            </div>
            
            <div id="dateFilterSection" style="display: none; margin-top: 15px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-input" id="startDate">
                    </div>
                    <div>
                        <label class="form-label">End Date</label>
                        <input type="date" class="form-input" id="endDate">
                    </div>
                </div>
                <div id="dateWarning" style="display: none; margin-top: 8px; padding: 8px; background: #fff3cd; border-radius: 6px; font-size: 11px; color: #856404;">
                    <i class="fas fa-exclamation-triangle"></i> <span id="dateWarningText"></span>
                </div>
            </div>

            <button class="search-btn" onclick="loadDataForFilter(currentFilter)">
                <i class="fas fa-search"></i> Search
            </button>
        </div>

        <!-- Global Search Box -->
        <div class="global-search-wrapper" id="globalSearchWrapper" style="display: none;">
            <div class="global-search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearchInput" placeholder="Search Part Name, Part No, or Location..." onkeyup="filterTableData()">
            </div>
            <div class="search-result-info">
                <i class="fas fa-info-circle"></i> <span id="searchResultCount">0</span> results found
            </div>
        </div>

        <!-- Data Table -->
        <div class="data-table-container" id="dataTableContainer">
            <div class="empty-state">
                <i class="fas fa-hand-pointer" style="font-size: 48px; color: #ddd; margin-bottom: 15px;"></i>
                <div style="font-size: 14px; color: #888;">Select a report type and click Search</div>
            </div>
        </div>

    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div style="margin-top: 15px; color: white; font-weight: 600;">Loading data...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentFilter = 'Products';
        let currentData = [];
        let filteredData = [];
        let lastGeneratedCSV = null;
        let lastGeneratedFileName = 'report.csv';
        const MAX_DISPLAY_ROWS = 100;
        const MAX_DATE_RANGE_MONTHS = 3;

        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const threeMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 3, today.getDate());
            
            document.getElementById('endDate').valueAsDate = today;
            document.getElementById('startDate').valueAsDate = threeMonthsAgo;
            
            document.getElementById('startDate').addEventListener('change', validateDateRange);
            document.getElementById('endDate').addEventListener('change', validateDateRange);
            
            HeaderMenu.init({
                triggerId: 'headerMenuTrigger',
                buttons: [
                    { icon: 'fas fa-download', title: 'Download CSV', color: '#1a73e8', action: downloadReport },
                    { icon: 'fas fa-share-alt', title: 'Share Report', color: '#28a745', action: shareReport },
                    { icon: 'fas fa-print', title: 'Print Report', color: '#6c757d', action: printReport }
                ]
            });
            
            loadDataForFilter('Products');
        });

        function validateDateRange() {
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);
            const warningDiv = document.getElementById('dateWarning');
            const warningText = document.getElementById('dateWarningText');
            
            if (startDate && endDate && endDate > startDate) {
                const diffMonths = Math.ceil(Math.abs(endDate - startDate) / (1000 * 60 * 60 * 24)) / 30;
                
                if (diffMonths > MAX_DATE_RANGE_MONTHS) {
                    warningText.textContent = `Date range exceeds ${MAX_DATE_RANGE_MONTHS} months. Consider using shorter periods.`;
                    warningDiv.style.display = 'block';
                    return false;
                } else {
                    warningDiv.style.display = 'none';
                    return true;
                }
            }
            return true;
        }

        function setReportFilter(filter, element) {
            currentFilter = filter;
            document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            
            const dateSection = document.getElementById('dateFilterSection');
            const searchWrapper = document.getElementById('globalSearchWrapper');
            
            dateSection.style.display = (filter === 'Transactions' || filter === 'StockTake') ? 'block' : 'none';
            searchWrapper.style.display = 'none';
            document.getElementById('globalSearchInput').value = '';
            document.getElementById('dateWarning').style.display = 'none';
            
            document.getElementById('dataTableContainer').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-hand-pointer" style="font-size: 48px; color: #ddd; margin-bottom: 15px;"></i>
                    <div style="font-size: 14px; color: #888;">Click Search button to load ${filter} data</div>
                </div>
            `;
        }

        async function loadDataForFilter(filter) {
            const container = document.getElementById('dataTableContainer');
            const searchWrapper = document.getElementById('globalSearchWrapper');
            
            if (filter !== 'Products' && !validateDateRange()) {
                Utils.showToast('⚠️ Date range too large! Max 3 months recommended.', 'warning');
                return;
            }
            
            container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size: 32px; color: var(--primary-blue);"></i><div style="margin-top: 10px;">Loading data...</div></div>';
            
            let sheetName = filter === 'StockTake' ? 'StockTake_Log' : filter;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if ((filter === 'Transactions' || filter === 'StockTake') && (!startDate || !endDate)) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-alt" style="font-size: 48px; color: #ffc107; margin-bottom: 15px;"></i>
                        <div style="font-size: 14px; color: #888;">Please select date range above</div>
                    </div>
                `;
                Utils.showToast('⚠️ Please select date range!', 'warning');
                return;
            }
            
            try {
                const payload = {
                    action: 'generateExportCSV',
                    sheetName: sheetName,
                    startDate: filter === 'Products' ? '' : startDate,
                    endDate: filter === 'Products' ? '' : endDate
                };

                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result.success) {
                    lastGeneratedCSV = result.csv;
                    lastGeneratedFileName = result.fileName;
                    currentData = result.csv.split('\n');
                    filteredData = [...currentData];
                    
                    searchWrapper.style.display = 'block';
                    document.getElementById('globalSearchInput').value = '';
                    document.getElementById('searchResultCount').textContent = currentData.length - 1;
                    
                    renderDataTable(filteredData, filter);
                } else {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i><div style="color: #dc3545;">${result.message}</div></div>`;
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i><div style="color: #dc3545;">Failed to load data</div></div>';
            }
        }

        function filterTableData() {
            const searchTerm = document.getElementById('globalSearchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                filteredData = [...currentData];
            } else {
                filteredData = currentData.filter((row, index) => {
                    if (index === 0) return true;
                    return row.toLowerCase().includes(searchTerm);
                });
            }
            
            document.getElementById('searchResultCount').textContent = filteredData.length - 1;
            
            // UPDATE lastGeneratedCSV dengan data yang telah difilter
            lastGeneratedCSV = filteredData.join('\n');
            lastGeneratedFileName = `${currentFilter}_Filtered_${filteredData.length - 1}records_${new Date().getTime()}.csv`;
            
            renderDataTable(filteredData, currentFilter);
        }

        function renderDataTable(data, filter) {
            const container = document.getElementById('dataTableContainer');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><div>No data found</div></div>';
                return;
            }

            const headers = data[0].split(',').map(h => h.replace(/"/g, '').trim());
            const allRows = data.slice(1).map(row => row.split(',').map(cell => cell.replace(/"/g, '').trim()));
            const displayRows = allRows.slice(0, MAX_DISPLAY_ROWS);
            const hasMore = allRows.length > MAX_DISPLAY_ROWS;

            let html = `
                <div class="data-table-header">
                    <div class="data-table-title">${filter} Report</div>
                    <div class="data-table-count">
                        ${displayRows.length} of ${allRows.length} records
                        ${hasMore ? `<br><small style="font-size: 9px; color: #999;">(Showing first ${MAX_DISPLAY_ROWS})</small>` : ''}
                    </div>
                </div>
                <div class="data-table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                ${headers.map(h => `<th>${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${displayRows.map(row => `
                                <tr>
                                    ${row.map(cell => `<td>${cell}</td>`).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ${hasMore ? '<div style="padding: 15px; text-align: center; background: #fff9e6; color: #856404; font-size: 12px; border-top: 1px solid #f0f0f0;"><i class="fas fa-info-circle"></i> Use search to find specific records</div>' : ''}
            `;
            
            container.innerHTML = html;
        }

        function downloadReport() {
            if (!lastGeneratedCSV) {
                Utils.showToast('⚠️ Please search for data first!', 'warning');
                return;
            }
            
            const blob = new Blob([lastGeneratedCSV], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', lastGeneratedFileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            Utils.showToast(`✅ Downloaded ${lastGeneratedFileName}!`, 'success');
        }

        async function shareReport() {
            if (!lastGeneratedCSV) {
                Utils.showToast('⚠️ Please search for data first!', 'warning');
                return;
            }
            
            try {
                const blob = new Blob([lastGeneratedCSV], { type: 'text/csv' });
                const file = new File([blob], lastGeneratedFileName, { type: 'text/csv' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'MA Inventory Report', text: `Report: ${lastGeneratedFileName}` });
                    Utils.showToast('✅ Report shared!', 'success');
                } else {
                    const shareText = `MA Inventory Report\nFile: ${lastGeneratedFileName}\n\nDownload from system.`;
                    if (navigator.share) {
                        await navigator.share({ title: 'MA Inventory Report', text: shareText });
                    } else {
                        await navigator.clipboard.writeText(shareText);
                        Utils.showToast('📋 Report info copied to clipboard', 'info');
                    }
                }
            } catch (error) {
                if (error.name !== 'AbortError') Utils.showToast('❌ Failed to share', 'error');
            }
        }

        async function printReport() {
            if (!lastGeneratedCSV) {
                Utils.showToast('⚠️ Please search for data first!', 'warning');
                return;
            }
            
            const rows = lastGeneratedCSV.split('\n');
            const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
            const dataRows = rows.slice(1).map(row => row.split(',').map(cell => cell.replace(/"/g, '').trim()));
            
            let tableHTML = `
                <html><head><title>MA Inventory Report</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; }
                    h1 { color: #1a73e8; font-size: 20px; margin-bottom: 5px; }
                    .meta { color: #666; font-size: 12px; margin-bottom: 20px; }
                    table { width: 100%; border-collapse: collapse; font-size: 11px; }
                    th { background: #1a73e8; color: white; padding: 8px; text-align: left; border: 1px solid #ddd; }
                    td { padding: 6px 8px; border: 1px solid #ddd; }
                    tr:nth-child(even) { background: #f9f9f9; }
                    @media print { th { background: #1a73e8 !important; -webkit-print-color-adjust: exact; } }
                </style></head><body>
                    <h1>MA Inventory Report</h1>
                    <div class="meta"><strong>File:</strong> ${lastGeneratedFileName}<br><strong>Records:</strong> ${dataRows.length}<br><strong>Generated:</strong> ${new Date().toLocaleString('en-GB')}</div>
                    <table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                    <tbody>${dataRows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>
                </body></html>
            `;
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(tableHTML);
            printWindow.document.close();
            printWindow.onload = function() { printWindow.focus(); printWindow.print(); };
            Utils.showToast('🖨️ Print dialog opened!', 'info');
        }
    </script>
</body>
</html>
