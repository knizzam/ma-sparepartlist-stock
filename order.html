<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Predictive Ordering - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="order.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="data-manager.js"></script>
    <script src="floating-actions.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

    <div class="order-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="order-title"><i class="fas fa-brain"></i>Predictive Ordering</h1>
        <div id="headerMenuTrigger" style="cursor: pointer; color: white;">
            <i class="fas fa-ellipsis-v" style="font-size: 20px;"></i>
        </div>
    </div>

    <div class="main-container">
        <!-- SEARCH & FILTER SECTION (STANDARD STRUCTURE) -->
        <div class="search-filter-section">
            <div class="search-input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search Part Name, Part No, or Location..." onkeyup="filterOrderProducts()">
            </div>
            
            <div class="filter-sort-container">
                <div class="category-filter-container">
                    <div class="category-chip active" onclick="setCategoryFilter('all', this)">All</div>
                    <div class="category-chip" onclick="setCategoryFilter('Maintenance', this)">Maintenance</div>
                    <div class="category-chip" onclick="setCategoryFilter('Consumable', this)">Consumable</div>
                    <div class="category-chip" onclick="setCategoryFilter('Tools', this)">Tools</div>
                    <div class="category-chip" onclick="setCategoryFilter('Safety', this)">Safety</div>
                    <div class="category-chip" onclick="setCategoryFilter('Kaizen', this)">Kaizen</div>
                    <div class="category-chip" onclick="setCategoryFilter('5s', this)">5s</div>
                </div>
            </div>
        </div>

        <!-- SUMMARY BAR (CLICKABLE) -->
        <div class="summary-bar">
            <div class="summary-item clickable" id="summaryLow" onclick="filterByStatus('low')">
                <i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i>
                <span id="lowStockCount">0</span> Low
            </div>
            <div class="summary-item clickable" id="summaryMid" onclick="filterByStatus('mid')">
                <i class="fas fa-exclamation-circle" style="color: #ffc107;"></i>
                <span id="warningStockCount">0</span> Mid
            </div>
            <div class="summary-item" id="summaryAll" onclick="filterByStatus('all')">
                <i class="fas fa-check-circle" style="color: #28a745;"></i>
                <span id="selectedCount">0</span> Selected
            </div>
        </div>

        <!-- ORDER LIST -->
        <div class="order-list-container" id="orderListContainer">
            <div class="loading-container"><i class="fas fa-spinner fa-spin"></i><div>Loading products...</div></div>
        </div>
    </div>

    <!-- FLOATING ACTION BAR (CART) -->
    <div class="floating-action-bar" id="floatingActionBar" style="display: none;">
        <div class="action-info">
            <i class="fas fa-shopping-cart"></i>
            <span id="floatingSelectedCount">0</span> items | Total: <span id="floatingTotalQty">0</span> units | RM <span id="floatingTotalCost">0.00</span>
        </div>
        <div class="action-buttons">
            <button class="action-btn btn-csv" onclick="downloadCSV()"><i class="fas fa-file-csv"></i> CSV</button>
            <button class="action-btn btn-checkout" onclick="checkoutToCart()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProducts = [];
        let orderProducts = [];
        let selectedProducts = new Set();
        let currentCategory = 'all';
        let currentStatusFilter = 'all';
        let currentSearch = '';

        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            
            setTimeout(function() {
                if (typeof HeaderMenu !== 'undefined') {
                    HeaderMenu.init({
                        triggerId: 'headerMenuTrigger',
                        buttons: [
                            { icon: 'fas fa-check-double', title: 'Select All', color: '#1a73e8', action: selectAll },
                            { icon: 'fas fa-times', title: 'Deselect All', color: '#6c757d', action: deselectAll }
                        ]
                    });
                    console.log('[Order] HeaderMenu initialized');
                } else {
                    console.error('[Order] HeaderMenu not loaded!');
                }
            }, 500);
        });

        async function loadProducts() {
            const container = document.getElementById('orderListContainer');
            try {
                let fetchedProducts = null;
                if (typeof DataManager !== 'undefined') {
                    fetchedProducts = await DataManager.fetchData('ma_inventory_product_list', CONFIG.API_URL + '?action=getAllProducts', 'products');
                } else {
                    const cachedData = localStorage.getItem('ma_inventory_product_list');
                    if (cachedData) {
                        try {
                            const p = JSON.parse(cachedData);
                            if (new Date().getTime() - p.timestamp < 5 * 60 * 1000) fetchedProducts = p.data;
                        } catch(e) {}
                    }
                    if (!fetchedProducts) {
                        const res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
                        const result = await res.json();
                        if (result.success && result.products) {
                            fetchedProducts = result.products;
                            localStorage.setItem('ma_inventory_product_list', JSON.stringify({ data: fetchedProducts, timestamp: new Date().getTime() }));
                        }
                    }
                }
                if (fetchedProducts !== null) {
                    allProducts = fetchedProducts;
                    filterOrderProducts();
                } else {
                    container.innerHTML = '<div class="loading-container">Failed to load data</div>';
                }
            } catch (error) {
                console.error('Load error:', error);
                container.innerHTML = '<div class="loading-container" style="color: #dc3545;">Error: ' + error.message + '</div>';
            }
        }

        function getStockStatus(current, min) {
            var thresholdOK = min + (min * 0.5);
            if (current > thresholdOK) return 'high';
            if (current > min) return 'mid';
            return 'low';
        }

        function filterByStatus(status) {
            currentStatusFilter = status;
            
            document.getElementById('summaryLow').style.opacity = (status === 'low' || status === 'all') ? '1' : '0.5';
            document.getElementById('summaryMid').style.opacity = (status === 'mid' || status === 'all') ? '1' : '0.5';
            document.getElementById('summaryAll').style.opacity = '1';
            
            filterOrderProducts();
            
            if (status === 'low') Utils.showToast('Showing Low stock items only', 'info');
            else if (status === 'mid') Utils.showToast('Showing Mid stock items only', 'info');
            else Utils.showToast('Showing all items', 'info');
        }

        function setCategoryFilter(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            filterOrderProducts();
        }

        function filterOrderProducts() {
            const searchTerm = currentSearch.toLowerCase();
            
            orderProducts = allProducts.filter(p => {
                const current = parseInt(p.currentStock) || 0;
                const minimum = parseInt(p.minimumStock) || 0;
                const thresholdOK = minimum + (minimum * 0.5);
                
                const isLowOrMid = current <= thresholdOK;
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.partName.toLowerCase().includes(searchTerm) || 
                                   p.partNo.toLowerCase().includes(searchTerm) ||
                                   (p.location && p.location.toLowerCase().includes(searchTerm));
                
                const status = getStockStatus(current, minimum);
                let matchStatus = true;
                if (currentStatusFilter === 'low') matchStatus = (status === 'low');
                else if (currentStatusFilter === 'mid') matchStatus = (status === 'mid');
                
                return isLowOrMid && matchCategory && matchSearch && matchStatus;
            });
            
            orderProducts.sort((a, b) => {
                const aStatus = getStockStatus(parseInt(a.currentStock) || 0, parseInt(a.minimumStock) || 1);
                const bStatus = getStockStatus(parseInt(b.currentStock) || 0, parseInt(b.minimumStock) || 1);
                const order = { 'low': 0, 'mid': 1, 'high': 2 };
                return order[aStatus] - order[bStatus];
            });
            
            renderOrderList();
        }

        function renderOrderList() {
            const container = document.getElementById('orderListContainer');
            if (orderProducts.length === 0) {
                container.innerHTML = '<div class="loading-container"><i class="fas fa-check-circle" style="font-size: 48px; color: #28a745; margin-bottom: 15px;"></i><div>All products are well stocked!</div></div>';
                return;
            }
            
            let lowCount = 0;
            let midCount = 0;
            let html = '';
            
            orderProducts.forEach((product, index) => {
                const current = parseInt(product.currentStock) || 0;
                const minimum = parseInt(product.minimumStock) || 0;
                const status = getStockStatus(current, minimum);
                const unitPrice = parseFloat(product.unitPrice) || 0;
                
                if (status === 'low') lowCount++;
                else if (status === 'mid') midCount++;
                
                const suggestedQty = Math.max(1, Math.ceil((minimum * 1.5) - current));
                const estimatedCost = suggestedQty * unitPrice;
                const isSelected = selectedProducts.has(index);
                const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                
                let cachedImg = null;
                if (typeof DataManager !== 'undefined') {
                    cachedImg = DataManager.getCachedImage('ma_prod_img', product.partNo);
                } else {
                    const key = 'ma_prod_img_' + safePartNo;
                    const cached = localStorage.getItem(key);
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (new Date().getTime() - parsed.timestamp < 5 * 60 * 1000) cachedImg = parsed.base64;
                        } catch(e) {}
                    }
                }
                
                let imgContent = '<i class="fas fa-box"></i>';
                if (cachedImg) {
                    imgContent = `<img src="${cachedImg}" alt="${product.partName}">`;
                } else if (product.pictureFileId) {
                    imgContent = `<div class="order-img-placeholder" id="img-placeholder-${safePartNo}"><i class="fas fa-spinner fa-spin"></i></div>`;
                }
                
                html += `
                    <div class="order-card ${status} ${isSelected ? 'selected' : ''}" id="order-card-${index}">
                        <div class="order-checkbox" onclick="toggleSelection(${index})">
                            <i class="fas ${isSelected ? 'fa-check-circle' : 'fa-circle'}"></i>
                        </div>
                        <div class="order-image">${imgContent}</div>
                        <div class="order-info">
                            <div class="order-name">${product.partName}</div>
                            <div class="order-partno">${product.partNo}</div>
                            <div class="order-stock-info">
                                <span class="stock-current">Current: ${current}</span>
                                <span class="stock-min">Min: ${minimum}</span>
                            </div>
                            <div class="order-price-info">
                                <span class="price-label">Unit Price:</span>
                                <span class="price-value">RM ${unitPrice.toFixed(2)}</span>
                            </div>
                            <div class="order-qty-section">
                                <label>Order Qty:</label>
                                <div class="qty-control">
                                    <button class="qty-btn" onclick="adjustQty(${index}, -1)">-</button>
                                    <input type="number" class="qty-input" id="qty-${index}" value="${suggestedQty}" min="0" onchange="updateQty(${index}, this.value)">
                                    <button class="qty-btn" onclick="adjustQty(${index}, 1)">+</button>
                                </div>
                                <div class="estimated-cost">Est: RM ${estimatedCost.toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="order-status-badge ${status}">${status === 'low' ? 'LOW' : 'MID'}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            document.getElementById('lowStockCount').textContent = lowCount;
            document.getElementById('warningStockCount').textContent = midCount;
            
            // Load images
            orderProducts.forEach((product, index) => {
                if (product.pictureFileId) {
                    const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    let hasCache = false;
                    if (typeof DataManager !== 'undefined') {
                        hasCache = !!DataManager.getCachedImage('ma_prod_img', product.partNo);
                    } else {
                        const key = 'ma_prod_img_' + safePartNo;
                        const cached = localStorage.getItem(key);
                        if (cached) {
                            try {
                                const parsed = JSON.parse(cached);
                                if (new Date().getTime() - parsed.timestamp < 5 * 60 * 1000) hasCache = true;
                            } catch(e) {}
                        }
                    }
                    
                    if (!hasCache) {
                        const placeholderEl = document.getElementById(`img-placeholder-${safePartNo}`);
                        if (placeholderEl && typeof APIHelper !== 'undefined') {
                            APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                                if (imgResult.success && imgResult.base64) {
                                    if (typeof DataManager !== 'undefined') {
                                        DataManager.setCachedImage('ma_prod_img', product.partNo, imgResult.base64);
                                    } else {
                                        const key = 'ma_prod_img_' + safePartNo;
                                        localStorage.setItem(key, JSON.stringify({ base64: imgResult.base64, timestamp: new Date().getTime() }));
                                    }
                                    if (placeholderEl && placeholderEl.parentNode) {
                                        placeholderEl.outerHTML = `<img src="${imgResult.base64}" alt="${product.partName}">`;
                                    }
                                }
                            }).catch(() => {
                                if (placeholderEl && placeholderEl.parentNode) placeholderEl.innerHTML = '<i class="fas fa-box"></i>';
                            });
                        }
                    }
                }
            });
            updateFloatingBar();
        }

        function toggleSelection(index) {
            if (selectedProducts.has(index)) selectedProducts.delete(index);
            else selectedProducts.add(index);
            
            const card = document.getElementById(`order-card-${index}`);
            if (card) {
                card.classList.toggle('selected');
                const icon = card.querySelector('.order-checkbox i');
                icon.className = selectedProducts.has(index) ? 'fas fa-check-circle' : 'fas fa-circle';
            }
            updateFloatingBar();
        }

        function selectAll() {
            orderProducts.forEach((_, index) => {
                selectedProducts.add(index);
                const card = document.getElementById(`order-card-${index}`);
                if (card) {
                    card.classList.add('selected');
                    card.querySelector('.order-checkbox i').className = 'fas fa-check-circle';
                }
            });
            updateFloatingBar();
            if (typeof Utils !== 'undefined') Utils.showToast('✅ All items selected', 'info');
        }

        function deselectAll() {
            selectedProducts.clear();
            orderProducts.forEach((_, index) => {
                const card = document.getElementById(`order-card-${index}`);
                if (card) {
                    card.classList.remove('selected');
                    card.querySelector('.order-checkbox i').className = 'fas fa-circle';
                }
            });
            updateFloatingBar();
            if (typeof Utils !== 'undefined') Utils.showToast('All items deselected', 'info');
        }

        function adjustQty(index, change) {
            const input = document.getElementById(`qty-${index}`);
            if (input) {
                input.value = Math.max(0, (parseInt(input.value) || 0) + change);
                updateFloatingBar();
                // Re-render to update estimated cost
                const product = orderProducts[index];
                const unitPrice = parseFloat(product.unitPrice) || 0;
                const newQty = parseInt(input.value) || 0;
                const costEl = input.parentElement.nextElementSibling;
                if (costEl) costEl.textContent = `Est: RM ${(newQty * unitPrice).toFixed(2)}`;
            }
        }

        function updateQty(index, value) {
            updateFloatingBar();
        }

        function updateFloatingBar() {
            const floatingBar = document.getElementById('floatingActionBar');
            const selectedCount = selectedProducts.size;
            document.getElementById('selectedCount').textContent = selectedCount;
            document.getElementById('floatingSelectedCount').textContent = selectedCount;
            
            let totalQty = 0;
            let totalCost = 0;
            selectedProducts.forEach(index => {
                const qtyInput = document.getElementById(`qty-${index}`);
                const qty = parseInt(qtyInput?.value) || 0;
                const product = orderProducts[index];
                const unitPrice = parseFloat(product.unitPrice) || 0;
                totalQty += qty;
                totalCost += (qty * unitPrice);
            });
            
            document.getElementById('floatingTotalQty').textContent = totalQty;
            document.getElementById('floatingTotalCost').textContent = totalCost.toFixed(2);
            floatingBar.style.display = selectedCount > 0 ? 'flex' : 'none';
        }

        // BARU: Fungsi Checkout ke Cart
        async function checkoutToCart() {
            if (selectedProducts.size === 0) {
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Sila pilih item untuk order!', 'warning');
                return;
            }
            
            if (!confirm(`✅ Anda akan tambah ${selectedProducts.size} item ke dalam Cart. Teruskan?`)) {
                return;
            }
            
            const selectedData = getSelectedProductsData();
            let successCount = 0;
            
            // Show loading
            const checkoutBtn = document.querySelector('.btn-checkout');
            const originalText = checkoutBtn.innerHTML;
            checkoutBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            checkoutBtn.disabled = true;
            
            try {
                for (const item of selectedData) {
                    const payload = {
                        action: 'addPurchaseOrder',
                        data: {
                            partNo: item.partNo,
                            partName: item.partName,
                            orderQty: item.orderQty,
                            unitPrice: item.unitPrice || 0,
                            remark: `From Predictive Ordering - ${new Date().toLocaleDateString()}`
                        }
                    };
                    
                    const response = await fetch(CONFIG.API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        successCount++;
                    }
                }
                
                if (typeof Utils !== 'undefined') {
                    Utils.showToast(`✅ Berjaya tambah ${successCount} item ke Cart!`, 'success');
                }
                
                // Clear selection
                selectedProducts.clear();
                updateFloatingBar();
                renderOrderList();
                
            } catch (error) {
                console.error('Checkout error:', error);
                if (typeof Utils !== 'undefined') Utils.showToast('❌ Ralat semasa checkout', 'error');
            } finally {
                checkoutBtn.innerHTML = originalText;
                checkoutBtn.disabled = false;
            }
        }

        function getSelectedProductsData() {
            const selected = [];
            selectedProducts.forEach(index => {
                const product = orderProducts[index];
                const qtyInput = document.getElementById(`qty-${index}`);
                selected.push({
                    partName: product.partName,
                    partNo: product.partNo,
                    currentStock: product.currentStock,
                    minimumStock: product.minimumStock,
                    unitPrice: parseFloat(product.unitPrice) || 0,
                    orderQty: parseInt(qtyInput?.value) || 0
                });
            });
            return selected;
        }

        function downloadCSV() {
            const selected = getSelectedProductsData();
            if (selected.length === 0) { 
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning'); 
                return; 
            }
            let csv = 'Part Name,Part No,Current Stock,Minimum Stock,Unit Price (RM),Order Qty,Estimated Cost (RM)\n';
            selected.forEach(p => { 
                const cost = p.orderQty * p.unitPrice;
                csv += `"${p.partName}","${p.partNo}",${p.currentStock},${p.minimumStock},${p.unitPrice.toFixed(2)},${p.orderQty},${cost.toFixed(2)}\n`; 
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; 
            link.download = `Predictive_Order_${new Date().toISOString().split('T')[0]}.csv`;
            link.click(); 
            URL.revokeObjectURL(url);
            if (typeof Utils !== 'undefined') Utils.showToast(`✅ CSV downloaded with ${selected.length} items`, 'success');
        }

        async function downloadPicture() {
            const selected = getSelectedProductsData();
            if (selected.length === 0) { 
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning'); 
                return; 
            }
            if (typeof Utils !== 'undefined') Utils.showToast('⏳ Generating images...', 'info');
            
            const tempContainer = document.createElement('div');
            tempContainer.style.cssText = 'position: fixed; left: -9999px; top: 0; background: white; padding: 20px; width: 800px;';
            let html = '<h2 style="text-align: center; margin-bottom: 20px;">Predictive Order List</h2>';
            html += '<table style="width: 100%; border-collapse: collapse;">';
            html += '<tr style="background: #f0f0f0;"><th style="padding: 10px; border: 1px solid #ddd;">Part Name</th><th style="padding: 10px; border: 1px solid #ddd;">Part No</th><th style="padding: 10px; border: 1px solid #ddd;">Current</th><th style="padding: 10px; border: 1px solid #ddd;">Min</th><th style="padding: 10px; border: 1px solid #ddd;">Unit Price</th><th style="padding: 10px; border: 1px solid #ddd;">Order Qty</th><th style="padding: 10px; border: 1px solid #ddd;">Total Cost</th></tr>';
            selected.forEach(p => {
                const cost = p.orderQty * p.unitPrice;
                html += `<tr><td style="padding: 10px; border: 1px solid #ddd;">${p.partName}</td><td style="padding: 10px; border: 1px solid #ddd;">${p.partNo}</td><td style="padding: 10px; border: 1px solid #ddd;">${p.currentStock}</td><td style="padding: 10px; border: 1px solid #ddd;">${p.minimumStock}</td><td style="padding: 10px; border: 1px solid #ddd;">RM ${p.unitPrice.toFixed(2)}</td><td style="padding: 10px; border: 1px solid #ddd;">${p.orderQty}</td><td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;">RM ${cost.toFixed(2)}</td></tr>`;
            });
            html += '</table>';
            tempContainer.innerHTML = html;
            document.body.appendChild(tempContainer);
            
            try {
                const canvas = await html2canvas(tempContainer, { scale: 2, backgroundColor: '#ffffff' });
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `Predictive_Order_${new Date().toISOString().split('T')[0]}.png`;
                    link.href = url; link.click(); URL.revokeObjectURL(url);
                }, 'image/png');
                if (typeof Utils !== 'undefined') Utils.showToast(`✅ Picture downloaded`, 'success');
            } catch (err) {
                console.error('Error:', err);
                if (typeof Utils !== 'undefined') Utils.showToast('❌ Failed to generate picture', 'error');
            }
            document.body.removeChild(tempContainer);
        }

        function shareText() {
            const selected = getSelectedProductsData();
            if (selected.length === 0) { 
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning'); 
                return; 
            }
            let text = '📦 *Predictive Order List*\n\n';
            let totalCost = 0;
            selected.forEach((p, i) => {
                const cost = p.orderQty * p.unitPrice;
                totalCost += cost;
                text += `${i + 1}. *${p.partName}* (${p.partNo})\nCurrent: ${p.currentStock} | Min: ${p.minimumStock}\nUnit Price: RM ${p.unitPrice.toFixed(2)} | Order Qty: *${p.orderQty}*\nEst. Cost: RM ${cost.toFixed(2)}\n\n`;
            });
            text += `Total Items: ${selected.length}\nTotal Qty: ${selected.reduce((sum, p) => sum + p.orderQty, 0)}\n`;
            text += `*Total Estimated Cost: RM ${totalCost.toFixed(2)}*\n\nPlease confirm availability. Thank you!`;
            
            if (navigator.share) {
                navigator.share({ title: 'Predictive Order List', text: text }).catch(() => {
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                });
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            }
        }
    </script>
</body>
</html>
