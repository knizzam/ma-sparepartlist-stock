<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Predictive Ordering - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="order.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="data-manager.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="order-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="order-title"><i class="fas fa-brain"></i>Predictive Ordering</h1>
        <div id="headerMenuTrigger" style="cursor: pointer; color: white;">
            <i class="fas fa-ellipsis-v" style="font-size: 20px;"></i>
        </div>
    </div>

    <!-- Summary Bar -->
    <div class="summary-bar">
        <div class="summary-item">
            <i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i>
            <span id="lowStockCount">0</span> Low
        </div>
        <div class="summary-item">
            <i class="fas fa-exclamation-circle" style="color: #ffc107;"></i>
            <span id="warningStockCount">0</span> Warning
        </div>
        <div class="summary-item">
            <i class="fas fa-check-circle" style="color: #28a745;"></i>
            <span id="selectedCount">0</span> Selected
        </div>
    </div>

    <!-- Product List -->
    <div class="order-list-container" id="orderListContainer">
        <div class="loading-container">
            <i class="fas fa-spinner fa-spin"></i>
            <div>Loading products...</div>
        </div>
    </div>

    <!-- Floating Action Bar -->
    <div class="floating-action-bar" id="floatingActionBar" style="display: none;">
        <div class="action-info">
            <i class="fas fa-check-circle"></i>
            <span id="floatingSelectedCount">0</span> items | Total: <span id="floatingTotalQty">0</span> units
        </div>
        <div class="action-buttons">
            <button class="action-btn btn-csv" onclick="downloadCSV()">
                <i class="fas fa-file-csv"></i> CSV
            </button>
            <button class="action-btn btn-picture" onclick="downloadPicture()">
                <i class="fas fa-image"></i> Picture
            </button>
            <button class="action-btn btn-share" onclick="shareText()">
                <i class="fas fa-share-alt"></i> Share
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProducts = [];
        let orderProducts = [];
        let selectedProducts = new Set();

        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            
            // Initialize Header Menu
            if (typeof HeaderMenu !== 'undefined') {
                HeaderMenu.init({
                    triggerId: 'headerMenuTrigger',
                    buttons: [
                        { icon: 'fas fa-check-double', title: 'Select All', color: '#1a73e8', action: selectAll },
                        { icon: 'fas fa-times', title: 'Deselect All', color: '#6c757d', action: deselectAll }
                    ]
                });
            }
        });

        async function loadProducts() {
            const container = document.getElementById('orderListContainer');
            
            try {
                let fetchedProducts = null;
                
                if (typeof DataManager !== 'undefined') {
                    fetchedProducts = await DataManager.fetchData(
                        'ma_inventory_product_list',
                        CONFIG.API_URL + '?action=getAllProducts',
                        'products'
                    );
                } else {
                    const cachedData = localStorage.getItem('ma_inventory_product_list');
                    if (cachedData) {
                        try {
                            const p = JSON.parse(cachedData);
                            if (new Date().getTime() - p.timestamp < 5 * 60 * 1000) {
                                fetchedProducts = p.data;
                            }
                        } catch(e) {}
                    }
                    if (!fetchedProducts) {
                        const res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
                        const result = await res.json();
                        if (result.success && result.products) {
                            fetchedProducts = result.products;
                            localStorage.setItem('ma_inventory_product_list', JSON.stringify({
                                data: fetchedProducts,
                                timestamp: new Date().getTime()
                            }));
                        }
                    }
                }
                
                if (fetchedProducts !== null) {
                    allProducts = fetchedProducts;
                    filterOrderProducts();
                } else {
                    container.innerHTML = '<div class="loading-container">Failed to load data</div>';
                }
            } catch (error) {
                console.error('Load error:', error);
                container.innerHTML = '<div class="loading-container" style="color: #dc3545;">Error: ' + error.message + '</div>';
            }
        }

        function filterOrderProducts() {
            // Hanya ambil barang yang currentStock <= minimumStock
            orderProducts = allProducts.filter(p => {
                const current = parseInt(p.currentStock) || 0;
                const minimum = parseInt(p.minimumStock) || 0;
                return current <= minimum;
            });
            
            // Susun: Low stock (current <= min/2) paling atas, lepas tu warning
            orderProducts.sort((a, b) => {
                const aRatio = (parseInt(a.currentStock) || 0) / (parseInt(a.minimumStock) || 1);
                const bRatio = (parseInt(b.currentStock) || 0) / (parseInt(b.minimumStock) || 1);
                return aRatio - bRatio;
            });
            
            renderOrderList();
        }

        function getStockStatus(current, min) {
            const ratio = current / min;
            if (ratio <= 0.5) return 'low';
            if (ratio <= 1) return 'warning';
            return 'normal';
        }

        function renderOrderList() {
            const container = document.getElementById('orderListContainer');
            
            if (orderProducts.length === 0) {
                container.innerHTML = '<div class="loading-container"><i class="fas fa-check-circle" style="font-size: 48px; color: #28a745; margin-bottom: 15px;"></i><div>All products are well stocked!</div></div>';
                return;
            }
            
            let lowCount = 0;
            let warningCount = 0;
            
            let html = '';
            orderProducts.forEach((product, index) => {
                const current = parseInt(product.currentStock) || 0;
                const minimum = parseInt(product.minimumStock) || 0;
                const status = getStockStatus(current, minimum);
                
                if (status === 'low') lowCount++;
                else if (status === 'warning') warningCount++;
                
                // Auto-calculate suggested order qty
                const suggestedQty = Math.ceil((minimum * 1.5) - current);
                const isSelected = selectedProducts.has(index);
                
                const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                const cachedImg = (typeof DataManager !== 'undefined') ? 
                    DataManager.getCachedImage('ma_prod_img', product.partNo) : null;
                
                let imgContent = '<i class="fas fa-box"></i>';
                if (cachedImg) {
                    imgContent = `<img src="${cachedImg}" alt="${product.partName}">`;
                } else if (product.pictureFileId) {
                    imgContent = `<div class="order-img-placeholder" id="img-placeholder-${safePartNo}"><i class="fas fa-spinner fa-spin"></i></div>`;
                }
                
                html += `
                    <div class="order-card ${status} ${isSelected ? 'selected' : ''}" id="order-card-${index}">
                        <div class="order-checkbox" onclick="toggleSelection(${index})">
                            <i class="fas ${isSelected ? 'fa-check-circle' : 'fa-circle'}"></i>
                        </div>
                        <div class="order-image">
                            ${imgContent}
                        </div>
                        <div class="order-info">
                            <div class="order-name">${product.partName}</div>
                            <div class="order-partno">${product.partNo}</div>
                            <div class="order-stock-info">
                                <span class="stock-current">Current: ${current}</span>
                                <span class="stock-min">Min: ${minimum}</span>
                            </div>
                            <div class="order-qty-section">
                                <label>Order Qty:</label>
                                <div class="qty-control">
                                    <button class="qty-btn" onclick="adjustQty(${index}, -1)">-</button>
                                    <input type="number" class="qty-input" id="qty-${index}" value="${suggestedQty}" min="0" onchange="updateQty(${index}, this.value)">
                                    <button class="qty-btn" onclick="adjustQty(${index}, 1)">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="order-status-badge ${status}">
                            ${status === 'low' ? ' LOW' : '🟡 WARNING'}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Update summary counts
            document.getElementById('lowStockCount').textContent = lowCount;
            document.getElementById('warningStockCount').textContent = warningCount;
            
            // Load images
            orderProducts.forEach((product, index) => {
                if (product.pictureFileId && !cachedImg) {
                    const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    const placeholderEl = document.getElementById(`img-placeholder-${safePartNo}`);
                    if (placeholderEl && typeof APIHelper !== 'undefined') {
                        APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                            if (imgResult.success && imgResult.base64) {
                                if (typeof DataManager !== 'undefined') {
                                    DataManager.setCachedImage('ma_prod_img', product.partNo, imgResult.base64);
                                }
                                if (placeholderEl && placeholderEl.parentNode) {
                                    placeholderEl.outerHTML = `<img src="${imgResult.base64}" alt="${product.partName}">`;
                                }
                            }
                        });
                    }
                }
            });
            
            updateFloatingBar();
        }

        function toggleSelection(index) {
            if (selectedProducts.has(index)) {
                selectedProducts.delete(index);
            } else {
                selectedProducts.add(index);
            }
            
            const card = document.getElementById(`order-card-${index}`);
            if (card) {
                card.classList.toggle('selected');
                const icon = card.querySelector('.order-checkbox i');
                icon.className = selectedProducts.has(index) ? 'fas fa-check-circle' : 'fas fa-circle';
            }
            
            updateFloatingBar();
        }

        function selectAll() {
            orderProducts.forEach((_, index) => {
                selectedProducts.add(index);
                const card = document.getElementById(`order-card-${index}`);
                if (card) {
                    card.classList.add('selected');
                    const icon = card.querySelector('.order-checkbox i');
                    icon.className = 'fas fa-check-circle';
                }
            });
            updateFloatingBar();
            if (typeof Utils !== 'undefined') Utils.showToast('✅ All items selected', 'info');
        }

        function deselectAll() {
            selectedProducts.clear();
            orderProducts.forEach((_, index) => {
                const card = document.getElementById(`order-card-${index}`);
                if (card) {
                    card.classList.remove('selected');
                    const icon = card.querySelector('.order-checkbox i');
                    icon.className = 'fas fa-circle';
                }
            });
            updateFloatingBar();
            if (typeof Utils !== 'undefined') Utils.showToast('All items deselected', 'info');
        }

        function adjustQty(index, change) {
            const input = document.getElementById(`qty-${index}`);
            if (input) {
                let newVal = parseInt(input.value) || 0;
                newVal = Math.max(0, newVal + change);
                input.value = newVal;
                updateFloatingBar();
            }
        }

        function updateQty(index, value) {
            updateFloatingBar();
        }

        function updateFloatingBar() {
            const floatingBar = document.getElementById('floatingActionBar');
            const selectedCount = selectedProducts.size;
            
            document.getElementById('selectedCount').textContent = selectedCount;
            document.getElementById('floatingSelectedCount').textContent = selectedCount;
            
            let totalQty = 0;
            selectedProducts.forEach(index => {
                const qtyInput = document.getElementById(`qty-${index}`);
                if (qtyInput) {
                    totalQty += parseInt(qtyInput.value) || 0;
                }
            });
            document.getElementById('floatingTotalQty').textContent = totalQty;
            
            if (selectedCount > 0) {
                floatingBar.style.display = 'flex';
            } else {
                floatingBar.style.display = 'none';
            }
        }

        function getSelectedProductsData() {
            const selected = [];
            selectedProducts.forEach(index => {
                const product = orderProducts[index];
                const qtyInput = document.getElementById(`qty-${index}`);
                const qty = parseInt(qtyInput?.value) || 0;
                
                selected.push({
                    partName: product.partName,
                    partNo: product.partNo,
                    currentStock: product.currentStock,
                    minimumStock: product.minimumStock,
                    orderQty: qty
                });
            });
            return selected;
        }

        // DOWNLOAD CSV
        function downloadCSV() {
            const selected = getSelectedProductsData();
            if (selected.length === 0) {
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning');
                return;
            }
            
            let csv = 'Part Name,Part No,Current Stock,Minimum Stock,Order Qty\n';
            selected.forEach(p => {
                csv += `"${p.partName}","${p.partNo}",${p.currentStock},${p.minimumStock},${p.orderQty}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `Predictive_Order_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            URL.revokeObjectURL(url);
            
            if (typeof Utils !== 'undefined') Utils.showToast(`✅ CSV downloaded with ${selected.length} items`, 'success');
        }

        // DOWNLOAD PICTURE
        async function downloadPicture() {
            const selected = getSelectedProductsData();
            if (selected.length === 0) {
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning');
                return;
            }
            
            if (typeof Utils !== 'undefined') Utils.showToast('⏳ Generating images...', 'info');
            
            // Create a temporary container for rendering
            const tempContainer = document.createElement('div');
            tempContainer.style.cssText = 'position: fixed; left: -9999px; top: 0; background: white; padding: 20px; width: 800px;';
            
            let html = '<h2 style="text-align: center; margin-bottom: 20px;">Predictive Order List</h2>';
            html += '<table style="width: 100%; border-collapse: collapse;">';
            html += '<tr style="background: #f0f0f0;"><th style="padding: 10px; border: 1px solid #ddd;">Part Name</th><th style="padding: 10px; border: 1px solid #ddd;">Part No</th><th style="padding: 10px; border: 1px solid #ddd;">Current</th><th style="padding: 10px; border: 1px solid #ddd;">Min</th><th style="padding: 10px; border: 1px solid #ddd;">Order Qty</th></tr>';
            
            selected.forEach(p => {
                html += `<tr>
                    <td style="padding: 10px; border: 1px solid #ddd;">${p.partName}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">${p.partNo}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">${p.currentStock}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">${p.minimumStock}</td>
                    <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;">${p.orderQty}</td>
                </tr>`;
            });
            
            html += '</table>';
            tempContainer.innerHTML = html;
            document.body.appendChild(tempContainer);
            
            try {
                const canvas = await html2canvas(tempContainer, { scale: 2, backgroundColor: '#ffffff' });
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `Predictive_Order_${new Date().toISOString().split('T')[0]}.png`;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                }, 'image/png');
                
                if (typeof Utils !== 'undefined') Utils.showToast(`✅ Picture downloaded`, 'success');
            } catch (err) {
                console.error('Error:', err);
                if (typeof Utils !== 'undefined') Utils.showToast('❌ Failed to generate picture', 'error');
            }
            
            document.body.removeChild(tempContainer);
        }

        // SHARE TEXT (WhatsApp)
        function shareText() {
            const selected = getSelectedProductsData();
            if (selected.length === 0) {
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Please select at least one product!', 'warning');
                return;
            }
            
            let text = '📦 *Predictive Order List*\n\n';
            selected.forEach((p, i) => {
                text += `${i + 1}. *${p.partName}* (${p.partNo})\n`;
                text += `   Current: ${p.currentStock} | Min: ${p.minimumStock}\n`;
                text += `   Order Qty: *${p.orderQty}*\n\n`;
            });
            
            text += `Total Items: ${selected.length}\n`;
            const totalQty = selected.reduce((sum, p) => sum + p.orderQty, 0);
            text += `Total Qty: ${totalQty}\n\n`;
            text += 'Please confirm availability. Thank you!';
            
            // Try Web Share API first
            if (navigator.share) {
                navigator.share({
                    title: 'Predictive Order List',
                    text: text
                }).then(() => {
                    if (typeof Utils !== 'undefined') Utils.showToast('✅ Shared successfully!', 'success');
                }).catch(err => {
                    if (err.name !== 'AbortError') {
                        // Fallback to WhatsApp
                        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
                        window.open(whatsappUrl, '_blank');
                    }
                });
            } else {
                // Fallback to WhatsApp
                const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
                window.open(whatsappUrl, '_blank');
            }
        }
    </script>
</body>
</html>
