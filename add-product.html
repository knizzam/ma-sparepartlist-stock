<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Product - MA Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="add-product.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="photo-picker.js"></script>
</head>
<body>

    <div class="add-product-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="add-product-title"><i class="fas fa-box-open"></i>Product Management</h1>
    </div>

    <div class="main-container">
        
        <!-- VIEW 1: FORM (Default Visible) -->
        <div id="formView">
            <div class="form-card">
                <!-- HEADER CARD DENGAN FAB BUTTON -->
                <div class="form-card-header">
                    <div class="form-section-title" style="margin-bottom: 0;">Product Information</div>
                    <button class="fab-inline" onclick="showListView()" title="View Recent Products" type="button">
                        <i class="fas fa-history"></i>
                    </button>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Product Photo</label>
                    <div class="photo-upload-wrapper" id="photoWrapper">
                        <div class="photo-placeholder" id="photoPlaceholder" onclick="showPhotoMenu(event)">
                            <i class="fas fa-camera"></i>
                            <span>Tap to upload<br>or take photo</span>
                        </div>
                        <img id="photoPreview" class="photo-preview-large" alt="Preview" onclick="showPhotoMenu(event)">
                        <input type="file" id="photoInput" accept="image/*">
                    </div>
                </div>

                <div class="form-group"><label class="form-label">Part Name</label><input type="text" class="form-input" id="partName" placeholder="e.g., CAP NUT"></div>
                <div class="form-group"><label class="form-label">Part No.</label><input type="text" class="form-input" id="partNo" placeholder="e.g., BTM-M6"></div>
                <div class="form-group"><label class="form-label">No. Spec</label><input type="text" class="form-input" id="noSpec" placeholder="e.g., M6x1.0"></div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" class="form-input" id="location" placeholder="e.g., Rack A-01"></div>
                
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-input" id="category" style="cursor: pointer;">
                        <option value="Uncategorized">-- Pilih Kategori --</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Consumable">Consumable</option>
                        <option value="Tools">Tools</option>
                        <option value="Safety">Safety</option>
                        <option value="Kaizen">Kaizen</option>
                    </select>
                </div>
            </div>

            <div class="form-card">
                <div class="form-section-title">Stock Information</div>
                <div class="form-group"><label class="form-label">Current Stock</label><input type="number" class="form-input" id="currentStock" placeholder="0" min="0"></div>
                <div class="form-group"><label class="form-label">Minimum Stock</label><input type="number" class="form-input" id="minimumStock" placeholder="0" min="0"></div>
            </div>

            <!-- ACTION BUTTONS -->
            <div style="display: flex !important; gap: 10px; margin-top: 15px; width: 100%;">
                <button type="button" id="cancelBtn" onclick="cancelEdit()" style="flex: 1; padding: 14px; background: #f5f5f5; color: #666; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; min-height: 48px;">Cancel</button>
                <button type="button" id="saveBtn" onclick="saveProduct()" style="flex: 1; padding: 14px; background: linear-gradient(to right, #1a73e8, #1557b0); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3); min-height: 48px;">Add Product</button>
            </div>
        </div>

        <!-- VIEW 2: RECENT PRODUCTS LIST (Default Hidden) -->
        <div id="listView" style="display: none;">
            <div class="product-search-section">
                <div class="product-search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" class="product-search-input" id="recentProductSearch" placeholder="Search by Part Name, Part No, or Location..." onkeyup="filterRecentProducts()">
                </div>
            </div>

            <!-- HEADER LIST DENGAN FAB BUTTON -->
            <div class="list-header-add">
                <div class="list-title-add" id="listTitleAdd">Recent Products <span class="list-badge-add" id="productCount">0</span></div>
                <button class="fab-inline" onclick="showFormView()" title="Add New Product" type="button">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            
            <div class="product-list-add" id="productList">
                <div class="empty-state-list">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div>Loading recent products...</div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let tempPhotoBase64 = '', editingPartNo = null, allProducts = [];
        const PRODUCT_LIST_CACHE_KEY = 'ma_inventory_product_list', CACHE_EXPIRY = 5 * 60 * 1000;

        document.addEventListener('DOMContentLoaded', function() {
            PhotoPicker.init({
                wrapperId: 'photoWrapper', inputId: 'photoInput', previewId: 'photoPreview', placeholderId: 'photoPlaceholder'
            });
            document.getElementById('photoInput').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) { 
                        tempPhotoBase64 = ev.target.result;
                        // Show preview immediately
                        const preview = document.getElementById('photoPreview');
                        const placeholder = document.getElementById('photoPlaceholder');
                        preview.src = ev.target.result;
                        preview.style.display = 'block';
                        placeholder.style.display = 'none';
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
            showFormView();
            loadProductList();
        });

        // PHOTO MENU FUNCTION (Fallback jika photo-picker.js tidak load)
        function showPhotoMenu(event) {
            if (event) event.preventDefault();
            const photoInput = document.getElementById('photoInput');
            if (photoInput) {
                photoInput.click();
            } else {
                alert('Photo picker tidak tersedia');
            }
        }

        function showFormView() {
            document.getElementById('formView').style.display = 'block';
            document.getElementById('listView').style.display = 'none';
            document.getElementById('recentProductSearch').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showListView() {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            renderFromCache();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderFromCache() {
            const cachedData = localStorage.getItem(PRODUCT_LIST_CACHE_KEY);
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                        allProducts = parsed.data;
                        renderProductList('');
                        return;
                    }
                } catch(e) {}
            }
            loadProductList(true);
        }

        function getCachedProductImage(partNo) {
            try {
                const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                const item = localStorage.getItem(key);
                if (!item) return null;
                const parsed = JSON.parse(item);
                if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) return parsed.base64;
                localStorage.removeItem(key); return null;
            } catch(e) { return null; }
        }

        function setCachedProductImage(partNo, base64) {
            try {
                const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                localStorage.setItem(key, JSON.stringify({ base64: base64, timestamp: new Date().getTime() }));
            } catch(e) {}
        }

        function isWithinLast5Days(dateStr) {
            if (!dateStr) return false;
            try { 
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return false;
                const fiveDaysAgo = new Date();
                fiveDaysAgo.setDate(fiveDaysAgo.getDate() - 5);
                return date >= fiveDaysAgo; 
            } catch (e) { return false; }
        }

        async function loadProductList(forceRefresh = false) {
            const container = document.getElementById('productList');
            
            if (!forceRefresh) {
                const cachedData = localStorage.getItem(PRODUCT_LIST_CACHE_KEY);
                if (cachedData) {
                    try {
                        const parsed = JSON.parse(cachedData);
                        if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                            allProducts = parsed.data; 
                            renderProductList('');
                            return;
                        }
                    } catch(e) {}
                }
            }
            
            container.innerHTML = '<div class="empty-state-list"><i class="fas fa-spinner fa-spin"></i><div>Loading products...</div></div>';
            
            try {
                const res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
                const result = await res.json();
                if (result.success && result.products) {
                    allProducts = result.products;
                    localStorage.setItem(PRODUCT_LIST_CACHE_KEY, JSON.stringify({ data: allProducts, timestamp: new Date().getTime() }));
                    renderProductList('');
                } else { 
                    container.innerHTML = '<div class="empty-state-list"><i class="fas fa-box-open"></i><div>Tiada produk</div></div>'; 
                }
            } catch (error) {
                container.innerHTML = '<div class="empty-state-list"><i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i><div>Gagal memuatkan data</div></div>';
            }
        }

        function filterRecentProducts() {
            const searchTerm = document.getElementById('recentProductSearch').value.toLowerCase().trim();
            renderProductList(searchTerm);
        }

        function renderProductList(searchTerm = '') {
            const productList = document.getElementById('productList');
            const listTitle = document.getElementById('listTitleAdd');
            
            let recentProducts = allProducts.filter(p => isWithinLast5Days(p.lastUpdateDate));
            
            if (recentProducts.length === 0 && allProducts.length > 0) {
                recentProducts = allProducts.slice(-10).reverse();
                listTitle.innerHTML = 'Latest Products <span class="list-badge-add" id="productCount">0</span>';
            } else {
                listTitle.innerHTML = 'Recent Products (5 Hari) <span class="list-badge-add" id="productCount">0</span>';
            }
            
            let displayProducts = recentProducts;
            if (searchTerm) {
                displayProducts = recentProducts.filter(p => 
                    p.partName.toLowerCase().includes(searchTerm) || 
                    p.partNo.toLowerCase().includes(searchTerm) || 
                    (p.location && p.location.toLowerCase().includes(searchTerm))
                );
            }
            
            document.getElementById('productCount').textContent = displayProducts.length;
            
            if (displayProducts.length === 0) {
                productList.innerHTML = '<div class="empty-state-list"><i class="fas fa-search"></i><div>Tiada produk dijumpai</div></div>'; 
                return;
            }
            
            let html = '';
            displayProducts.forEach(product => {
                const currentStock = parseInt(product.currentStock) || 0;
                const minimumStock = parseInt(product.minimumStock) || 0;
                
                const thresholdOK = minimumStock + (minimumStock * 0.5);
                let statusClass = 'high';
                if (currentStock > thresholdOK) statusClass = 'high';
                else if (currentStock > minimumStock) statusClass = 'mid';
                else statusClass = 'low';

                const isEditing = editingPartNo === product.partNo ? 'editing' : '';
                const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                const cachedImg = getCachedProductImage(product.partNo);
                let avatarHTML = cachedImg ? '<img src="' + cachedImg + '" alt="' + product.partName + '">' : '<i class="fas fa-box"></i>';
                
                html += '<div class="product-card-add status-' + statusClass + ' ' + isEditing + '" onclick="editProduct(\'' + product.partNo + '\', \'' + product.partName + '\', \'' + product.noSpec + '\', \'' + product.location + '\', \'' + product.category + '\', ' + product.currentStock + ', ' + product.minimumStock + ', \'' + product.pictureFileId + '\')">';
                html += '<div class="product-avatar-add" id="prod-avatar-' + safePartNo + '">' + avatarHTML + '</div>';
                html += '<div class="product-info-add">';
                html += '<div class="product-name-add">' + product.partName + '</div>';
                html += '<span class="product-badge-add">' + product.partNo + '</span>';
                html += '<div class="product-location-add"><i class="fas fa-map-marker-alt"></i> ' + (product.location || '-') + '</div>';
                html += '</div>';
                html += '<div class="product-stock-add">';
                html += '<div class="product-status-add ' + statusClass + '"></div>';
                html += '<div class="stock-label-add">Stock</div>';
                html += '<div class="stock-number-add">' + product.currentStock + '</div>';
                html += '</div>';
                html += '<button class="delete-btn-add" onclick="event.stopPropagation(); deleteProduct(\'' + product.partNo + '\')"><i class="fas fa-trash"></i></button>';
                html += '</div>';
            });
            productList.innerHTML = html;
            
            displayProducts.forEach(product => {
                if (product.pictureFileId && !getCachedProductImage(product.partNo)) {
                    const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    const avatarBox = document.getElementById('prod-avatar-' + safePartNo);
                    if (avatarBox && avatarBox.querySelector('i')) {
                        APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                            if (imgResult.success && imgResult.base64) {
                                setCachedProductImage(product.partNo, imgResult.base64);
                                avatarBox.innerHTML = '<img src="' + imgResult.base64 + '" alt="' + product.partName + '">';
                            }
                        });
                    }
                }
            });
        }

        function editProduct(partNo, partName, noSpec, location, category, currentStock, minimumStock, pictureFileId) {
            editingPartNo = partNo;
            document.getElementById('partName').value = partName;
            document.getElementById('partNo').value = partNo;
            document.getElementById('noSpec').value = noSpec;
            document.getElementById('location').value = location;
            document.getElementById('category').value = category || 'Uncategorized';
            document.getElementById('currentStock').value = currentStock;
            document.getElementById('minimumStock').value = minimumStock;
            document.getElementById('saveBtn').innerText = 'Update Product';
            
            const preview = document.getElementById('photoPreview');
            const placeholder = document.getElementById('photoPlaceholder');
            const cachedImg = getCachedProductImage(partNo);
            
            if (cachedImg) { preview.src = cachedImg; preview.style.display = 'block'; placeholder.style.display = 'none'; tempPhotoBase64 = ''; } 
            else if (pictureFileId && pictureFileId.trim() !== '') {
                APIHelper.fetchImage(pictureFileId).then(imgResult => {
                    if (imgResult.success && imgResult.base64) {
                        preview.src = imgResult.base64; preview.style.display = 'block'; placeholder.style.display = 'none'; tempPhotoBase64 = '';
                    }
                });
            } else { preview.style.display = 'none'; placeholder.style.display = 'flex'; tempPhotoBase64 = ''; }
            
            showFormView();
        }

        function cancelEdit() { 
            resetForm(); 
            Utils.showToast('Form dikosongkan', 'info'); 
        }

        async function saveProduct() {
            const partName = document.getElementById('partName').value.trim();
            const partNo = document.getElementById('partNo').value.trim();
            const noSpec = document.getElementById('noSpec').value.trim();
            const location = document.getElementById('location').value.trim();
            const category = document.getElementById('category').value.trim();
            const currentStock = document.getElementById('currentStock').value || 0;
            const minimumStock = document.getElementById('minimumStock').value || 0;

            if (!partName || !partNo) { Utils.showToast('⚠️ Part Name dan Part No. wajib diisi!', 'warning'); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Saving...'; btn.disabled = true;

            const action = editingPartNo ? 'updateProduct' : 'addProduct';
            const payload = { action, data: { partName, partNo, noSpec, location, category, currentStock, minimumStock, originalPartNo: editingPartNo } };

            try {
                await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
                if (tempPhotoBase64) {
                    await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'uploadProductPicture', data: { base64: tempPhotoBase64, partNo } }) });
                    setCachedProductImage(partNo, tempPhotoBase64);
                }
                Utils.showToast('✅ Produk berjaya disimpan!', 'success');
                resetForm(); 
            } catch (error) {
                Utils.showToast(' Ralat semasa menyimpan', 'error');
                btn.innerText = editingPartNo ? 'Update Product' : 'Add Product'; btn.disabled = false;
            }
        }

        async function deleteProduct(partNo) {
            if (!confirm('⚠️ Adakah anda pasti ingin memadam produk ini?')) return;
            try {
                await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'deleteProduct', data: { partNo } }) });
                localStorage.removeItem('ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, ''));
                Utils.showToast('✅ Produk berjaya dipadam', 'success');
                loadProductList(true);
            } catch (error) { Utils.showToast('❌ Gagal memadam produk', 'error'); }
        }

        function resetForm() {
            document.getElementById('partName').value = '';
            document.getElementById('partNo').value = '';
            document.getElementById('noSpec').value = '';
            document.getElementById('location').value = '';
            document.getElementById('category').value = 'Uncategorized';
            document.getElementById('currentStock').value = '';
            document.getElementById('minimumStock').value = '';
            PhotoPicker.reset();
            tempPhotoBase64 = ''; 
            editingPartNo = null;
            document.getElementById('saveBtn').innerText = 'Add Product';
        }
    </script>
</body>
</html>
