<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - MA Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="register.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="photo-picker.js"></script>
    <script src="data-manager.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

    <div class="register-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="register-title"><i class="fas fa-users-cog"></i>User Management</h1>
    </div>

    <div class="main-container">
        <!-- VIEW 1: FORM -->
        <div id="formView" style="display: none;">
            <div class="form-card">
                <div class="form-card-header">
                    <div class="form-section-title" style="margin-bottom: 0;">Account Details</div>
                    <button class="fab-inline" onclick="showListView()" title="View User List" type="button">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                </div>
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" id="userName" placeholder="e.g., Mohd Khairul Nizzam"></div>
                <div class="form-group"><label class="form-label">ID Number (No. K/T)</label><input type="text" class="form-input" id="userNoKad" placeholder="e.g., K572"></div>
                <div class="form-group"><label class="form-label">Role</label><input type="text" class="form-input" id="userRole" placeholder="e.g., Admin, Staff"></div>
                <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" id="userEmail" placeholder="e.g., user@company.com"></div>
            </div>

            <div class="form-card">
                <div class="form-card-header">
                    <div class="form-section-title" style="margin-bottom: 0;">Profile & Status</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Profile Picture</label>
                    <div class="photo-upload-wrapper" id="photoWrapper">
                        <div class="photo-placeholder" id="photoPlaceholder" onclick="showPhotoMenu(event)">
                            <i class="fas fa-camera"></i><span>Tap to upload<br>or take photo</span>
                        </div>
                        <img id="photoPreview" class="photo-preview-large" alt="Preview" onclick="showPhotoMenu(event)">
                        <input type="file" id="photoInput" accept="image/*">
                    </div>
                </div>
                <div class="form-group">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="userActive" checked>
                        <span style="font-size: 14px; font-weight: 500; color: #333;">Activate this account</span>
                    </label>
                </div>
            </div>

            <div style="display: flex !important; flex-direction: row !important; gap: 10px !important; margin-top: 20px !important; width: 100% !important; min-height: 50px !important;">
                <button type="button" id="cancelBtn" onclick="showListView()" style="flex: 1 !important; padding: 14px !important; background: #f5f5f5 !important; color: #666 !important; border: none !important; border-radius: 12px !important; font-size: 15px !important; font-weight: bold !important; cursor: pointer !important; min-height: 48px !important; display: inline-block !important; visibility: visible !important;">Cancel</button>
                <button type="button" id="saveBtn" onclick="saveUser()" style="flex: 1 !important; padding: 14px !important; background: linear-gradient(to right, #1a73e8, #1557b0) !important; color: white !important; border: none !important; border-radius: 12px !important; font-size: 15px !important; font-weight: bold !important; cursor: pointer !important; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3) !important; min-height: 48px !important; display: inline-block !important; visibility: visible !important;">Add User</button>
            </div>
        </div>

        <!-- VIEW 2: USER LIST -->
        <div id="listView">
            <div class="user-search-section">
                <div class="user-search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" class="user-search-input" id="userSearchInput" placeholder="Search by name, ID, or email..." onkeyup="filterUsers()">
                </div>
            </div>

            <div class="list-header-add">
                <div class="list-title">Registered Users <span class="list-badge" id="userCount">0</span></div>
                <button class="fab-inline" onclick="showAddForm()" title="Add New User" type="button">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            
            <div class="user-list" id="userList">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><div>Loading users...</div></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let tempPhotoBase64 = '', editingEmail = null, allUsers = [];
        const USER_CACHE_KEY = 'ma_inventory_user_list';
        const USER_IMG_PREFIX = 'ma_user_img';

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof PhotoPicker !== 'undefined') {
                PhotoPicker.init({ 
                    wrapperId: 'photoWrapper', 
                    inputId: 'photoInput', 
                    previewId: 'photoPreview', 
                    placeholderId: 'photoPlaceholder' 
                });
            }
            
            document.getElementById('photoInput').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) { 
                        tempPhotoBase64 = ev.target.result;
                        document.getElementById('photoPreview').src = ev.target.result;
                        document.getElementById('photoPreview').style.display = 'block';
                        document.getElementById('photoPlaceholder').style.display = 'none';
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            showListView();
        });

        function showPhotoMenu(event) {
            if (event) event.preventDefault();
            document.getElementById('photoInput').click();
        }

        // PENTING: showListView sekarang async untuk force refresh selepas save
        async function showListView(forceRefresh = false) {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            resetForm();
            await loadUserList(forceRefresh); // Force refresh jika perlu
        }

        function showAddForm() {
            editingEmail = null;
            resetForm();
            document.getElementById('saveBtn').innerText = 'Add User';
            document.getElementById('formView').style.display = 'block';
            document.getElementById('listView').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            console.log('[ShowAddForm] editingEmail:', editingEmail);
        }

        function showEditForm() {
            if (!editingEmail) {
                console.error('[ShowEditForm] ERROR: editingEmail is null!');
                alert('Error: No user selected for editing');
                return;
            }
            document.getElementById('saveBtn').innerText = 'Update User';
            document.getElementById('formView').style.display = 'block';
            document.getElementById('listView').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            console.log('[ShowEditForm] editingEmail:', editingEmail);
        }

        function filterUsers() {
            const searchTerm = document.getElementById('userSearchInput').value.toLowerCase().trim();
            if (!searchTerm) { renderUserList(allUsers); return; }
            const filtered = allUsers.filter(user => 
                user.name.toLowerCase().includes(searchTerm) || 
                user.noKad.toLowerCase().includes(searchTerm) || 
                user.email.toLowerCase().includes(searchTerm)
            );
            renderUserList(filtered);
        }

        async function loadUserList(forceRefresh = false) {
            const container = document.getElementById('userList');
            container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><div>Loading users...</div></div>';
            
            try {
                let fetchedUsers = null;
                
                if (typeof DataManager !== 'undefined') {
                    fetchedUsers = await DataManager.fetchData(
                        USER_CACHE_KEY, 
                        CONFIG.API_URL + '?action=getAllUsers', 
                        'users',
                        forceRefresh // PENTING: Force refresh dari server
                    );
                } else {
                    if (forceRefresh) {
                        localStorage.removeItem(USER_CACHE_KEY);
                    }
                    const cachedData = localStorage.getItem(USER_CACHE_KEY);
                    if (cachedData) {
                        try {
                            const p = JSON.parse(cachedData);
                            if (new Date().getTime() - p.timestamp < 5 * 60 * 1000) {
                                fetchedUsers = p.data;
                            }
                        } catch(e) {}
                    }
                    
                    if (!fetchedUsers) {
                        const res = await fetch(CONFIG.API_URL + '?action=getAllUsers');
                        const result = await res.json();
                        if (result.success && result.users) {
                            fetchedUsers = result.users;
                            localStorage.setItem(USER_CACHE_KEY, JSON.stringify({
                                data: fetchedUsers,
                                timestamp: new Date().getTime()
                            }));
                        }
                    }
                }
                
                if (fetchedUsers !== null) {
                    allUsers = fetchedUsers;
                    console.log('[LoadUserList] Users loaded:', allUsers.length, 'Force refresh:', forceRefresh);
                    renderUserList(allUsers);
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i><div>Failed to load data</div></div>';
                }
            } catch (error) {
                console.error('[LoadUserList] Error:', error);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color: #dc3545;"></i><div>Error: ' + error.message + '</div></div>';
            }
        }

        function renderUserList(users) {
            const userList = document.getElementById('userList');
            document.getElementById('userCount').textContent = users.length;
            
            if (users.length === 0) { 
                userList.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><div>No users found</div></div>'; 
                return; 
            }
            
            let html = '';
            users.forEach(user => {
                const isActive = user.active;
                const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
                const safeEmail = user.email.replace(/[^a-zA-Z0-9]/g, '');
                
                let cachedImage = null;
                if (typeof DataManager !== 'undefined') {
                    cachedImage = DataManager.getCachedImage(USER_IMG_PREFIX, user.email);
                } else {
                    const key = USER_IMG_PREFIX + '_' + safeEmail;
                    const cached = localStorage.getItem(key);
                    if (cached) {
                        try {
                            const p = JSON.parse(cached);
                            if (new Date().getTime() - p.timestamp < 5 * 60 * 1000) cachedImage = p.base64;
                        } catch(e) {}
                    }
                }
                
                let avatarHTML = initial;
                if (cachedImage && user.pictureFileId) {
                    avatarHTML = `<img src="${cachedImage}" alt="${user.name}" style="width:100%; height:100%; object-fit:cover;">`;
                }

                html += `
                    <div class="user-card ${isActive ? '' : 'inactive'}" onclick="editUser('${user.email}', '${user.role}', '${user.name}', '${user.noKad}', ${user.active}, '${user.pictureFileId}')">
                        <div class="user-avatar" id="avatar-box-${safeEmail}">${avatarHTML}</div>
                        <div class="user-info">
                            <div class="user-name">${user.name}</div>
                            <div class="user-id">${user.noKad || '-'}</div>
                            <span class="user-role-badge">${user.role || 'User'}</span>
                        </div>
                        <div class="user-status ${isActive ? '' : 'inactive'}"></div>
                        <button class="delete-btn-small" onclick="event.stopPropagation(); deleteUser('${user.email}')"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
            userList.innerHTML = html;

            users.forEach(user => {
                if (user.pictureFileId && user.pictureFileId !== 'new') {
                    let hasCache = false;
                    if (typeof DataManager !== 'undefined') {
                        hasCache = !!DataManager.getCachedImage(USER_IMG_PREFIX, user.email);
                    } else {
                        const key = USER_IMG_PREFIX + '_' + user.email.replace(/[^a-zA-Z0-9]/g, '');
                        hasCache = !!localStorage.getItem(key);
                    }
                    
                    if (!hasCache) {
                        const safeEmail = user.email.replace(/[^a-zA-Z0-9]/g, '');
                        const avatarBox = document.getElementById(`avatar-box-${safeEmail}`);
                        if (avatarBox && typeof APIHelper !== 'undefined') {
                            APIHelper.fetchImage(user.pictureFileId).then(imgResult => {
                                if (imgResult.success && imgResult.base64) {
                                    if (typeof DataManager !== 'undefined') {
                                        DataManager.setCachedImage(USER_IMG_PREFIX, user.email, imgResult.base64);
                                    } else {
                                        const key = USER_IMG_PREFIX + '_' + safeEmail;
                                        localStorage.setItem(key, JSON.stringify({ base64: imgResult.base64, timestamp: new Date().getTime() }));
                                    }
                                    avatarBox.innerHTML = `<img src="${imgResult.base64}" alt="${user.name}" style="width:100%; height:100%; object-fit:cover;">`;
                                }
                            });
                        }
                    }
                }
            });
        }

        function editUser(email, role, name, noKad, active, pictureFileId) {
            console.log('[EditUser] Called with email:', email, 'pictureFileId:', pictureFileId);
            
            // PENTING: Set editingEmail SEBELUM panggil showEditForm
            editingEmail = email;
            
            // Load data ke form
            document.getElementById('userName').value = name || '';
            document.getElementById('userNoKad').value = noKad || '';
            document.getElementById('userRole').value = role || '';
            document.getElementById('userEmail').value = email || '';
            document.getElementById('userActive').checked = active !== false;
            
            console.log('[EditUser] Form loaded, editingEmail:', editingEmail);
            
            // Load gambar
            const preview = document.getElementById('photoPreview');
            const placeholder = document.getElementById('photoPlaceholder');
            
            let cachedImage = null;
            if (typeof DataManager !== 'undefined') {
                cachedImage = DataManager.getCachedImage(USER_IMG_PREFIX, email);
            } else {
                const key = USER_IMG_PREFIX + '_' + email.replace(/[^a-zA-Z0-9]/g, '');
                const cached = localStorage.getItem(key);
                if (cached) {
                    try {
                        const p = JSON.parse(cached);
                        if (new Date().getTime() - p.timestamp < 5 * 60 * 1000) cachedImage = p.base64;
                    } catch(e) {}
                }
            }
            
            if (cachedImage) { 
                preview.src = cachedImage; 
                preview.style.display = 'block'; 
                placeholder.style.display = 'none'; 
                tempPhotoBase64 = ''; 
            } else if (pictureFileId && pictureFileId.trim() !== '' && pictureFileId !== 'new' && typeof APIHelper !== 'undefined') {
                APIHelper.fetchImage(pictureFileId).then(imgResult => {
                    if (imgResult.success && imgResult.base64) {
                        preview.src = imgResult.base64; 
                        preview.style.display = 'block'; 
                        placeholder.style.display = 'none'; 
                        tempPhotoBase64 = '';
                    }
                });
            } else { 
                preview.style.display = 'none'; 
                placeholder.style.display = 'flex'; 
                tempPhotoBase64 = ''; 
            }
            
            showEditForm();
        }

        function resetForm() {
            document.getElementById('userName').value = '';
            document.getElementById('userNoKad').value = '';
            document.getElementById('userRole').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userActive').checked = true;
            if (typeof PhotoPicker !== 'undefined') PhotoPicker.reset();
            tempPhotoBase64 = ''; 
            editingEmail = null;
            console.log('[ResetForm] Form reset, editingEmail:', editingEmail);
        }

        async function saveUser() {
            console.log('[SaveUser] Called, editingEmail:', editingEmail);
            
            const name = document.getElementById('userName').value.trim();
            const noKad = document.getElementById('userNoKad').value.trim();
            const role = document.getElementById('userRole').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const active = document.getElementById('userActive').checked;

            if (!email || !name) { 
                if (typeof Utils !== 'undefined') Utils.showToast('⚠️ Email dan Nama Penuh wajib diisi!', 'warning');
                else alert('Email dan Nama Penuh wajib diisi!');
                return; 
            }

            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Saving...'; 
            btn.disabled = true;

            const action = editingEmail ? 'updateUser' : 'addUser';
            const payload = { 
                action, 
                data: { 
                    email, 
                    role, 
                    name, 
                    noKad, 
                    active, 
                    originalEmail: editingEmail
                } 
            };

            console.log('[SaveUser] Payload:', payload);

            try {
                await fetch(CONFIG.API_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'text/plain' }, 
                    body: JSON.stringify(payload) 
                });
                
                if (tempPhotoBase64) {
                    await fetch(CONFIG.API_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'text/plain' }, 
                        body: JSON.stringify({ 
                            action: 'uploadUserPicture', 
                            data: { base64: tempPhotoBase64, email } 
                        }) 
                    });
                    if (typeof DataManager !== 'undefined') {
                        DataManager.setCachedImage(USER_IMG_PREFIX, email, tempPhotoBase64);
                    }
                }

                // Clear cache
                if (typeof DataManager !== 'undefined') {
                    DataManager.clearCache(USER_CACHE_KEY);
                } else {
                    localStorage.removeItem(USER_CACHE_KEY);
                }
                
                // PENTING: Force refresh dari server untuk dapat pictureFileId yang betul
                console.log('[SaveUser] Force refreshing data from server...');
                await showListView(true); // Force refresh = true
                
                if (typeof Utils !== 'undefined') Utils.showToast('✅ Pengguna berjaya disimpan!', 'success');
                else alert('Pengguna berjaya disimpan!');

            } catch (error) {
                console.error('[SaveUser] Error:', error);
                if (typeof Utils !== 'undefined') Utils.showToast('❌ Ralat semasa menyimpan', 'error');
                else alert('Ralat semasa menyimpan');
                btn.innerText = editingEmail ? 'Update User' : 'Add User'; 
                btn.disabled = false;
            }
        }

        async function deleteUser(email) {
            if (!confirm('⚠️ Adakah anda pasti ingin memadam pengguna ini?')) return;
            try {
                await fetch(CONFIG.API_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'text/plain' }, 
                    body: JSON.stringify({ action: 'deleteUser', data: { email } }) 
                });
                
                if (typeof DataManager !== 'undefined') {
                    DataManager.clearCache(USER_CACHE_KEY);
                    DataManager.clearImageCache(USER_IMG_PREFIX, email);
                } else {
                    localStorage.removeItem(USER_CACHE_KEY);
                    const key = USER_IMG_PREFIX + '_' + email.replace(/[^a-zA-Z0-9]/g, '');
                    localStorage.removeItem(key);
                }
                
                allUsers = allUsers.filter(u => u.email !== email);
                renderUserList(allUsers);
                if (typeof Utils !== 'undefined') Utils.showToast('✅ Pengguna berjaya dipadam', 'success');
                else alert('Pengguna berjaya dipadam');
            } catch (error) { 
                console.error('[DeleteUser] Error:', error);
                if (typeof Utils !== 'undefined') Utils.showToast('❌ Gagal memadam pengguna', 'error');
                else alert('Gagal memadam pengguna');
            }
        }
    </script>
</body>
</html>
