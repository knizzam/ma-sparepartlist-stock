<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registration Users - MA Inventory</title>
    
    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css"> <!-- Pautan ke fail CSS global -->
    <link rel="stylesheet" href="register.css">
    
    <script src="config.js"></script>
</head>
<body>

    <div class="page-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="page-title">Registration Users</h1>
    </div>

    <div class="main-container">
        <!-- FORM -->
        <div class="form-card">
            <div class="form-section-title">Account Details</div>
            
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" id="userName" placeholder="e.g., Mohd Khairul Nizzam">
            </div>
            
            <div class="form-group">
                <label class="form-label">ID Number (No. K/T)</label>
                <input type="text" class="form-input" id="userNoKad" placeholder="e.g., K572">
            </div>
            
            <div class="form-group">
                <label class="form-label">Role</label>
                <input type="text" class="form-input" id="userRole" placeholder="e.g., Admin, Staff">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="userEmail" placeholder="e.g., user@company.com">
            </div>
        </div>

        <div class="form-card">
            <div class="form-section-title">Profile & Status</div>
            <div class="form-group">
                <label class="form-label">Profile Picture</label>
                <label class="photo-upload-card" for="photoInput">
                    <div id="photoUploadContent">
                        <i class="fas fa-camera" style="font-size: 24px; color: #666; margin-bottom: 8px;"></i>
                        <div style="color: #666; font-size: 13px;">Tap to upload photo</div>
                    </div>
                    <img id="photoPreview" class="photo-preview-large" style="display:none;">
                </label>
                <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(this)">
            </div>
            <div class="form-group">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="userActive" checked>
                    <span style="font-size: 14px; font-weight: 500; color: #333;">Activate this account</span>
                </label>
            </div>
        </div>

        <div class="btn-group">
            <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
            <button class="submit-btn" id="saveBtn" onclick="saveUser()">Add User</button>
        </div>

        <div style="height: 4px; background: linear-gradient(to right, #1a73e8, #4a90e2); margin: 30px 0 20px; border-radius: 2px;"></div>

        <!-- LIST -->
        <div class="list-header">
            <div class="list-title">Registered Users <span class="list-badge" id="userCount">0</span></div>
        </div>
        <div class="user-list" id="userList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let tempPhotoBase64 = '';
        let editingEmail = null;
        let allUsers = [];
        
        const USER_LIST_CACHE_KEY = 'ma_inventory_user_list';
        const USER_IMAGE_CACHE_PREFIX = 'ma_user_img_';
        const CACHE_EXPIRY = 5 * 60 * 1000;

        function showToast(message, type = 'info') {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempPhotoBase64 = e.target.result;
                    document.getElementById('photoPreview').src = tempPhotoBase64;
                    document.getElementById('photoPreview').style.display = 'block';
                    document.getElementById('photoUploadContent').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCachedImage(email) {
            try {
                const cached = localStorage.getItem(USER_IMAGE_CACHE_PREFIX + email);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                        return parsed.data;
                    }
                }
            } catch(e) {}
            return null;
        }

        function setCachedImage(email, base64) {
            try {
                localStorage.setItem(USER_IMAGE_CACHE_PREFIX + email, JSON.stringify({
                    data: base64,
                    timestamp: new Date().getTime()
                }));
            } catch(e) { console.warn('Image cache failed:', e); }
        }

        async function loadUserList() {
            const cachedData = localStorage.getItem(USER_LIST_CACHE_KEY);
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                        allUsers = parsed.data;
                        renderUserList(allUsers);
                    }
                } catch(e) { console.error("Cache parse error", e); }
            }

            try {
                const res = await fetch(CONFIG.API_URL + '?action=getAllUsers');
                const result = await res.json();
                
                if (result.success && result.users) {
                    allUsers = result.users;
                    localStorage.setItem(USER_LIST_CACHE_KEY, JSON.stringify({
                        data: allUsers,
                        timestamp: new Date().getTime()
                    }));
                    renderUserList(allUsers);
                }
            } catch (error) {
                console.error('Error:', error);
                if (!allUsers.length) {
                    document.getElementById('userList').innerHTML = '<div style="text-align:center; padding: 20px; color: #888;">Gagal memuatkan data</div>';
                }
            }
        }

        function renderUserList(users) {
            const userList = document.getElementById('userList');
            document.getElementById('userCount').textContent = users.length;
            
            if (users.length === 0) {
                userList.innerHTML = '<div style="text-align:center; padding: 20px; color: #888;">Tiada pengguna dijumpai</div>';
                return;
            }

            let html = '';
            users.forEach(user => {
                const isActive = user.active;
                const cardClass = isActive ? '' : 'inactive';
                const isEditing = editingEmail === user.email ? 'editing' : '';
                const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
                const safeEmail = user.email.replace(/[^a-zA-Z0-9]/g, '');
                
                const cachedImage = getCachedImage(user.email);
                let avatarHTML = initial;
                
                if (cachedImage && user.pictureFileId) {
                    avatarHTML = `<img src="${cachedImage}" alt="${user.name}" style="width:100%; height:100%; object-fit:cover;">`;
                }

                html += `
                    <div class="user-card ${cardClass} ${isEditing}" onclick="editUser('${user.email}', '${user.role}', '${user.name}', '${user.noKad}', ${user.active}, '${user.pictureFileId}')">
                        <div class="user-avatar" id="avatar-box-${safeEmail}">${avatarHTML}</div>
                        <div class="user-info">
                            <div class="user-name">${user.name}</div>
                            <span class="user-role-badge">${user.role || 'User'}</span>
                        </div>
                        <div class="user-status ${isActive ? '' : 'inactive'}"></div>
                        <button class="delete-btn-small" onclick="event.stopPropagation(); deleteUser('${user.email}')" title="Delete"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
            userList.innerHTML = html;

            users.forEach(user => {
                if (user.pictureFileId) {
                    const cachedImage = getCachedImage(user.email);
                    if (!cachedImage) {
                        const safeEmail = user.email.replace(/[^a-zA-Z0-9]/g, '');
                        const avatarBox = document.getElementById(`avatar-box-${safeEmail}`);
                        
                        if (avatarBox) {
                            APIHelper.fetchImage(user.pictureFileId).then(imgResult => {
                                if (imgResult.success && imgResult.base64) {
                                    setCachedImage(user.email, imgResult.base64);
                                    avatarBox.innerHTML = `<img src="${imgResult.base64}" alt="${user.name}" style="width:100%; height:100%; object-fit:cover;">`;
                                }
                            });
                        }
                    }
                }
            });
        }

        function editUser(email, role, name, noKad, active, pictureFileId) {
            editingEmail = email;
            
            document.getElementById('userName').value = name;
            document.getElementById('userNoKad').value = noKad;
            document.getElementById('userRole').value = role;
            document.getElementById('userEmail').value = email;
            document.getElementById('userActive').checked = active;
            
            document.getElementById('saveBtn').innerText = 'Update User';
            document.getElementById('cancelBtn').classList.add('show');
            
            const preview = document.getElementById('photoPreview');
            const cachedImage = getCachedImage(email);
            
            if (cachedImage) {
                preview.src = cachedImage;
                preview.style.display = 'block';
                document.getElementById('photoUploadContent').style.display = 'none';
                tempPhotoBase64 = '';
            } else if (pictureFileId && pictureFileId.trim() !== '') {
                APIHelper.fetchImage(pictureFileId).then(imgResult => {
                    if (imgResult.success && imgResult.base64) {
                        preview.src = imgResult.base64;
                        preview.style.display = 'block';
                        document.getElementById('photoUploadContent').style.display = 'none';
                        tempPhotoBase64 = '';
                    }
                });
            } else {
                preview.style.display = 'none';
                document.getElementById('photoUploadContent').style.display = 'block';
                tempPhotoBase64 = '';
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderUserList(allUsers);
        }

        function cancelEdit() {
            resetForm();
            renderUserList(allUsers);
            showToast('Edit dibatalkan', 'info');
        }

        async function saveUser() {
            const name = document.getElementById('userName').value.trim();
            const noKad = document.getElementById('userNoKad').value.trim();
            const role = document.getElementById('userRole').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const active = document.getElementById('userActive').checked;

            if (!email || !name) { 
                showToast('⚠️ Email dan Nama Penuh wajib diisi!', 'warning'); 
                return; 
            }

            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;

            const action = editingEmail ? 'updateUser' : 'addUser';
            const payload = { 
                action: action, 
                data: { email, role, name, noKad, active, originalEmail: editingEmail } 
            };

            try {
                await fetch(CONFIG.API_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                if (tempPhotoBase64) {
                    const imgPayload = {
                        action: 'uploadUserPicture',
                        data: { base64: tempPhotoBase64, email: email }
                    };
                    await fetch(CONFIG.API_URL, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(imgPayload)
                    });
                    setCachedImage(email, tempPhotoBase64);
                }

                showToast('✅ Pengguna berjaya disimpan!', 'success');
                resetForm();
                loadUserList();
            } catch (error) {
                showToast('❌ Ralat semasa menyimpan', 'error');
                btn.innerText = editingEmail ? 'Update User' : 'Add User';
                btn.disabled = false;
            }
        }

        async function deleteUser(email) {
            if (!confirm('⚠️ Adakah anda pasti ingin memadam pengguna ini?')) return;
            
            try {
                await fetch(CONFIG.API_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'deleteUser', data: { email: email } })
                });
                localStorage.removeItem(USER_IMAGE_CACHE_PREFIX + email);
                showToast('✅ Pengguna berjaya dipadam', 'success');
                loadUserList();
            } catch (error) {
                showToast('❌ Gagal memadam pengguna', 'error');
            }
        }

        function resetForm() {
            document.getElementById('userName').value = '';
            document.getElementById('userNoKad').value = '';
            document.getElementById('userRole').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userActive').checked = true;
            document.getElementById('photoInput').value = '';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('photoUploadContent').style.display = 'block';
            tempPhotoBase64 = '';
            editingEmail = null;
            document.getElementById('saveBtn').innerText = 'Add User';
            document.getElementById('cancelBtn').classList.remove('show');
        }

        window.onload = loadUserList;
    </script>
</body>
</html>
