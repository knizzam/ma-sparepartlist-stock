<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Users - MA Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="register.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="photo-picker.js"></script>
</head>
<body>

    <div class="register-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="register-title"><i class="fas fa-users-cog"></i>User Management</h1>
    </div>

    <div class="main-container">
        
        <!-- ========================================== -->
        <!-- VIEW 1: FORM (Add / Update) - Default Hidden -->
        <!-- ========================================== -->
        <div id="formView">
            <div class="form-card">
                <div class="form-section-title">Account Details</div>
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" id="userName" placeholder="e.g., Mohd Khairul Nizzam"></div>
                <div class="form-group"><label class="form-label">ID Number (No. K/T)</label><input type="text" class="form-input" id="userNoKad" placeholder="e.g., K572"></div>
                <div class="form-group"><label class="form-label">Role</label><input type="text" class="form-input" id="userRole" placeholder="e.g., Admin, Staff"></div>
                <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" id="userEmail" placeholder="e.g., user@company.com"></div>
            </div>

            <div class="form-card">
                <div class="form-section-title">Profile & Status</div>
                
                <div class="form-group">
                    <label class="form-label">Profile Picture</label>
                    <div class="photo-upload-wrapper" id="photoWrapper">
                        <div class="photo-placeholder" id="photoPlaceholder" onclick="showPhotoMenu(event)">
                            <i class="fas fa-camera"></i>
                            <span>Tap to upload<br>or take photo</span>
                        </div>
                        <img id="photoPreview" class="photo-preview-large" alt="Preview" onclick="showPhotoMenu(event)">
                        <input type="file" id="photoInput" accept="image/*">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="userActive" checked>
                        <span style="font-size: 14px; font-weight: 500; color: #333;">Activate this account</span>
                    </label>
                </div>
            </div>

            <div class="btn-group">
                <button class="cancel-btn" onclick="showListView()">Cancel</button>
                <button class="submit-btn" id="saveBtn" onclick="saveUser()">Add User</button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VIEW 2: USER LIST - Default Visible -->
        <!-- ========================================== -->
        <div id="listView">
            
            <!-- Search Box & Add Button -->
            <div class="list-header-actions">
                <div class="user-search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" class="user-search-input" id="userSearchInput" placeholder="Search by name, ID, or email..." onkeyup="filterUsers()">
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="list-title">Registered Users <span class="list-badge" id="userCount">0</span></div>
                    <button class="add-user-btn" onclick="showAddForm()">
                        <i class="fas fa-plus"></i> Add User
                    </button>
                </div>
            </div>
            
            <div class="user-list" id="userList">
                <div style="text-align:center; padding: 20px; color: #888; grid-column: 1 / -1;">
                    <i class="fas fa-spinner fa-spin"></i> Loading...
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let tempPhotoBase64 = '', editingEmail = null, allUsers = [];
        const USER_LIST_CACHE_KEY = 'ma_inventory_user_list', USER_IMAGE_CACHE_PREFIX = 'ma_user_img_', CACHE_EXPIRY = 5 * 60 * 1000;

        document.addEventListener('DOMContentLoaded', function() {
            PhotoPicker.init({
                wrapperId: 'photoWrapper',
                inputId: 'photoInput',
                previewId: 'photoPreview',
                placeholderId: 'photoPlaceholder'
            });
            
            document.getElementById('photoInput').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) { tempPhotoBase64 = ev.target.result; };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            // Default: Tunjuk List View
            showListView();
            loadUserList();
        });

        // --- VIEW TOGGLE FUNCTIONS ---
        function showListView() {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            resetForm();
            loadUserList();
        }

        function showAddForm() {
            editingEmail = null;
            resetForm();
            document.getElementById('saveBtn').innerText = 'Add User';
            document.getElementById('formView').style.display = 'block';
            document.getElementById('listView').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showEditForm() {
            document.getElementById('saveBtn').innerText = 'Update User';
            document.getElementById('formView').style.display = 'block';
            document.getElementById('listView').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- SEARCH FUNCTION ---
        function filterUsers() {
            const searchTerm = document.getElementById('userSearchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                renderUserList(allUsers);
                return;
            }

            const filtered = allUsers.filter(user => 
                user.name.toLowerCase().includes(searchTerm) || 
                user.noKad.toLowerCase().includes(searchTerm) || 
                user.email.toLowerCase().includes(searchTerm)
            );
            
            renderUserList(filtered);
        }

        // --- DATA FUNCTIONS ---
        function getCachedImage(email) {
            try {
                const cached = localStorage.getItem(USER_IMAGE_CACHE_PREFIX + email);
                if (cached) { const p = JSON.parse(cached); if (new Date().getTime() - p.timestamp < CACHE_EXPIRY) return p.data; }
            } catch(e) {} return null;
        }

        function setCachedImage(email, base64) {
            try { localStorage.setItem(USER_IMAGE_CACHE_PREFIX + email, JSON.stringify({ data: base64, timestamp: new Date().getTime() })); } catch(e) {}
        }

        async function loadUserList() {
            const cachedData = localStorage.getItem(USER_LIST_CACHE_KEY);
            if (cachedData) {
                try { const p = JSON.parse(cachedData); if (new Date().getTime() - p.timestamp < CACHE_EXPIRY) { allUsers = p.data; renderUserList(allUsers); return; } } catch(e) {}
            }
            try {
                const res = await fetch(CONFIG.API_URL + '?action=getAllUsers');
                const result = await res.json();
                if (result.success && result.users) {
                    allUsers = result.users;
                    localStorage.setItem(USER_LIST_CACHE_KEY, JSON.stringify({ data: allUsers, timestamp: new Date().getTime() }));
                    renderUserList(allUsers);
                }
            } catch (error) {
                if (!allUsers.length) document.getElementById('userList').innerHTML = '<div style="text-align:center; padding: 20px; color: #888; grid-column: 1 / -1;">Gagal memuatkan data</div>';
            }
        }

        function renderUserList(users) {
            const userList = document.getElementById('userList');
            document.getElementById('userCount').textContent = users.length;
            
            if (users.length === 0) { 
                userList.innerHTML = '<div style="text-align:center; padding: 20px; color: #888; grid-column: 1 / -1;">Tiada pengguna</div>'; 
                return; 
            }
            
            let html = '';
            users.forEach(user => {
                const isActive = user.active;
                const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
                const safeEmail = user.email.replace(/[^a-zA-Z0-9]/g, '');
                const cachedImage = getCachedImage(user.email);
                let avatarHTML = initial;
                if (cachedImage && user.pictureFileId) avatarHTML = `<img src="${cachedImage}" alt="${user.name}" style="width:100%; height:100%; object-fit:cover;">`;

                html += `
                    <div class="user-card ${isActive ? '' : 'inactive'} ${editingEmail === user.email ? 'editing' : ''}" onclick="editUser('${user.email}', '${user.role}', '${user.name}', '${user.noKad}', ${user.active}, '${user.pictureFileId}')">
                        <div class="user-avatar" id="avatar-box-${safeEmail}">${avatarHTML}</div>
                        <div class="user-info">
                            <div class="user-name">${user.name}</div>
                            <span class="user-role-badge">${user.role || 'User'}</span>
                        </div>
                        <div class="user-status ${isActive ? '' : 'inactive'}"></div>
                        <button class="delete-btn-small" onclick="event.stopPropagation(); deleteUser('${user.email}')"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
            userList.innerHTML = html;

            users.forEach(user => {
                if (user.pictureFileId && !getCachedImage(user.email)) {
                    const safeEmail = user.email.replace(/[^a-zA-Z0-9]/g, '');
                    const avatarBox = document.getElementById(`avatar-box-${safeEmail}`);
                    if (avatarBox) {
                        APIHelper.fetchImage(user.pictureFileId).then(imgResult => {
                            if (imgResult.success && imgResult.base64) {
                                setCachedImage(user.email, imgResult.base64);
                                avatarBox.innerHTML = `<img src="${imgResult.base64}" alt="${user.name}" style="width:100%; height:100%; object-fit:cover;">`;
                            }
                        });
                    }
                }
            });
        }

        function editUser(email, role, name, noKad, active, pictureFileId) {
            editingEmail = email;
            document.getElementById('userName').value = name;
            document.getElementById('userNoKad').value = noKad;
            document.getElementById('userRole').value = role;
            document.getElementById('userEmail').value = email;
            document.getElementById('userActive').checked = active;
            
            const preview = document.getElementById('photoPreview');
            const placeholder = document.getElementById('photoPlaceholder');
            const cachedImage = getCachedImage(email);
            
            if (cachedImage) { preview.src = cachedImage; preview.style.display = 'block'; placeholder.style.display = 'none'; tempPhotoBase64 = ''; } 
            else if (pictureFileId && pictureFileId.trim() !== '') {
                APIHelper.fetchImage(pictureFileId).then(imgResult => {
                    if (imgResult.success && imgResult.base64) {
                        preview.src = imgResult.base64; preview.style.display = 'block'; placeholder.style.display = 'none'; tempPhotoBase64 = '';
                    }
                });
            } else { preview.style.display = 'none'; placeholder.style.display = 'flex'; tempPhotoBase64 = ''; }
            
            showEditForm();
        }

        function resetForm() {
            document.getElementById('userName').value = '';
            document.getElementById('userNoKad').value = '';
            document.getElementById('userRole').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userActive').checked = true;
            PhotoPicker.reset();
            tempPhotoBase64 = ''; 
            editingEmail = null;
        }

        async function saveUser() {
            const name = document.getElementById('userName').value.trim();
            const noKad = document.getElementById('userNoKad').value.trim();
            const role = document.getElementById('userRole').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const active = document.getElementById('userActive').checked;

            if (!email || !name) { Utils.showToast('⚠️ Email dan Nama Penuh wajib diisi!', 'warning'); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Saving...'; btn.disabled = true;

            const action = editingEmail ? 'updateUser' : 'addUser';
            const payload = { action, data: { email, role, name, noKad, active, originalEmail: editingEmail } };

            try {
                await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
                if (tempPhotoBase64) {
                    await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'uploadUserPicture', data: { base64: tempPhotoBase64, email } }) });
                    setCachedImage(email, tempPhotoBase64);
                }
                Utils.showToast('✅ Pengguna berjaya disimpan!', 'success');
                showListView();
            } catch (error) {
                Utils.showToast('❌ Ralat semasa menyimpan', 'error');
                btn.innerText = editingEmail ? 'Update User' : 'Add User'; btn.disabled = false;
            }
        }

        async function deleteUser(email) {
            if (!confirm('⚠️ Adakah anda pasti ingin memadam pengguna ini?')) return;
            try {
                await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'deleteUser', data: { email } }) });
                localStorage.removeItem(USER_IMAGE_CACHE_PREFIX + email);
                Utils.showToast('✅ Pengguna berjaya dipadam', 'success');
                loadUserList();
            } catch (error) { Utils.showToast('❌ Gagal memadam pengguna', 'error'); }
        }
    </script>
</body>
</html>
