<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product List - MA Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="product-list.css">
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="photo-picker.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

    <div class="product-list-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="product-list-title"><i class="fas fa-boxes-stacked"></i>Product List</h1>
    </div>

    <div class="main-container">
        <div class="search-filter-section">
            <div class="search-input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search Part Name, Part No, or Location..." onkeyup="filterProducts()">
            </div>
            <div class="filter-sort-container">
                <div class="category-filter-container">
                    <div class="category-chip active" onclick="setCategoryFilter('all', this)">All</div>
                    <div class="category-chip" onclick="setCategoryFilter('Maintenance', this)">Maintenance</div>
                    <div class="category-chip" onclick="setCategoryFilter('Consumable', this)">Consumable</div>
                    <div class="category-chip" onclick="setCategoryFilter('Tools', this)">Tools</div>
                    <div class="category-chip" onclick="setCategoryFilter('Safety', this)">Safety</div>
                    <div class="category-chip" onclick="setCategoryFilter('Kaizen', this)">Kaizen</div>
                </div>
                <div style="position: relative;">
                    <button class="sort-btn" id="sortBtn" onclick="toggleSortMenu()"><i class="fas fa-sort-amount-down"></i></button>
                    <div class="sort-dropdown" id="sortDropdown">
                        <div class="sort-option active" onclick="setSortOrder('default', this)"><i class="fas fa-check"></i> Default Order</div>
                        <div class="sort-option" onclick="setSortOrder('low', this)"><i class="fas fa-arrow-up"></i> Low Stock First</div>
                        <div class="sort-option" onclick="setSortOrder('high', this)"><i class="fas fa-arrow-down"></i> High Stock First</div>
                        <div class="sort-option" onclick="setSortOrder('name', this)"><i class="fas fa-font"></i> Sort by Name</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="product-list-container" id="productListContainer"></div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit Product</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="form-card">
                <div class="form-section-title">Product Information</div>
                <div class="form-group">
                    <label class="form-label">Product Photo</label>
                    <div class="photo-upload-wrapper" id="editPhotoWrapper">
                        <div class="photo-placeholder" id="editPhotoPlaceholder" onclick="showPhotoMenu(event)">
                            <i class="fas fa-camera"></i><span>Tap to upload<br>or take photo</span>
                        </div>
                        <img id="editPhotoPreview" class="photo-preview-large" alt="Preview" onclick="showPhotoMenu(event)">
                        <input type="file" id="editPhotoInput" accept="image/*">
                    </div>
                </div>
                <div class="form-group"><label class="form-label">Part Name</label><input type="text" class="form-input" id="editPartName"></div>
                <div class="form-group"><label class="form-label">Part No.</label><input type="text" class="form-input" id="editPartNo"></div>
                <div class="form-group"><label class="form-label">No. Spec</label><input type="text" class="form-input" id="editNoSpec"></div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" class="form-input" id="editLocation"></div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-input" id="editCategory">
                        <option value="Maintenance">Maintenance</option>
                        <option value="Consumable">Consumable</option>
                        <option value="Tools">Tools</option>
                        <option value="Safety">Safety</option>
                        <option value="Kaizen">Kaizen</option>
                        <option value="Uncategorized">Uncategorized</option>
                    </select>
                </div>
            </div>
            <div class="form-card">
                <div class="form-section-title">Stock Information</div>
                <div class="form-group"><label class="form-label">Current Stock</label><input type="number" class="form-input" id="editCurrentStock" min="0"></div>
                <div class="form-group"><label class="form-label">Minimum Stock</label><input type="number" class="form-input" id="editMinimumStock" min="0"></div>
            </div>
            <div class="modal-btn-group">
                <button class="modal-btn cancel" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn save" id="saveBtn" onclick="saveEditProduct()">Update</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProducts = [];
        let currentCategory = 'all';
        let currentSearch = '';
        let currentSort = 'default';
        let editingPartNo = null;
        let tempEditPhotoBase64 = '';
        const PRODUCT_LIST_CACHE_KEY = 'ma_inventory_product_list';
        const CACHE_EXPIRY = 5 * 60 * 1000;

        document.addEventListener('DOMContentLoaded', function() {
            PhotoPicker.init({
                wrapperId: 'editPhotoWrapper',
                inputId: 'editPhotoInput',
                previewId: 'editPhotoPreview',
                placeholderId: 'editPhotoPlaceholder'
            });

            document.getElementById('editPhotoInput').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) { 
                        tempEditPhotoBase64 = ev.target.result;
                        Utils.showToast('Photo selected', 'info');
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('#sortBtn') && !e.target.closest('#sortDropdown')) {
                    document.getElementById('sortDropdown').classList.remove('show');
                }
            });

            loadProductList();
        });

        function resetButtonState() {
            const btn = document.getElementById('saveBtn');
            if (btn) {
                btn.disabled = false;
                btn.innerText = 'Update';
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        }

        function getCachedProductImage(partNo) {
            try {
                const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                const item = localStorage.getItem(key);
                if (!item) return null;
                const parsed = JSON.parse(item);
                if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) return parsed.base64;
                return null;
            } catch(e) { return null; }
        }

        function setCachedProductImage(partNo, base64) {
            const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
            localStorage.setItem(key, JSON.stringify({ base64: base64, timestamp: new Date().getTime() }));
        }

        async function loadProductList(forceRefresh) {
            var container = document.getElementById('productListContainer');
            
            if (!forceRefresh) {
                var cachedData = localStorage.getItem(PRODUCT_LIST_CACHE_KEY);
                if (cachedData) {
                    try {
                        var parsed = JSON.parse(cachedData);
                        if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                            allProducts = parsed.data;
                            renderProducts();
                            return;
                        }
                    } catch(e) {}
                }
            }
            
            container.innerHTML = '<div style="grid-column: 1 / -1; width: 100%; min-height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;"><div><i class="fas fa-spinner fa-spin" style="font-size: 48px; color: #1a73e8; margin-bottom: 15px; display: block;"></i><div style="font-size: 14px; color: #666; font-weight: 500;">Loading products...</div></div></div>';
            
            try {
                var res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
                var result = await res.json();
                
                if (result.success && result.products) {
                    allProducts = result.products;
                    localStorage.setItem(PRODUCT_LIST_CACHE_KEY, JSON.stringify({ data: allProducts, timestamp: new Date().getTime() }));
                    renderProducts();
                } else {
                    container.innerHTML = '<div style="grid-column: 1 / -1; width: 100%; min-height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;"><div><i class="fas fa-box-open" style="font-size: 48px; color: #e0e0e0; margin-bottom: 15px; display: block;"></i><div style="font-size: 14px; color: #999;">No products found</div></div></div>';
                }
            } catch (error) {
                console.error('Load error:', error);
                container.innerHTML = '<div style="grid-column: 1 / -1; width: 100%; min-height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;"><div><i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #dc3545; margin-bottom: 15px; display: block;"></i><div style="font-size: 14px; color: #999;">Failed to load data</div></div></div>';
            }
        }

        function getStockStatus(current, min) {
            var thresholdOK = min + (min * 0.5);
            if (current > thresholdOK) return 'high';
            if (current > min) return 'mid';
            return 'low';
        }

        function renderProducts() {
            var container = document.getElementById('productListContainer');
            var filtered = allProducts.filter(function(p) {
                var matchCategory = currentCategory === 'all' || p.category === currentCategory;
                var searchLower = currentSearch.toLowerCase();
                var matchSearch = p.partName.toLowerCase().includes(searchLower) || 
                                  p.partNo.toLowerCase().includes(searchLower) || 
                                  (p.location && p.location.toLowerCase().includes(searchLower));
                return matchCategory && matchSearch;
            });

            if (currentSort === 'low') {
                filtered.sort(function(a, b) {
                    var order = { 'low': 0, 'mid': 1, 'high': 2 };
                    return order[getStockStatus(parseInt(a.currentStock), parseInt(a.minimumStock))] - order[getStockStatus(parseInt(b.currentStock), parseInt(b.minimumStock))];
                });
            } else if (currentSort === 'high') {
                filtered.sort(function(a, b) {
                    var order = { 'low': 0, 'mid': 1, 'high': 2 };
                    return order[getStockStatus(parseInt(b.currentStock), parseInt(b.minimumStock))] - order[getStockStatus(parseInt(a.currentStock), parseInt(a.minimumStock))];
                });
            } else if (currentSort === 'name') {
                filtered.sort(function(a, b) { return a.partName.localeCompare(b.partName); });
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div style="grid-column: 1 / -1; width: 100%; min-height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;"><div><i class="fas fa-search" style="font-size: 48px; color: #e0e0e0; margin-bottom: 15px; display: block;"></i><div style="font-size: 14px; color: #999;">No results found</div></div></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                var product = filtered[i];
                var statusClass = getStockStatus(parseInt(product.currentStock), parseInt(product.minimumStock));
                var safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                var cachedImg = getCachedProductImage(product.partNo);
                
                var imgContent = '<i class="fas fa-box"></i>';
                if (cachedImg) {
                    imgContent = '<img src="' + cachedImg + '" alt="' + product.partName + '">';
                } else if (product.pictureFileId) {
                    imgContent = '<div id="img-placeholder-' + safePartNo + '" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#1a73e8;"><i class="fas fa-spinner fa-spin"></i></div>';
                }

                html += '<div class="product-card status-' + statusClass + '" onclick="openEditModal(\'' + product.partNo + '\')">';
                html += '<div class="product-card-img" id="card-img-' + safePartNo + '">' + imgContent + '</div>';
                html += '<div class="product-card-body">';
                html += '<div class="product-card-name">' + product.partName + '</div>';
                html += '<span class="product-card-partno">' + product.partNo + '</span>';
                html += '<div class="product-card-location"><i class="fas fa-map-marker-alt"></i> ' + (product.location || '-') + '</div>';
                html += '</div>';
                html += '<div class="product-card-footer">';
                html += '<div class="product-card-stock">';
                html += '<div class="status-dot ' + statusClass + '"></div>';
                html += '<div class="stock-info">';
                html += '<div class="stock-label">Stock</div>';
                html += '<div class="stock-number">' + product.currentStock + '</div>';
                html += '</div></div>';
                html += '<button class="delete-btn-round" onclick="event.stopPropagation(); deleteProduct(\'' + product.partNo + '\')"><i class="fas fa-trash"></i></button>';
                html += '</div></div>';
            }
            container.innerHTML = html;

            for (var j = 0; j < filtered.length; j++) {
                var prod = filtered[j];
                if (prod.pictureFileId && !getCachedProductImage(prod.partNo)) {
                    var sPartNo = prod.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    var placeholderEl = document.getElementById('img-placeholder-' + sPartNo);
                    if (placeholderEl) {
                        APIHelper.fetchImage(prod.pictureFileId).then(function(imgResult) {
                            if (imgResult.success && imgResult.base64) {
                                setCachedProductImage(prod.partNo, imgResult.base64);
                                var imgContainer = document.getElementById('card-img-' + sPartNo);
                                if (imgContainer) imgContainer.innerHTML = '<img src="' + imgResult.base64 + '" alt="' + prod.partName + '">';
                            }
                        }).catch(function(err) {
                            console.error('Image load error:', err);
                        });
                    }
                }
            }
        }

        function filterProducts() { 
            currentSearch = document.getElementById('searchInput').value; 
            renderProducts(); 
        }
        
        function setCategoryFilter(category, element) {
            currentCategory = category;
            var chips = document.querySelectorAll('.category-chip');
            for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
            element.classList.add('active');
            renderProducts();
        }

        function toggleSortMenu() {
            document.getElementById('sortDropdown').classList.toggle('show');
        }

        function setSortOrder(order, element) {
            currentSort = order;
            var opts = document.querySelectorAll('.sort-option');
            for (var i = 0; i < opts.length; i++) opts[i].classList.remove('active');
            element.classList.add('active');
            document.getElementById('sortBtn').classList.toggle('active', order !== 'default');
            document.getElementById('sortDropdown').classList.remove('show');
            renderProducts();
        }

        function openEditModal(partNo) {
            var product = allProducts.find(function(p) { return p.partNo === partNo; });
            if (!product) return;

            editingPartNo = partNo;
            tempEditPhotoBase64 = '';

            document.getElementById('editPartName').value = product.partName;
            document.getElementById('editPartNo').value = product.partNo; 
            document.getElementById('editNoSpec').value = product.noSpec || '';
            document.getElementById('editLocation').value = product.location || '';
            document.getElementById('editCategory').value = product.category || 'Uncategorized';
            document.getElementById('editCurrentStock').value = product.currentStock;
            document.getElementById('editMinimumStock').value = product.minimumStock;

            var preview = document.getElementById('editPhotoPreview');
            var placeholder = document.getElementById('editPhotoPlaceholder');
            var cachedImg = getCachedProductImage(partNo);
            
            if (cachedImg) {
                preview.src = cachedImg; 
                preview.style.display = 'block'; 
                placeholder.style.display = 'none';
            } else if (product.pictureFileId) {
                placeholder.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading...</span>';
                APIHelper.fetchImage(product.pictureFileId).then(function(imgResult) {
                    if (imgResult.success && imgResult.base64) {
                        setCachedProductImage(partNo, imgResult.base64);
                        preview.src = imgResult.base64; 
                        preview.style.display = 'block'; 
                        placeholder.style.display = 'none';
                    } else { 
                        resetPhotoPlaceholder(); 
                    }
                }).catch(function() { resetPhotoPlaceholder(); });
            } else { 
                resetPhotoPlaceholder(); 
            }

            resetButtonState();
            document.getElementById('editModal').classList.add('show');
        }

        function resetPhotoPlaceholder() {
            document.getElementById('editPhotoPreview').style.display = 'none';
            var placeholder = document.getElementById('editPhotoPlaceholder');
            placeholder.style.display = 'flex';
            placeholder.innerHTML = '<i class="fas fa-camera"></i><span>Tap to upload<br>or take photo</span>';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingPartNo = null;
            tempEditPhotoBase64 = '';
            resetButtonState();
        }

        async function saveEditProduct() {
            if (!editingPartNo) {
                Utils.showToast('No product selected!', 'warning');
                return;
            }
            
            var partName = document.getElementById('editPartName').value.trim();
            var newPartNo = document.getElementById('editPartNo').value.trim();
            
            if (!partName || !newPartNo) { 
                Utils.showToast('Part Name and Part No. are required!', 'warning'); 
                return; 
            }

            var btn = document.getElementById('saveBtn');
            btn.innerText = 'Updating...';  
            btn.disabled = true;

            var currentStock = parseInt(document.getElementById('editCurrentStock').value) || 0;
            var minimumStock = parseInt(document.getElementById('editMinimumStock').value) || 0;

            var payload = { 
                action: 'updateProduct', 
                data: { 
                    partName: partName,
                    partNo: newPartNo,
                    noSpec: document.getElementById('editNoSpec').value.trim(), 
                    location: document.getElementById('editLocation').value.trim(), 
                    category: document.getElementById('editCategory').value.trim(), 
                    currentStock: currentStock,
                    minimumStock: minimumStock,
                    originalPartNo: editingPartNo
                } 
            };

            try {
                var controller = new AbortController();
                var timeoutId = setTimeout(function() { controller.abort(); }, 10000);

                var response = await fetch(CONFIG.API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain' }, 
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error('HTTP error! status: ' + response.status);
                }

                var result = await response.json();
                console.log('API Response:', result);

                if (tempEditPhotoBase64) {
                    try {
                        var photoPayload = { 
                            action: 'uploadProductPicture', 
                            data: { base64: tempEditPhotoBase64, partNo: newPartNo } 
                        };
                        
                        await fetch(CONFIG.API_URL, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'text/plain' }, 
                            body: JSON.stringify(photoPayload) 
                        });
                    } catch (photoError) {
                        console.error('Photo upload error:', photoError);
                    }
                }

                resetButtonState();
                Utils.showToast('Product updated!', 'success');
                closeEditModal();
                loadProductList(true);
                
            } catch (error) {
                console.error('Save error:', error);
                if (error.name === 'AbortError') {
                    Utils.showToast('Request timeout. Please try again.', 'error');
                } else {
                    Utils.showToast('Failed to update: ' + error.message, 'error');
                }
                resetButtonState();
            }
        }

        async function deleteProduct(partNo) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                await fetch(CONFIG.API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain' }, 
                    body: JSON.stringify({ action: 'deleteProduct', data: { partNo: partNo } }) 
                });
                Utils.showToast('Product deleted', 'success');
                loadProductList(true);
            } catch (error) { 
                Utils.showToast('Failed to delete', 'error'); 
            }
        }

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });
    </script>
</body>
</html>
