<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product List - MA Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="product-list.css">
    <script src="data-manager.js"></script> 
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="photo-picker.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="product-list-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="product-list-title"><i class="fas fa-boxes-stacked"></i>Product List</h1>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Search & Filter -->
        <div class="search-filter-section">
            <div class="search-input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search Part Name, Part No, or Location..." onkeyup="filterProducts()">
            </div>
            
            <div class="filter-sort-container">
                <div class="category-filter-container">
                    <div class="category-chip active" onclick="setCategoryFilter('all', this)">All</div>
                    <div class="category-chip" onclick="setCategoryFilter('Maintenance', this)">Maintenance</div>
                    <div class="category-chip" onclick="setCategoryFilter('Consumable', this)">Consumable</div>
                    <div class="category-chip" onclick="setCategoryFilter('Tools', this)">Tools</div>
                    <div class="category-chip" onclick="setCategoryFilter('Safety', this)">Safety</div>
                    <div class="category-chip" onclick="setCategoryFilter('Kaizen', this)">Kaizen</div>
                </div>
                
                <!-- Sort Button -->
                <div style="position: relative;">
                    <button class="sort-btn" id="sortBtn" onclick="toggleSortMenu()">
                        <i class="fas fa-sort-amount-down"></i>
                    </button>
                    <div class="sort-dropdown" id="sortDropdown">
                        <div class="sort-option active" onclick="setSortOrder('default', this)">
                            <i class="fas fa-check"></i> Default Order
                        </div>
                        <div class="sort-option" onclick="setSortOrder('low', this)">
                            <i class="fas fa-arrow-up"></i> Low Stock First
                        </div>
                        <div class="sort-option" onclick="setSortOrder('high', this)">
                            <i class="fas fa-arrow-down"></i> High Stock First
                        </div>
                        <div class="sort-option" onclick="setSortOrder('name', this)">
                            <i class="fas fa-font"></i> Sort by Name
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product List Grid -->
        <div class="product-list-container" id="productListContainer">
            <!-- Loading will be injected here by JS -->
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit Product</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            
            <div class="form-card">
                <div class="form-section-title">Product Information</div>
                <div class="form-group">
                    <label class="form-label">Product Photo</label>
                    <div class="photo-upload-wrapper" id="editPhotoWrapper">
                        <div class="photo-placeholder" id="editPhotoPlaceholder" onclick="showPhotoMenu(event)">
                            <i class="fas fa-camera"></i>
                            <span>Tap to upload<br>or take photo</span>
                        </div>
                        <img id="editPhotoPreview" class="photo-preview-large" alt="Preview" onclick="showPhotoMenu(event)">
                        <input type="file" id="editPhotoInput" accept="image/*">
                    </div>
                </div>
                <div class="form-group"><label class="form-label">Part Name</label><input type="text" class="form-input" id="editPartName"></div>
                <div class="form-group"><label class="form-label">Part No.</label><input type="text" class="form-input" id="editPartNo"></div>
                <div class="form-group"><label class="form-label">No. Spec</label><input type="text" class="form-input" id="editNoSpec"></div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" class="form-input" id="editLocation"></div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-input" id="editCategory">
                        <option value="Maintenance">Maintenance</option>
                        <option value="Consumable">Consumable</option>
                        <option value="Tools">Tools</option>
                        <option value="Safety">Safety</option>
                        <option value="Kaizen">Kaizen</option>
                        <option value="Uncategorized">Uncategorized</option>
                    </select>
                </div>
            </div>

            <div class="form-card">
                <div class="form-section-title">Stock Information</div>
                <div class="form-group"><label class="form-label">Current Stock</label><input type="number" class="form-input" id="editCurrentStock" min="0"></div>
                <div class="form-group"><label class="form-label">Minimum Stock</label><input type="number" class="form-input" id="editMinimumStock" min="0"></div>
            </div>

            <div class="modal-btn-group">
                <button class="modal-btn cancel" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn save" id="saveBtn" onclick="saveEditProduct()">Update</button>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let currentCategory = 'all';
        let currentSearch = '';
        let currentSort = 'default';
        let editingPartNo = null;
        let tempEditPhotoBase64 = '';
        const PRODUCT_CACHE_KEY = 'ma_inventory_product_list';
        const PROD_IMG_PREFIX = 'ma_prod_img';

        document.addEventListener('DOMContentLoaded', function() {
            PhotoPicker.init({ wrapperId: 'editPhotoWrapper', inputId: 'editPhotoInput', previewId: 'editPhotoPreview', placeholderId: 'editPhotoPlaceholder' });
            document.getElementById('editPhotoInput').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) { 
                        tempEditPhotoBase64 = ev.target.result;
                        Utils.showToast('📷 Photo selected', 'info');
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#sortBtn') && !e.target.closest('#sortDropdown')) {
                    document.getElementById('sortDropdown').classList.remove('show');
                }
            });
            loadProductList();
        });

        async function loadProductList(forceRefresh = false) {
            const container = document.getElementById('productListContainer');
            container.innerHTML = `<div style="grid-column: 1 / -1; width: 100%; min-height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;"><div><i class="fas fa-spinner fa-spin" style="font-size: 48px; color: #1a73e8; margin-bottom: 15px; display: block;"></i><div style="font-size: 14px; color: #666; font-weight: 500;">Loading products...</div></div></div>`;
            
            const fetchedProducts = await DataManager.fetchData(PRODUCT_CACHE_KEY, CONFIG.API_URL + '?action=getAllProducts', 'products', forceRefresh);
            
            if (fetchedProducts !== null) {
                allProducts = fetchedProducts;
                renderProducts();
            } else {
                container.innerHTML = `<div style="grid-column: 1 / -1; width: 100%; min-height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;"><div><i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #dc3545; margin-bottom: 15px; display: block;"></i><div style="font-size: 14px; color: #999;">Failed to load data</div></div></div>`;
            }
        }

        function getStockStatus(current, min) {
            const thresholdOK = min + (min * 0.5);
            return current > thresholdOK ? 'high' : (current > min ? 'mid' : 'low');
        }

        function renderProducts() {
            const container = document.getElementById('productListContainer');
            let filtered = allProducts.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const searchLower = currentSearch.toLowerCase();
                const matchSearch = p.partName.toLowerCase().includes(searchLower) || p.partNo.toLowerCase().includes(searchLower) || (p.location && p.location.toLowerCase().includes(searchLower));
                return matchCategory && matchSearch;
            });

            if (currentSort === 'low') filtered.sort((a, b) => ({ 'low': 0, 'mid': 1, 'high': 2 }[getStockStatus(parseInt(a.currentStock), parseInt(a.minimumStock))] - { 'low': 0, 'mid': 1, 'high': 2 }[getStockStatus(parseInt(b.currentStock), parseInt(b.minimumStock))]);
            else if (currentSort === 'high') filtered.sort((a, b) => ({ 'low': 0, 'mid': 1, 'high': 2 }[getStockStatus(parseInt(b.currentStock), parseInt(b.minimumStock))] - { 'low': 0, 'mid': 1, 'high': 2 }[getStockStatus(parseInt(a.currentStock), parseInt(a.minimumStock))]);
            else if (currentSort === 'name') filtered.sort((a, b) => a.partName.localeCompare(b.partName));

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; width: 100%; min-height: 400px; display: flex; align-items: center; justify-content: center; text-align: center;"><div><i class="fas fa-search" style="font-size: 48px; color: #e0e0e0; margin-bottom: 15px; display: block;"></i><div style="font-size: 14px; color: #999;">No results found</div></div></div>`;
                return;
            }

            let html = '';
            filtered.forEach(product => {
                const statusClass = getStockStatus(parseInt(product.currentStock), parseInt(product.minimumStock));
                const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                const cachedImg = DataManager.getCachedImage(PROD_IMG_PREFIX, product.partNo);
                let imgContent = '<i class="fas fa-box"></i>';
                if (cachedImg) imgContent = `<img src="${cachedImg}" alt="${product.partName}">`;
                else if (product.pictureFileId) imgContent = `<div id="img-placeholder-${safePartNo}" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#1a73e8;"><i class="fas fa-spinner fa-spin"></i></div>`;

                html += `<div class="product-card status-${statusClass}" onclick="openEditModal('${product.partNo}')">
                    <div class="product-card-img" id="card-img-${safePartNo}">${imgContent}</div>
                    <div class="product-card-body">
                        <div class="product-card-name">${product.partName}</div>
                        <span class="product-card-partno">${product.partNo}</span>
                        <div class="product-card-location"><i class="fas fa-map-marker-alt"></i> ${product.location || '-'}</div>
                    </div>
                    <div class="product-card-footer">
                        <div class="product-card-stock">
                            <div class="status-dot ${statusClass}"></div>
                            <div class="stock-info"><div class="stock-label">Stock</div><div class="stock-number">${product.currentStock}</div></div>
                        </div>
                        <button class="delete-btn-round" onclick="event.stopPropagation(); deleteProduct('${product.partNo}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;

            filtered.forEach(product => {
                if (product.pictureFileId && !DataManager.getCachedImage(PROD_IMG_PREFIX, product.partNo)) {
                    const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    const placeholderEl = document.getElementById(`img-placeholder-${safePartNo}`);
                    if (placeholderEl) {
                        APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                            if (imgResult.success && imgResult.base64) {
                                DataManager.setCachedImage(PROD_IMG_PREFIX, product.partNo, imgResult.base64);
                                const imgContainer = document.getElementById(`card-img-${safePartNo}`);
                                if (imgContainer) imgContainer.innerHTML = `<img src="${imgResult.base64}" alt="${product.partName}">`;
                            }
                        });
                    }
                }
            });
        }

        function filterProducts() { currentSearch = document.getElementById('searchInput').value; renderProducts(); }
        function setCategoryFilter(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            renderProducts();
        }
        function toggleSortMenu() { document.getElementById('sortDropdown').classList.toggle('show'); }
        function setSortOrder(order, element) {
            currentSort = order;
            document.querySelectorAll('.sort-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('sortBtn').classList.toggle('active', order !== 'default');
            document.getElementById('sortDropdown').classList.remove('show');
            renderProducts();
        }

        function openEditModal(partNo) {
            const product = allProducts.find(p => p.partNo === partNo);
            if (!product) return;
            editingPartNo = partNo;
            tempEditPhotoBase64 = '';
            document.getElementById('editPartName').value = product.partName;
            document.getElementById('editPartNo').value = product.partNo;
            document.getElementById('editNoSpec').value = product.noSpec || '';
            document.getElementById('editLocation').value = product.location || '';
            document.getElementById('editCategory').value = product.category || 'Uncategorized';
            document.getElementById('editCurrentStock').value = product.currentStock;
            document.getElementById('editMinimumStock').value = product.minimumStock;

            const preview = document.getElementById('editPhotoPreview');
            const placeholder = document.getElementById('editPhotoPlaceholder');
            const cachedImg = DataManager.getCachedImage(PROD_IMG_PREFIX, partNo);
            
            if (cachedImg) { preview.src = cachedImg; preview.style.display = 'block'; placeholder.style.display = 'none'; } 
            else if (product.pictureFileId) {
                placeholder.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading...</span>';
                APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                    if (imgResult.success && imgResult.base64) {
                        DataManager.setCachedImage(PROD_IMG_PREFIX, partNo, imgResult.base64);
                        preview.src = imgResult.base64; preview.style.display = 'block'; placeholder.style.display = 'none';
                    } else { resetPhotoPlaceholder(); }
                }).catch(() => resetPhotoPlaceholder());
            } else { resetPhotoPlaceholder(); }

            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Update'; btn.disabled = false;
            document.getElementById('editModal').classList.add('show');
        }

        function resetPhotoPlaceholder() {
            document.getElementById('editPhotoPreview').style.display = 'none';
            const placeholder = document.getElementById('editPhotoPlaceholder');
            placeholder.style.display = 'flex';
            placeholder.innerHTML = '<i class="fas fa-camera"></i><span>Tap to upload<br>or take photo</span>';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingPartNo = null;
            tempEditPhotoBase64 = '';
            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Update'; btn.disabled = false;
        }

        async function saveEditProduct() {
            if (!editingPartNo) { Utils.showToast('⚠️ No product selected!', 'warning'); return; }
            const partName = document.getElementById('editPartName').value.trim();
            const newPartNo = document.getElementById('editPartNo').value.trim();
            if (!partName || !newPartNo) { Utils.showToast('⚠️ Part Name and Part No. are required!', 'warning'); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Updating...'; btn.disabled = true;

            const payload = { 
                action: 'updateProduct', 
                data: { 
                    partName, partNo: newPartNo,
                    noSpec: document.getElementById('editNoSpec').value.trim(), 
                    location: document.getElementById('editLocation').value.trim(), 
                    category: document.getElementById('editCategory').value.trim(), 
                    currentStock: parseInt(document.getElementById('editCurrentStock').value) || 0,
                    minimumStock: parseInt(document.getElementById('editMinimumStock').value) || 0,
                    originalPartNo: editingPartNo
                } 
            };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload), signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                if (tempEditPhotoBase64) {
                    await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'uploadProductPicture', data: { base64: tempEditPhotoBase64, partNo: newPartNo } }) });
                    DataManager.setCachedImage(PROD_IMG_PREFIX, newPartNo, tempEditPhotoBase64);
                }

                // 🔥 INSTANT UPDATE & CACHE CLEAR
                DataManager.clearCache(PRODUCT_CACHE_KEY);
                const idx = allProducts.findIndex(p => p.partNo === editingPartNo);
                if (idx !== -1) {
                    allProducts[idx] = { ...allProducts[idx], partName, partNo: newPartNo, noSpec: payload.data.noSpec, location: payload.data.location, category: payload.data.category, currentStock: payload.data.currentStock, minimumStock: payload.data.minimumStock };
                }
                
                Utils.showToast('✅ Product updated!', 'success');
                closeEditModal();
                renderProducts(); // Render serta-merta
                
            } catch (error) {
                console.error('Save error:', error);
                Utils.showToast(error.name === 'AbortError' ? '⏱️ Request timeout.' : '❌ Failed to update: ' + error.message, 'error');
            } finally {
                btn.innerText = 'Update'; btn.disabled = false;
            }
        }

        async function deleteProduct(partNo) {
            if (!confirm('⚠️ Are you sure you want to delete this product?')) return;
            try {
                await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'deleteProduct', data: { partNo } }) });
                
                // 🔥 INSTANT DELETE & CACHE CLEAR
                DataManager.clearCache(PRODUCT_CACHE_KEY);
                DataManager.clearImageCache(PROD_IMG_PREFIX, partNo);
                allProducts = allProducts.filter(p => p.partNo !== partNo);
                
                Utils.showToast('✅ Product deleted', 'success');
                renderProducts(); // Render serta-merta
            } catch (error) { Utils.showToast('❌ Failed to delete', 'error'); }
        }

        document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
    </script>
</body>
</html>
