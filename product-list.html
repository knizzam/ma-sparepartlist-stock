<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product List - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="product-list.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
</head>
<body>

    <!-- Header -->
    <div class="product-list-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="product-list-title"><i class="fas fa-boxes-stacked"></i>Product List</h1>
    </div>

    <!-- Search & Filter -->
    <div class="search-filter-section">
        <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search Part Name, Part No, or Location..." onkeyup="filterProducts()">
        </div>
        <div class="category-filter-container" id="categoryFilter">
            <div class="category-chip active" data-category="all" onclick="setCategoryFilter('all', this)">All</div>
            <div class="category-chip" data-category="Maintenance" onclick="setCategoryFilter('Maintenance', this)">Maintenance</div>
            <div class="category-chip" data-category="Consumable" onclick="setCategoryFilter('Consumable', this)">Consumable</div>
            <div class="category-chip" data-category="Tools" onclick="setCategoryFilter('Tools', this)">Tools</div>
            <div class="category-chip" data-category="Safety" onclick="setCategoryFilter('Safety', this)">Safety</div>
            <div class="category-chip" data-category="Kaizen" onclick="setCategoryFilter('Kaizen', this)">Kaizen</div>
        </div>
    </div>

    <!-- Product List -->
    <div class="product-list-container" id="productListContainer">
        <div class="empty-state">
            <i class="fas fa-spinner fa-spin"></i>
            <div>Loading products...</div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Product Details</h2>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            
            <div class="photo-display-wrapper">
                <div class="photo-display" id="detailPhoto">
                    <i class="fas fa-box"></i>
                </div>
            </div>

            <div class="detail-info-grid">
                <div class="detail-item full-width">
                    <div class="detail-label">Part Name</div>
                    <div class="detail-value" id="detailPartName">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Part No.</div>
                    <div class="detail-value" id="detailPartNo">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Category</div>
                    <div class="detail-value" id="detailCategory">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">No. Spec</div>
                    <div class="detail-value" id="detailNoSpec">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Location</div>
                    <div class="detail-value" id="detailLocation">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Current Stock</div>
                    <div class="detail-value" id="detailCurrentStock">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Minimum Stock</div>
                    <div class="detail-value" id="detailMinimumStock">-</div>
                </div>
                <div class="detail-item full-width">
                    <div class="detail-label">Status</div>
                    <div id="detailStatusBadge"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Last Update By</div>
                    <div class="detail-value" id="detailLastUpdateBy">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Last Update Date</div>
                    <div class="detail-value" id="detailLastUpdateDate">-</div>
                </div>
            </div>

            <!-- Admin Action Buttons -->
            <div class="modal-btn-group" id="adminActions" style="display: none;">
                <button class="modal-btn close" onclick="closeDetailModal()">Close</button>
                <button class="modal-btn" style="background: var(--primary-blue); color: white;" onclick="editFromDetail()">
                    <i class="fas fa-pen"></i> Edit
                </button>
                <button class="modal-btn" style="background: #dc3545; color: white;" onclick="deleteFromDetail()">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </div>

            <div class="modal-btn-group" id="userActions">
                <button class="modal-btn close" onclick="closeDetailModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav FAB -->
    <div class="bottom-nav">
        <a href="scanner.html" class="fab-scan">
            <i class="fas fa-qrcode"></i>
            <span>Scan</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProducts = [];
        let currentCategory = 'all';
        let currentSearch = '';
        let userRole = 'User';
        let selectedProduct = null;

        // Check User Role
        function checkUserRole() {
            const profile = CacheManager.get(CONFIG.PROFILE_CACHE_KEY);
            if (profile && profile.role) {
                userRole = profile.role.toLowerCase();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkUserRole();
            loadProducts();
        });

        // Load Products
        async function loadProducts() {
            try {
                const res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
                const result = await res.json();
                if (result.success && result.products) {
                    allProducts = result.products;
                    renderProducts();
                } else {
                    document.getElementById('productListContainer').innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><div>No products found</div></div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('productListContainer').innerHTML = '<div class="empty-state" style="color:#dc3545;"><i class="fas fa-exclamation-triangle"></i><div>Failed to load data</div></div>';
            }
        }

        // Calculate Stock Status (50% Buffer Logic)
        function getStockStatus(current, min) {
            const thresholdOK = min + (min * 0.5);
            if (current > thresholdOK) return 'high';
            if (current > min) return 'mid';
            return 'low';
        }

        // Get Status Label
        function getStatusLabel(status) {
            const labels = { 'high': 'High Stock', 'mid': 'Mid Stock', 'low': 'Low Stock' };
            return labels[status] || status;
        }

        // Render Products
        function renderProducts() {
            const container = document.getElementById('productListContainer');
            
            let filtered = allProducts.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const searchLower = currentSearch.toLowerCase();
                const matchSearch = p.partName.toLowerCase().includes(searchLower) || 
                                    p.partNo.toLowerCase().includes(searchLower) || 
                                    (p.location && p.location.toLowerCase().includes(searchLower));
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><div>No results found</div></div>';
                return;
            }

            let html = '';
            filtered.forEach(product => {
                const statusClass = getStockStatus(parseInt(product.currentStock), parseInt(product.minimumStock));
                
                let imgContent = '<i class="fas fa-box"></i>';
                if (product.pictureFileId) {
                    const cachedImg = getCachedProductImage(product.partNo);
                    if (cachedImg) {
                        imgContent = `<img src="${cachedImg}" alt="${product.partName}">`;
                    } else {
                        imgContent = `<img src="" data-fileid="${product.pictureFileId}" data-partno="${product.partNo}" alt="${product.partName}" onload="this.parentElement.innerHTML='<img src=\\'' + this.src + '\\'>';" onerror="loadProductImage(this)">`;
                    }
                }

                html += `
                    <div class="product-card status-${statusClass}" onclick="openDetailModal('${product.partNo}')">
                        <div class="product-card-img">${imgContent}</div>
                        <div class="product-card-info">
                            <div class="product-card-name">${product.partName}</div>
                            <span class="product-card-partno">${product.partNo}</span>
                            <div class="product-card-location"><i class="fas fa-map-marker-alt"></i> ${product.location || '-'}</div>
                        </div>
                        <div class="product-card-stock">
                            <div class="stock-label">Stock</div>
                            <div class="stock-number">${product.currentStock}</div>
                            <div class="status-dot ${statusClass}"></div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // Load images for products without cache
            filtered.forEach(product => {
                if (product.pictureFileId && !getCachedProductImage(product.partNo)) {
                    const safePartNo = product.partNo.replace(/[^a-zA-Z0-9]/g, '');
                    const imgElements = document.querySelectorAll(`img[data-partno="${product.partNo}"]`);
                    imgElements.forEach(img => {
                        APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                            if (imgResult.success && imgResult.base64) {
                                setCachedProductImage(product.partNo, imgResult.base64);
                                img.src = imgResult.base64;
                            }
                        });
                    });
                }
            });
        }

        // Cache Functions
        function getCachedProductImage(partNo) {
            try {
                const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                const item = localStorage.getItem(key);
                if (!item) return null;
                const parsed = JSON.parse(item);
                if (new Date().getTime() - parsed.timestamp < 5 * 60 * 1000) return parsed.base64;
                localStorage.removeItem(key); return null;
            } catch(e) { return null; }
        }

        function setCachedProductImage(partNo, base64) {
            try {
                const key = 'ma_prod_img_' + partNo.replace(/[^a-zA-Z0-9]/g, '');
                localStorage.setItem(key, JSON.stringify({ base64: base64, timestamp: new Date().getTime() }));
            } catch(e) {}
        }

        function loadProductImage(imgElement) {
            const fileId = imgElement.getAttribute('data-fileid');
            const partNo = imgElement.getAttribute('data-partno');
            if (fileId) {
                APIHelper.fetchImage(fileId).then(imgResult => {
                    if (imgResult.success && imgResult.base64) {
                        setCachedProductImage(partNo, imgResult.base64);
                        imgElement.src = imgResult.base64;
                    }
                });
            }
        }

        // Filter Functions
        function filterProducts() {
            currentSearch = document.getElementById('searchInput').value;
            renderProducts();
        }

        function setCategoryFilter(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            renderProducts();
        }

        // Detail Modal Functions
        function openDetailModal(partNo) {
            const product = allProducts.find(p => p.partNo === partNo);
            if (!product) return;

            selectedProduct = product;
            const statusClass = getStockStatus(parseInt(product.currentStock), parseInt(product.minimumStock));

            document.getElementById('detailPartName').textContent = product.partName;
            document.getElementById('detailPartNo').textContent = product.partNo;
            document.getElementById('detailCategory').textContent = product.category || 'Uncategorized';
            document.getElementById('detailNoSpec').textContent = product.noSpec || '-';
            document.getElementById('detailLocation').textContent = product.location || '-';
            document.getElementById('detailCurrentStock').textContent = product.currentStock;
            document.getElementById('detailMinimumStock').textContent = product.minimumStock;
            document.getElementById('detailLastUpdateBy').textContent = product.lastUpdateBy || '-';
            document.getElementById('detailLastUpdateDate').textContent = product.lastUpdateDate || '-';

            // Status Badge
            const statusBadge = document.getElementById('detailStatusBadge');
            statusBadge.innerHTML = `<span class="status-badge ${statusClass}">${getStatusLabel(statusClass)}</span>`;

            // Photo
            const photoDiv = document.getElementById('detailPhoto');
            const cachedImg = getCachedProductImage(product.partNo);
            if (cachedImg) {
                photoDiv.innerHTML = `<img src="${cachedImg}" alt="${product.partName}">`;
            } else if (product.pictureFileId) {
                photoDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                APIHelper.fetchImage(product.pictureFileId).then(imgResult => {
                    if (imgResult.success && imgResult.base64) {
                        setCachedProductImage(product.partNo, imgResult.base64);
                        photoDiv.innerHTML = `<img src="${imgResult.base64}" alt="${product.partName}">`;
                    } else {
                        photoDiv.innerHTML = '<i class="fas fa-box"></i>';
                    }
                });
            } else {
                photoDiv.innerHTML = '<i class="fas fa-box"></i>';
            }

            // Show/Hide admin buttons
            if (userRole === 'admin') {
                document.getElementById('adminActions').style.display = 'flex';
                document.getElementById('userActions').style.display = 'none';
            } else {
                document.getElementById('adminActions').style.display = 'none';
                document.getElementById('userActions').style.display = 'flex';
            }

            document.getElementById('detailModal').classList.add('show');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
            selectedProduct = null;
        }

        function editFromDetail() {
            if (selectedProduct) {
                closeDetailModal();
                window.location.href = `add-product.html?edit=${encodeURIComponent(selectedProduct.partNo)}`;
            }
        }

        async function deleteFromDetail() {
            if (!selectedProduct) return;
            if (!confirm('⚠️ Are you sure you want to delete this product?')) return;
            
            try {
                await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'deleteProduct', data: { partNo: selectedProduct.partNo } }) });
                Utils.showToast('✅ Product deleted successfully', 'success');
                closeDetailModal();
                loadProducts();
            } catch (error) { Utils.showToast('❌ Failed to delete product', 'error'); }
        }

        // Close modal when clicking outside
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetailModal();
        });
    </script>
</body>
</html>
