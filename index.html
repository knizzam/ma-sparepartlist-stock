    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() { 
            loadProfileWithCache(); 
            updateOrderBadge(); // Panggil fungsi untuk update badge nombor
        });

        async function loadProfileWithCache() {
            const imgEl = document.getElementById('profileImage');
            const nameEl = document.getElementById('profileName');
            const roleEl = document.getElementById('profileRole');

            const PROFILE_CACHE_KEY = 'ma_inventory_profile_data';
            const PROFILE_IMG_PREFIX = 'ma_profile_img';
            const PROFILE_IMG_ID = 'current_user';

            const cachedProfileStr = localStorage.getItem(PROFILE_CACHE_KEY);
            let cachedImage = (typeof DataManager !== 'undefined') ? DataManager.getCachedImage(PROFILE_IMG_PREFIX, PROFILE_IMG_ID) : null;

            if (cachedProfileStr) {
                try {
                    const cachedProfile = JSON.parse(cachedProfileStr);
                    nameEl.textContent = cachedProfile.name || 'User';
                    roleEl.textContent = cachedProfile.role || 'Role';
                    
                    if (cachedImage) {
                        imgEl.src = cachedImage;
                    } else {
                        imgEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cachedProfile.name || 'User')}&background=1a73e8&color=fff&size=150`;
                    }
                } catch(e) {}
            }

            try {
                let data;
                if (typeof APIHelper !== 'undefined' && APIHelper.fetchProfile) {
                    data = await APIHelper.fetchProfile();
                } else {
                    const res = await fetch(CONFIG.API_URL + '?action=getProfile');
                    data = await res.json();
                }

                if (data.success && data.user) {
                    const user = data.user;
                    localStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify(user));
                    nameEl.textContent = user.name || 'User';
                    roleEl.textContent = user.role || 'Role';

                    if (user.pictureFileId && user.pictureFileId.trim() !== '') {
                        let needsFetch = true;
                        if (cachedImage && cachedProfileStr) {
                            try {
                                const cp = JSON.parse(cachedProfileStr);
                                if (cp.pictureFileId === user.pictureFileId) needsFetch = false;
                            } catch(e) {}
                        }

                        if (needsFetch) {
                            let imgData;
                            if (typeof APIHelper !== 'undefined' && APIHelper.fetchImage) {
                                imgData = await APIHelper.fetchImage(user.pictureFileId);
                            } else {
                                const imgRes = await fetch(CONFIG.API_URL + '?action=getImage&fileId=' + encodeURIComponent(user.pictureFileId));
                                imgData = await imgRes.json();
                            }

                            if (imgData.success && imgData.base64) {
                                if (typeof DataManager !== 'undefined') {
                                    DataManager.setCachedImage(PROFILE_IMG_PREFIX, PROFILE_IMG_ID, imgData.base64);
                                }
                                imgEl.src = imgData.base64;
                            } else {
                                imgEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=1a73e8&color=fff&size=150`;
                            }
                        } else {
                            imgEl.src = cachedImage;
                        }
                    } else {
                        imgEl.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=1a73e8&color=fff&size=150`;
                    }
                }
            } catch (error) { console.error('Error loading profile:', error); }
        }

        // FUNGSI BARU: KIRA DAN UPDATE BADGE PREDICTIVE ORDERING
        async function updateOrderBadge() {
    const badge = document.getElementById('orderBadge');
    if (!badge) return;
    
    const PRODUCT_CACHE_KEY = 'ma_inventory_product_list';
    const CACHE_EXPIRY = 5 * 60 * 1000;
    
    try {
        let allProducts = [];
        const cachedData = localStorage.getItem(PRODUCT_CACHE_KEY);
        
        if (cachedData) {
            try {
                const parsed = JSON.parse(cachedData);
                if (new Date().getTime() - parsed.timestamp < CACHE_EXPIRY) {
                    allProducts = parsed.data;
                }
            } catch(e) {}
        }
        
        if (allProducts.length === 0) {
            const res = await fetch(CONFIG.API_URL + '?action=getAllProducts');
            const result = await res.json();
            if (result.success && result.products) {
                allProducts = result.products;
                localStorage.setItem(PRODUCT_CACHE_KEY, JSON.stringify({ 
                    data: allProducts, 
                    timestamp: new Date().getTime() 
                }));
            }
        }
        
        // Kira barang yang currentStock <= thresholdOK (Low + Mid)
        const needOrderItems = allProducts.filter(p => {
            const current = parseInt(p.currentStock) || 0;
            const minimum = parseInt(p.minimumStock) || 0;
            const thresholdOK = minimum + (minimum * 0.5);
            return current <= thresholdOK;
        });
        
        const count = needOrderItems.length;
        
        if (count > 0) {
            badge.textContent = count > 99 ? '99+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    } catch (error) {
        console.error('Error updating order badge:', error);
    }
}

        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
