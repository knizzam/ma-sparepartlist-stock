<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA Stock Take System</title>
    
    <!-- Bootstrap 5 CSS (Untuk Design Cantik) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Untuk Icon Cantik) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .main-card { max-width: 600px; margin: 0 auto; }
        .scanner-box { 
            width: 100%; height: 300px; background: #000; 
            border-radius: 15px; display: flex; align-items: center; 
            justify-content: center; color: white; margin-bottom: 20px; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card main-card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="fas fa-boxes-stacked"></i> MA Stock Take</h4>
            </div>
            <div class="card-body">
                <h5 class="card-title text-center mb-4">Dashboard Scanner</h5>
                
                <!-- Kawasan Kamera Akan Muncul Di Sini Nanti -->
                <div id="reader" class="scanner-box">
                    <p><i class="fas fa-camera fa-2x"></i><br>Kamera akan aktif di sini</p>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-success btn-lg" id="startScanBtn">
                        <i class="fas fa-qrcode"></i> Mula Scan QR
                    </button>
                    <button class="btn btn-outline-secondary">
                        <i class="fas fa-list"></i> Senarai Produk
                    </button>
                </div>
            </div>
            <div class="card-footer text-center text-muted">
                <small>Dibina dengan Bootstrap & Vercel</small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Kita akan tulis kod JavaScript untuk kamera dan fetch data di sini nanti
        document.getElementById('startScanBtn').addEventListener('click', function() {
            alert('Butang scan ditekan! Kita akan aktifkan kamera di sini nanti.');
        });
    </script>
</body>
</html>
