<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MA Inventory System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
</head>
<body class="index-page">

    <!-- HEADER YANG LEBIH RENDAH & STANDARD -->
    <div class="app-header">
        <h1 class="page-title">MA INVENTORY SYSTEM</h1>
    </div>

    <div id="profileSection" class="profile-section">
        <!-- HELP BUTTON SUDAH DIBUANG -->
        
        <div class="profile-center">
            <div class="profile-img-container">
                <img id="profileImage" src="https://ui-avatars.com/api/?name=User&background=1a73e8&color=fff&size=150" alt="Profile" class="profile-img">
                <div class="edit-badge" onclick="window.location.href='edit-profile.html'" title="Edit Profile"><i class="fas fa-pen"></i></div>
            </div>
            <div id="profileName" class="profile-name">User</div>
            <div id="profileRole" class="profile-role">Role</div>
        </div>

        <div class="round-icon-btn logout-btn" onclick="handleLogout()"><i class="fas fa-power-off"></i></div>
    </div>

    <div class="dashboard-grid">
        <a href="scanner.html" class="menu-card"><div class="icon-circle bg-scan"><i class="fas fa-qrcode"></i></div><span class="menu-label">Stock Take<br>Scan</span></a>
        <a href="confirmation.html" class="menu-card"><span class="badge-new">New</span><div class="icon-circle bg-confirm"><i class="fas fa-clipboard-check"></i></div><span class="menu-label">Confirmation<br>Stock Take</span></a>
        <a href="history.html" class="menu-card"><div class="icon-circle bg-history"><i class="fas fa-clock-rotate-left"></i></div><span class="menu-label">Stock Take<br>History</span></a>
        <a href="add-product.html" class="menu-card"><div class="icon-circle bg-add"><i class="fas fa-box-open"></i></div><span class="menu-label">Add New<br>Product</span></a>
        <a href="register.html" class="menu-card"><div class="icon-circle bg-register"><i class="fas fa-user-pen"></i></div><span class="menu-label">Registration<br>Users</span></a>
        <a href="export.html" class="menu-card"><div class="icon-circle bg-export"><i class="fas fa-file-export"></i></div><span class="menu-label">Export Report<br>(CSV)</span></a>
        <a href="print-qr.html" class="menu-card"><div class="icon-circle bg-print"><i class="fas fa-print"></i></div><span class="menu-label">Print QR<br>Code</span></a>
        <a href="product-list.html" class="menu-card"><div class="icon-circle bg-product"><i class="fas fa-boxes-stacked"></i></div><span class="menu-label">Product</span></a>
        <a href="order.html" class="menu-card"><div class="icon-circle bg-order"><i class="fas fa-cart-shopping"></i></div><span class="menu-label">Order</span></a>
        <a href="transaction.html" class="menu-card"><div class="icon-circle bg-transaction"><i class="fas fa-exchange-alt"></i></div><span class="menu-label">Transaction</span></a>
        <a href="dashboard.html" class="menu-card"><div class="icon-circle bg-dashboard"><i class="fas fa-chart-line"></i></div><span class="menu-label">Dashboard</span></a>
        <a href="settings.html" class="menu-card"><div class="icon-circle bg-setting"><i class="fas fa-gear"></i></div><span class="menu-label">Setting</span></a>
    </div>

    <!-- BOTTOM NAV YANG LEBIH BESAR -->
    <div class="bottom-nav">
        <a href="scanner.html" class="fab-scan">
            <i class="fas fa-qrcode"></i>
            <span>Scan</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() { loadProfileWithCache(); });

        async function loadProfileWithCache() {
            const imgEl = document.getElementById('profileImage');
            const nameEl = document.getElementById('profileName');
            const roleEl = document.getElementById('profileRole');

            const cachedProfile = CacheManager.get(CONFIG.PROFILE_CACHE_KEY);
            const cachedImage = CacheManager.get(CONFIG.IMAGE_CACHE_KEY);

            if (cachedProfile) {
                nameEl.textContent = cachedProfile.name || 'User';
                roleEl.textContent = cachedProfile.role || 'Role';
                
                const initialsUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(cachedProfile.name || 'User')}&background=1a73e8&color=fff&size=150`;
                imgEl.src = initialsUrl;

                if (cachedImage) {
                    imgEl.src = cachedImage;
                }
            }

            try {
                const data = await APIHelper.fetchProfile();
                if (data.success && data.user) {
                    const user = data.user;
                    CacheManager.set(CONFIG.PROFILE_CACHE_KEY, user);
                    
                    nameEl.textContent = user.name || 'User';
                    roleEl.textContent = user.role || 'Role';

                    const newInitialsUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=1a73e8&color=fff&size=150`;
                    
                    if (user.pictureFileId && user.pictureFileId.trim() !== '') {
                        if (!cachedImage || cachedProfile?.pictureFileId !== user.pictureFileId) {
                            const imgData = await APIHelper.fetchImage(user.pictureFileId);
                            if (imgData.success && imgData.base64) {
                                CacheManager.set(CONFIG.IMAGE_CACHE_KEY, imgData.base64);
                                imgEl.src = imgData.base64;
                            } else {
                                imgEl.src = newInitialsUrl;
                            }
                        }
                    } else {
                        imgEl.src = newInitialsUrl;
                    }
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        function handleLogout() {
            CacheManager.clearAll();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
