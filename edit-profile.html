<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Profile - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="edit-profile.css">
    
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="photo-picker.js"></script>
</head>
<body>

    <!-- HEADER DENGAN ICON -->
    <div class="edit-profile-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="edit-profile-title"><i class="fas fa-user-pen"></i>Edit Profile</h1>
    </div>

    <div class="main-container">
        <!-- PROFILE PHOTO SECTION -->
        <div class="profile-photo-section">
            <div class="form-section-title" style="text-align: center; margin-bottom: 15px;">Profile Photo</div>
            
            <div class="photo-upload-wrapper" id="photoWrapper">
                <div class="profile-pic-outer" id="profilePic">
                    <div class="loading-spinner"></div>
                </div>
                <input type="file" id="photoInput" accept="image/*">
            </div>
            
            <p class="photo-hint">Tap photo or camera icon to update</p>
        </div>

        <!-- ACCOUNT INFORMATION -->
        <div class="form-card">
            <div class="form-section-title">Account Information</div>
            <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" id="userName" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">ID Number (No. K/T)</label><input type="text" class="form-input" id="userNoKad" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">Role</label><input type="text" class="form-input" id="userRole" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" id="userEmail" disabled placeholder="Loading..."></div>
        </div>

        <!-- BUTTONS -->
        <div class="btn-group">
            <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
            <button class="submit-btn" id="saveBtn" onclick="saveProfilePicture()"><i class="fas fa-save me-2"></i> Save Changes</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let tempPhotoBase64 = '';
        let hasNewPhoto = false;
        let currentPictureFileId = '';
        
        // Init Photo Picker
        document.addEventListener('DOMContentLoaded', function() {
            PhotoPicker.init({
                wrapperId: 'photoWrapper',
                inputId: 'photoInput',
                previewId: 'profilePic',
                placeholderId: null // Kita guna profilePic sebagai preview
            });
            
            // Override PhotoPicker untuk update profile pic
            document.getElementById('photoInput').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        tempPhotoBase64 = ev.target.result;
                        hasNewPhoto = true;
                        document.getElementById('profilePic').innerHTML = `<img src="${tempPhotoBase64}" alt="Profile">`;
                        Utils.showToast('📷 Gambar dipilih. Klik "Save Changes"', 'warning');
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
            
            loadProfile();
        });

        function loadProfile() {
            document.getElementById('userName').value = 'Loading...';
            document.getElementById('userNoKad').value = 'Loading...';
            document.getElementById('userRole').value = 'Loading...';
            document.getElementById('userEmail').value = 'Loading...';
            
            const cachedProfile = CacheManager.get(CONFIG.PROFILE_CACHE_KEY);
            const cachedImage = CacheManager.get(CONFIG.IMAGE_CACHE_KEY);
            
            if (cachedProfile) {
                document.getElementById('userName').value = cachedProfile.name || '-';
                document.getElementById('userNoKad').value = cachedProfile.noKad || '-';
                document.getElementById('userRole').value = cachedProfile.role || '-';
                document.getElementById('userEmail').value = cachedProfile.email || '-';
                currentPictureFileId = cachedProfile.pictureFileId || '';
                
                if (cachedImage && cachedProfile.pictureFileId) {
                    document.getElementById('profilePic').innerHTML = `<img src="${cachedImage}" alt="Profile">`;
                } else {
                    document.getElementById('profilePic').innerHTML = `<div class="profile-pic-default"><i class="fas fa-user"></i></div>`;
                }
            }
            
            fetch(CONFIG.API_URL + '?action=getProfile')
                .then(response => response.text())
                .then(text => {
                    try {
                        const result = JSON.parse(text);
                        if (result.success && result.user) {
                            const user = result.user;
                            document.getElementById('userName').value = user.name || '-';
                            document.getElementById('userNoKad').value = user.noKad || '-';
                            document.getElementById('userRole').value = user.role || '-';
                            document.getElementById('userEmail').value = user.email || '-';
                            currentPictureFileId = user.pictureFileId || '';
                            CacheManager.set(CONFIG.PROFILE_CACHE_KEY, user);
                            
                            if (user.pictureFileId && user.pictureFileId.trim() !== "") {
                                fetch(CONFIG.API_URL + '?action=getImage&fileId=' + encodeURIComponent(user.pictureFileId))
                                    .then(res => res.text())
                                    .then(imgText => {
                                        try {
                                            const imgResult = JSON.parse(imgText);
                                            if (imgResult.success && imgResult.base64 && imgResult.base64.length > 100) {
                                                document.getElementById('profilePic').innerHTML = `<img src="${imgResult.base64}" alt="Profile">`;
                                                CacheManager.set(CONFIG.IMAGE_CACHE_KEY, imgResult.base64);
                                            }
                                        } catch(e) {}
                                    });
                            } else {
                                document.getElementById('profilePic').innerHTML = `<div class="profile-pic-default"><i class="fas fa-user"></i></div>`;
                            }
                        }
                    } catch (e) {}
                })
                .catch(error => { console.error("Network Error:", error); });
        }

        function saveProfilePicture() {
            if (!hasNewPhoto || !tempPhotoBase64) {
                Utils.showToast('⚠️ Sila pilih gambar baru dahulu!', 'warning');
                return;
            }
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Saving...';
            saveBtn.disabled = true;

            const payload = { 
                action: 'updateProfilePicture', 
                base64: tempPhotoBase64, 
                fileName: 'profile.jpg' 
            };

            fetch(CONFIG.API_URL, {
                method: 'POST', 
                mode: 'no-cors', 
                headers: { 'Content-Type': 'text/plain' }, 
                body: JSON.stringify(payload)
            })
            .then(() => {
                Utils.showToast('✅ Profil berjaya dikemaskini!', 'success');
                
                CacheManager.set(CONFIG.IMAGE_CACHE_KEY, tempPhotoBase64);
                document.getElementById('profilePic').innerHTML = `<img src="${tempPhotoBase64}" alt="Profile" style="width:100%; height:100%; object-fit:cover;">`;
                
                hasNewPhoto = false;
                tempPhotoBase64 = '';
                document.getElementById('photoInput').value = '';
                saveBtn.innerHTML = '<i class="fas fa-save me-2"></i> Save Changes';
                saveBtn.disabled = false;
            })
            .catch(err => {
                Utils.showToast('❌ Ralat semasa menyimpan', 'error');
                saveBtn.innerHTML = '<i class="fas fa-save me-2"></i> Save Changes';
                saveBtn.disabled = false;
            });
        }
        
        function cancelEdit() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
