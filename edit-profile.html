<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Profile - MA Inventory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="edit-profile.css">
    
    <!-- SCRIPT ORDER: Config -> Utils -> PhotoPicker -> DataManager -->
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="photo-picker.js"></script>
    <script src="data-manager.js"></script>
</head>
<body>

    <div class="edit-profile-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="edit-profile-title"><i class="fas fa-user-pen"></i>Edit Profile</h1>
    </div>

    <div class="main-container">
        <!-- PROFILE PHOTO SECTION -->
        <div class="profile-photo-section">
            <div class="form-section-title" style="text-align: center; margin-bottom: 15px;">Profile Photo</div>
            
            <div class="photo-upload-wrapper" id="photoWrapper">
                <div class="profile-pic-outer" id="photoPlaceholder" onclick="showPhotoMenu(event)">
                    <div class="profile-pic-default" id="profilePicDefault">
                        <i class="fas fa-user"></i>
                    </div>
                    <img id="photoPreview" class="photo-preview-round" alt="Profile" onclick="showPhotoMenu(event)" style="display: none;">
                </div>
                <input type="file" id="photoInput" accept="image/*">
            </div>
            
            <p class="photo-hint">Tap photo to update</p “>
        </div>

        <!-- ACCOUNT INFORMATION -->
        <div class="form-card">
            <div class="form-section-title">Account Information</div>
            <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" id="userName" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">ID Number (No. K/T)</label><input type="text" class="form-input" id="userNoKad" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">Role</label><input type="text" class="form-input" id="userRole" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" id="userEmail" disabled placeholder="Loading..."></div>
        </div>

        <!-- BUTTONS -->
        <div class="btn-group">
            <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
            <button class="submit-btn" id="saveBtn" onclick="saveProfilePicture()"><i class="fas fa-save me-2"></i> Save Changes</button>
        </div
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let tempPhotoBase64 = '';
        let hasNewPhoto = false;
        let currentPictureFileId = '';
        
        // Cache Keys
        const PROFILE_CACHE_KEY = 'ma_inventory_profile_data';
        const PROFILE_IMG_PREFIX = 'ma_profile_img';
        const PROFILE_IMG_ID = 'current_user';

        document.addEventListener('DOMContentLoaded', function() {
            // Init PhotoPicker (untuk fallback)
            if (typeof PhotoPicker !== 'undefined') {
                PhotoPicker.init({
                    wrapperId: 'photoWrapper',
                    inputId: 'photoInput',
                    previewId: 'photoPreview',
                    placeholderId: 'photoPlaceholder'
                });
            }
            
            // PENTING: Override event listener untuk update preview serta-merta
            document.getElementById('photoInput').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        tempPhotoBase64 = ev.target.result;
                        hasNewPhoto = true;
                        
                        // Tunjuk preview bulat serta-merta
                        const preview = document.getElementById('photoPreview');
                        const defaultIcon = document.getElementById('profilePicDefault');
                        preview.src = tempPhotoBase64;
                        preview.style.display = 'block';
                        if (defaultIcon) defaultIcon.style.display = 'none';
                        
                        if (typeof Utils !== 'undefined') {
                            Utils.showToast('📷 Gambar dipilih. Klik "Save Changes"', 'info');
                        }
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
            
            loadProfile();
        });

        function showPhotoMenu(event) {
            if (event) event.preventDefault();
            const photoInput = document.getElementById('photoInput');
            if (photoInput) {
                photoInput.click();
            }
        }

        function loadProfile() {
            // Set loading state
            document.getElementById('userName').value = 'Loading...';
            document.getElementById('userNoKad').value = 'Loading...';
            document.getElementById('userRole').value = 'Loading...';
            document.getElementById('userEmail').value = 'Loading...';
            
            // 1. Cuba ambil dari cache dahulu
            const cachedProfileStr = localStorage.getItem(PROFILE_CACHE_KEY);
            let cachedImage = null;
            if (typeof DataManager !== 'undefined') {
                cachedImage = DataManager.getCachedImage(PROFILE_IMG_PREFIX, PROFILE_IMG_ID);
            }
            
            if (cachedProfileStr) {
                try {
                    const cachedProfile = JSON.parse(cachedProfileStr);
                    document.getElementById('userName').value = cachedProfile.name || '-';
                    document.getElementById('userNoKad').value = cachedProfile.noKad || '-';
                    document.getElementById('userRole').value = cachedProfile.role || '-';
                    document.getElementById('userEmail').value = cachedProfile.email || '-';
                    currentPictureFileId = cachedProfile.pictureFileId || '';
                    
                    if (cachedImage && currentPictureFileId) {
                        showProfileImage(cachedImage);
                    }
                } catch(e) {
                    console.error('Cache parse error:', e);
                }
            }
            
            // 2. Fetch data terbaru dari API
            fetch(CONFIG.API_URL + '?action=getProfile')
                .then(response => response.json())
                .then(result => {
                    if (result.success && result.user) {
                        const user = result.user;
                        document.getElementById('userName').value = user.name || '-';
                        document.getElementById('userNoKad').value = user.noKad || '-';
                        document.getElementById('userRole').value = user.role || '-';
                        document.getElementById('userEmail').value = user.email || '-';
                        currentPictureFileId = user.pictureFileId || '';
                        
                        // Simpan ke cache
                        localStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify(user));
                        
                        // Fetch gambar jika ada dan belum ada dalam cache
                        if (user.pictureFileId && user.pictureFileId.trim() !== "" && !cachedImage) {
                            fetch(CONFIG.API_URL + '?action=getImage&fileId=' + encodeURIComponent(user.pictureFileId))
                                .then(res => res.json())
                                .then(imgResult => {
                                    if (imgResult.success && imgResult.base64 && imgResult.base64.length > 100) {
                                        showProfileImage(imgResult.base64);
                                        if (typeof DataManager !== 'undefined') {
                                            DataManager.setCachedImage(PROFILE_IMG_PREFIX, PROFILE_IMG_ID, imgResult.base64);
                                        }
                                    }
                                })
                                .catch(err => console.error("Image fetch error:", err));
                        }
                    }
                })
                .catch(error => { 
                    console.error("Network Error:", error); 
                });
        }

        function showProfileImage(base64) {
            const preview = document.getElementById('photoPreview');
            const defaultIcon = document.getElementById('profilePicDefault');
            preview.src = base64;
            preview.style.display = 'block';
            if (defaultIcon) defaultIcon.style.display = 'none';
        }

        function saveProfilePicture() {
            if (!hasNewPhoto || !tempPhotoBase64) {
                if (typeof Utils !== 'undefined') {
                    Utils.showToast('⚠️ Sila pilih gambar baru dahulu!', 'warning');
                }
                return;
            }
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Saving...';
            saveBtn.disabled = true;

            const payload = { 
                action: 'updateProfilePicture', 
                base64: tempPhotoBase64, 
                fileName: 'profile.jpg' 
            };

            fetch(CONFIG.API_URL, {
                method: 'POST', 
                mode: 'no-cors', 
                headers: { 'Content-Type': 'text/plain' }, 
                body: JSON.stringify(payload)
            })
            .then(() => {
                if (typeof Utils !== 'undefined') {
                    Utils.showToast('✅ Profil berjaya dikemaskini!', 'success');
                }
                
                // 1. Update cache gambar profil
                if (typeof DataManager !== 'undefined') {
                    DataManager.setCachedImage(PROFILE_IMG_PREFIX, PROFILE_IMG_ID, tempPhotoBase64);
                    
                    // 2. PENTING: Clear cache senarai pengguna supaya gambar baru muncul di page User Management!
                    DataManager.clearCache('ma_inventory_user_list');
                }
                
                hasNewPhoto = false;
                tempPhotoBase64 = '';
                document.getElementById('photoInput').value = '';
                saveBtn.innerHTML = '<i class="fas fa-save me-2"></i> Save Changes';
                saveBtn.disabled = false;
            })
            .catch(err => {
                console.error('Save error:', err);
                if (typeof Utils !== 'undefined') {
                    Utils.showToast('❌ Ralat semasa menyimpan', 'error');
                }
                saveBtn.innerHTML = '<i class="fas fa-save me-2"></i> Save Changes';
                saveBtn.disabled = false;
            });
        }
        
        function cancelEdit() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
