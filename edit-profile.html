<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Profile - MA Inventory</title>
    
    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css"> <!-- Pautan ke fail CSS global -->
    <link rel="stylesheet" href="print-qr.css">
    
    <script src="config.js"></script>
</head>
<body>
    <div class="page-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="page-title">Edit Profile</h1>
    </div>

    <div class="form-container">
        <div class="form-card" style="text-align: center;">
            <div class="form-section-title" style="text-align: left;">Profile Photo</div>
            <div class="photo-upload-wrapper">
                <div class="profile-pic-outer" id="profilePic"><div class="loading-spinner"></div></div>
                <div class="edit-icon-float" onclick="document.getElementById('photoInput').click()"><i class="fas fa-camera"></i></div>
            </div>
            <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(this)">
            <p style="font-size: 13px; color: #888;">Tap camera icon to update picture</p>
        </div>

        <div class="form-card">
            <div class="form-section-title">Account Information</div>
            <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" id="userName" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">ID Number (No. K/T)</label><input type="text" class="form-input" id="userNoKad" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">Role</label><input type="text" class="form-input" id="userRole" disabled placeholder="Loading..."></div>
            <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" id="userEmail" disabled placeholder="Loading..."></div>
        </div>

        <button class="submit-btn" id="saveBtn" onclick="saveProfilePicture()"><i class="fas fa-save me-2"></i> Save Changes</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = CONFIG.API_URL;
        let tempPhotoBase64 = '';
        let hasNewPhoto = false;

        function showToast(message, type = 'info') {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function loadProfile() {
            document.getElementById('userName').value = 'Loading...';
            document.getElementById('userNoKad').value = 'Loading...';
            document.getElementById('userRole').value = 'Loading...';
            document.getElementById('userEmail').value = 'Loading...';
            
            const cachedProfile = CacheManager.get(CONFIG.PROFILE_CACHE_KEY);
            const cachedImage = CacheManager.get(CONFIG.IMAGE_CACHE_KEY);
            
            if (cachedProfile) {
                document.getElementById('userName').value = cachedProfile.name || '-';
                document.getElementById('userNoKad').value = cachedProfile.noKad || '-';
                document.getElementById('userRole').value = cachedProfile.role || '-';
                document.getElementById('userEmail').value = cachedProfile.email || '-';
                
                if (cachedImage && cachedProfile.pictureFileId) {
                    document.getElementById('profilePic').innerHTML = `<img src="${cachedImage}" alt="Profile">`;
                } else {
                    document.getElementById('profilePic').innerHTML = `<div class="profile-pic-default"><i class="fas fa-user"></i></div>`;
                }
            }
            
            fetch(API_URL + '?action=getProfile')
                .then(response => response.text())
                .then(text => {
                    try {
                        const result = JSON.parse(text);
                        if (result.success && result.user) {
                            const user = result.user;
                            document.getElementById('userName').value = user.name || '-';
                            document.getElementById('userNoKad').value = user.noKad || '-';
                            document.getElementById('userRole').value = user.role || '-';
                            document.getElementById('userEmail').value = user.email || '-';
                            CacheManager.set(CONFIG.PROFILE_CACHE_KEY, user);
                            
                            if (user.pictureFileId && user.pictureFileId.trim() !== "") {
                                fetch(API_URL + '?action=getImage&fileId=' + encodeURIComponent(user.pictureFileId))
                                    .then(res => res.text())
                                    .then(imgText => {
                                        try {
                                            const imgResult = JSON.parse(imgText);
                                            if (imgResult.success && imgResult.base64 && imgResult.base64.length > 100) {
                                                document.getElementById('profilePic').innerHTML = `<img src="${imgResult.base64}" alt="Profile">`;
                                                CacheManager.set(CONFIG.IMAGE_CACHE_KEY, imgResult.base64);
                                            }
                                        } catch(e) {}
                                    });
                            } else {
                                document.getElementById('profilePic').innerHTML = `<div class="profile-pic-default"><i class="fas fa-user"></i></div>`;
                            }
                        }
                    } catch (e) {}
                })
                .catch(error => { console.error("Network Error:", error); });
        }

        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempPhotoBase64 = e.target.result;
                    hasNewPhoto = true;
                    document.getElementById('profilePic').innerHTML = `<img src="${tempPhotoBase64}" alt="Preview">`;
                    showToast('📷 Gambar dipilih. Klik "Save Changes"', 'warning');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveProfilePicture() {
            if (!hasNewPhoto || !tempPhotoBase64) {
                showToast('⚠️ Sila pilih gambar baru dahulu!', 'warning');
                return;
            }
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Saving...';
            saveBtn.disabled = true;

            const payload = { action: 'updateProfilePicture', base64: tempPhotoBase64, fileName: 'profile.jpg' };

            fetch(CONFIG.API_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload)
            })
            .then(() => {
                showToast('✅ Profil berjaya dikemaskini!', 'success');
                
                CacheManager.set(CONFIG.IMAGE_CACHE_KEY, tempPhotoBase64);
                document.getElementById('profilePic').innerHTML = `<img src="${tempPhotoBase64}" alt="Profile" style="width:100%; height:100%; object-fit:cover;">`;
                
                hasNewPhoto = false;
                tempPhotoBase64 = '';
                document.getElementById('photoInput').value = '';
                saveBtn.innerHTML = '<i class="fas fa-save me-2"></i> Save Changes';
                saveBtn.disabled = false;
            })
            .catch(err => {
                showToast('❌ Ralat semasa menyimpan', 'error');
                saveBtn.innerHTML = '<i class="fas fa-save me-2"></i> Save Changes';
                saveBtn.disabled = false;
            });
        }
        
        window.onload = loadProfile;
    </script>
</body>
</html>
